# CI runs markdownlint-cli2 via the action commit pinned in
# .github/workflows/markdown.yml. Local devs: `task markdown-lint` (which runs
# `npx -y markdownlint-cli2@<MDLINT_VERSION> '**/*.md'`). Bump both together.
config:
  MD013:
    line_length: 120
    code_blocks: false
    tables: false
  MD024: false
  # MD060 (table-column-style) requires fully-aligned or fully-compact tables;
  # auto-formatters fight this rule and it adds no readability value.
  MD060: false
fix: true
gitignore: true
ignores:
  - node_modules/
  - .github/agents/segment-docs.md
  - .github/PULL_REQUEST_TEMPLATE.md
