version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - dupl
    - errcheck
    - exhaustive
    - goconst
    - gocritic
    - gocyclo
    - goprintffuncname
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - noctx
    - nolintlint
    - revive
    - rowserrcheck
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - opinionated
        - performance
        - style
      disabled-tags:
        - experimental
    lll:
      line-length: 180
    revive:
      rules:
        - name: var-naming
          disabled: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - goconst
      # The following packages hold file-local data declarations (color names,
      # file-glob lists, segment fixture strings). Extracting these into shared
      # constants reduces, not improves, readability — each file is meant to be
      # self-contained. Shared cross-file duplicates that ARE worth deduping
      # (e.g. the version-parsing flag/regex) are extracted in segments/language.go.
      - path: segments/
        linters:
          - goconst
      - path: config/
        linters:
          - goconst
      - path: cli/image/
        linters:
          - goconst
      - path: color/
        linters:
          - goconst
      - path: terminal/
        linters:
          - goconst
      - path: text/
        linters:
          - goconst
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
