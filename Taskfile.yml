# Taskfile for prompto — https://taskfile.dev
#
# Every tool is invoked through `go tool` so versions are pinned in src/go.mod
# and CI runs byte-identical binaries. Run `task` (or `task --list`) to see all
# available tasks.
version: "3"

vars:
  # Output path for the built binary, relative to src/. Override with:
  #   task build OUTPUT=/some/where/prompto
  OUTPUT: '{{.OUTPUT | default "../bin/prompto"}}'
  # markdownlint-cli2 version — keep in sync with .github/workflows/markdown.yml.
  MDLINT_VERSION: 0.23.1
  # commitlint major version used by the `commit-lint` task (Node tooling).
  COMMITLINT_VERSION: 19
  # Numeric App ID of the GitHub App that arms Dependabot auto-merge (same App as
  # dependabot_tidy.yml), used as a ruleset bypass actor so only Dependabot's PRs
  # skip the required review. `setup:branch-protection` reads it from the repo's
  # Actions *variable* TIDY_APP_ID (`gh variable set TIDY_APP_ID --body …`) — it
  # is not a secret, and a local task can't read Dependabot secrets anyway. This
  # var is just an optional override: `task setup TIDY_APP_ID=…`.
  TIDY_APP_ID: '{{.TIDY_APP_ID | default ""}}'

tasks:
  default:
    desc: List all available tasks
    silent: true
    dir: src
    cmds:
      - go tool task --list

  build:
    desc: Build for the host OS/arch → ./bin/prompto (OUTPUT overrides the path)
    dir: src
    cmds:
      - go build -o {{.OUTPUT}} .

  # Internal helper: cross-compile for an explicit GOOS/GOARCH. The artifact is
  # named bin/prompto-<os>-<arch> so every target lands in ./bin without
  # clobbering the others. Pure-Go build (no cgo), so cross-compiling is clean.
  build:target:
    internal: true
    dir: src
    label: 'build:{{.GOOS}}-{{.GOARCH}}'
    requires:
      vars: [GOOS, GOARCH]
    env:
      GOOS: '{{.GOOS}}'
      GOARCH: '{{.GOARCH}}'
      CGO_ENABLED: '0'
    cmds:
      - go build -o ../bin/prompto-{{.GOOS}}-{{.GOARCH}} .

  build:linux-amd64:
    desc: Cross-compile for Linux x86_64 → bin/prompto-linux-amd64
    cmds:
      - task: build:target
        vars: {GOOS: linux, GOARCH: amd64}

  build:linux-arm64:
    desc: Cross-compile for Linux arm64 → bin/prompto-linux-arm64
    cmds:
      - task: build:target
        vars: {GOOS: linux, GOARCH: arm64}

  build:darwin-arm64:
    desc: Cross-compile for macOS (Apple Silicon) → bin/prompto-darwin-arm64
    cmds:
      - task: build:target
        vars: {GOOS: darwin, GOARCH: arm64}

  build:freebsd-amd64:
    desc: Cross-compile for FreeBSD x86_64 → bin/prompto-freebsd-amd64
    cmds:
      - task: build:target
        vars: {GOOS: freebsd, GOARCH: amd64}

  build:freebsd-arm64:
    desc: Cross-compile for FreeBSD arm64 → bin/prompto-freebsd-arm64
    cmds:
      - task: build:target
        vars: {GOOS: freebsd, GOARCH: arm64}

  build:all:
    desc: Cross-compile every release target into ./bin
    cmds:
      - task: build:linux-amd64
      - task: build:linux-arm64
      - task: build:darwin-arm64
      - task: build:freebsd-amd64
      - task: build:freebsd-arm64

  generate:
    desc: Run go generate across all packages (protobuf, bundled themes/shell scripts)
    dir: src
    cmds:
      - go generate ./...

  generate:check:
    desc: Regenerate code and fail if committed generated files are out of date
    dir: src
    cmds:
      - go generate ./...
      - |
        if ! git diff --exit-code -- '*_gen.go' '**/*.pb.go'; then
          git --no-pager diff --stat -- '*_gen.go' '**/*.pb.go'
          echo "generated files are out of date — commit the changes above"
          exit 1
        fi
        echo "generated files are up to date"

  run:
    desc: Build and run prompto
    dir: src
    cmds:
      - go run .

  clean:
    # `git clean -dfX` removes only git-IGNORED files (bin/, dist/, coverage,
    # editor cruft, stray node_modules) — restoring a fresh-clone tree while
    # leaving your code changes (modified tracked files AND new untracked
    # sources) untouched. Also clears Go's local test cache so tests re-run
    # from scratch. Preview first with `task clean:dry`.
    desc: Remove build/test artifacts — restore a fresh-clone tree (keeps code changes)
    cmds:
      - git clean -dfX
      - go -C src clean -testcache

  clean:dry:
    desc: Show what `task clean` would remove, without deleting anything
    cmds:
      - git clean -dnX

  test:unit:
    desc: Run unit tests
    dir: src
    cmds:
      - go test -count=1 ./...

  test:race:
    desc: Run tests with the race detector on concurrent packages (daemon, log, prompt)
    dir: src
    cmds:
      - go test -race -count=3 ./daemon/... ./log/... ./prompt/...

  fmt:
    desc: Format Go code (gofmt + goimports via golangci-lint)
    dir: src
    cmds:
      - go tool golangci-lint fmt

  vet:
    desc: Run go vet
    dir: src
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint (go tool)
    dir: src
    cmds:
      - go tool golangci-lint run

  modernize:
    # /daemon/ipc contains generated protobuf code that upstream tools cannot satisfy.
    desc: Run the modernize analyzer (go tool)
    dir: src
    cmds:
      - go list ./... | grep -v '/daemon/ipc$' | xargs go tool modernize

  fieldalignment:
    # /daemon/ipc contains generated protobuf code that upstream tools cannot satisfy.
    desc: Run the fieldalignment analyzer (go tool)
    dir: src
    cmds:
      - go list ./... | grep -v '/daemon/ipc$' | xargs go tool fieldalignment

  tidy:
    desc: Tidy go.mod / go.sum
    dir: src
    cmds:
      - go mod tidy

  tidy:check:
    desc: Fail if go.mod / go.sum are not tidy (CI parity — mirrors gomod.yml)
    dir: src
    cmds:
      - go mod tidy
      - |
        if ! git diff --exit-code -- go.mod go.sum; then
          git --no-pager diff -- go.mod go.sum
          echo "go mod tidy is needed — commit the changes above"
          exit 1
        fi
        echo "go.mod / go.sum are tidy"

  markdown-lint:
    desc: Lint Markdown files (runs from the repo root)
    cmds:
      - npx -y markdownlint-cli2@{{.MDLINT_VERSION}} '**/*.md'

  commit-lint:
    # Pure npx — nothing is installed in the repo. The catch: commitlint resolves
    # `extends: @commitlint/config-conventional` from the CURRENT DIRECTORY, not
    # from where its binary lives, so it can't see the preset npx installed in its
    # own cache. Fix: npx puts <cache>/node_modules/.bin on PATH for the spawned
    # command, so inside `sh -c` we derive that node_modules from the resolved
    # `commitlint` path and hand it to commitlint via NODE_PATH. npx caches by
    # package set, so repeat runs don't reinstall.
    # By default lints the most recent commit; override the source, e.g.:
    #   task commit-lint SOURCE='--from origin/main --to HEAD'
    #   task commit-lint SOURCE='--edit .git/COMMIT_EDITMSG'
    desc: Lint commit messages against .commitlintrc.cjs (Conventional Commits)
    silent: true
    env:
      npm_config_loglevel: error   # hush npm's transitive-dep deprecation warnings
    vars:
      SOURCE: '{{.SOURCE | default "--last"}}'
    cmds:
      - >-
        npx -y
        --package @commitlint/cli@{{.COMMITLINT_VERSION}}
        --package @commitlint/config-conventional@{{.COMMITLINT_VERSION}}
        --
        sh -c 'NODE_PATH="$(dirname "$(dirname "$(command -v commitlint)")")"
        commitlint --config .commitlintrc.cjs {{.SOURCE}} --verbose'

  # Aggregate task: everything CI enforces on Go code. Run this before pushing.
  test:
    desc: Run the full check suite — vet, lint, modernize, fieldalignment, unit tests, race tests
    cmds:
      - task: vet
      - task: lint
      - task: modernize
      - task: fieldalignment
      - task: test:unit
      - task: test:race

  # ── Project bootstrap: one-time setup for a repo cloned from this template ────
  setup:
    desc: One-time setup for a new project (protect the default branch, set merge settings)
    cmds:
      - task: setup:branch-protection
      - task: setup:merge-settings

  setup:branch-protection:
    # Generic across every project cloned from this template: the repo slug is
    # read from the checkout's origin remote via `gh`, nothing is hardcoded, and
    # the rule targets ~DEFAULT_BRANCH so it works whatever the branch is named.
    # Creates (or updates in place — re-runnable, no duplicates) a "protected"
    # repository *ruleset*, GitHub's modern replacement for branch protection.
    # Requires the GitHub CLI authenticated with admin on the repo.
    #
    # Policy: a PR is required (no direct pushes), 1 approving review, the four CI
    # checks must pass, plus no force-push and no branch deletion. Two bypass
    # actors skip the review: repository admins (you — also your force-merge
    # escape hatch) and the auto-merge GitHub App (TIDY_APP_ID), so only
    # Dependabot's PRs auto-merge without a human review. Everyone else needs one.
    # Not-yet-seen check contexts are accepted as "Expected".
    desc: 'Create/update the "protected" ruleset (PR + CI checks + 1 review, App/admin bypass)'
    vars:
      REPO:
        sh: gh repo view --json nameWithOwner -q .nameWithOwner
    cmds:
      - |
        set -euo pipefail
        repo="{{.REPO}}"; name="protected"
        # Numeric App ID of the auto-merge App — a ruleset bypass actor for the
        # review rule (everyone else needs 1 approving review). Read from the
        # repo's Actions *variable* store; a TIDY_APP_ID= task arg overrides it.
        app_id="{{.TIDY_APP_ID}}"
        if [ -z "$app_id" ]; then
          app_id=$(gh api "repos/${repo}/actions/variables/TIDY_APP_ID" --jq '.value' 2>/dev/null || true)
        fi
        if ! printf '%s' "$app_id" | grep -qE '^[0-9]+$'; then
          echo "ERROR: TIDY_APP_ID (numeric App ID of the auto-merge App) not found." >&2
          echo "  Store it as a repo variable:  gh variable set TIDY_APP_ID --repo ${repo} --body 123456" >&2
          echo "  (or pass it once:  task setup TIDY_APP_ID=123456)" >&2
          exit 1
        fi
        # A failure listing rulesets almost always means the repo can't use them:
        # a private repo on a free plan must be public or on GitHub Pro/Team.
        if ! ids=$(gh api "repos/${repo}/rulesets" --jq ".[] | select(.name==\"${name}\") | .id" 2>&1); then
          echo "ERROR: cannot manage rulesets on ${repo} — needs a PUBLIC repo or GitHub Pro/Team." >&2
          echo "  make public:  gh repo edit ${repo} --visibility public" >&2
          printf '%s\n' "$ids" >&2
          exit 1
        fi
        id=$(printf '%s' "$ids" | head -n1)
        if [ -n "$id" ]; then method=PUT; url="repos/${repo}/rulesets/${id}"; echo "Updating ruleset ${name} (#${id}) on ${repo}"; else method=POST; url="repos/${repo}/rulesets"; echo "Creating ruleset ${name} on ${repo}"; fi
        gh api --method "$method" "$url" --input - <<JSON
        {
          "name": "protected",
          "target": "branch",
          "enforcement": "active",
          "bypass_actors": [
            {"actor_id": 5, "actor_type": "RepositoryRole", "bypass_mode": "always"},
            {"actor_id": ${app_id}, "actor_type": "Integration", "bypass_mode": "always"}
          ],
          "conditions": {"ref_name": {"include": ["~DEFAULT_BRANCH"], "exclude": []}},
          "rules": [
            {"type": "deletion"},
            {"type": "non_fast_forward"},
            {"type": "pull_request", "parameters": {
              "required_approving_review_count": 1,
              "dismiss_stale_reviews_on_push": false,
              "require_code_owner_review": false,
              "require_last_push_approval": false,
              "required_review_thread_resolution": false,
              "allowed_merge_methods": ["squash", "rebase"]
            }},
            {"type": "required_status_checks", "parameters": {
              "strict_required_status_checks_policy": false,
              "do_not_enforce_on_create": false,
              "required_status_checks": [
                {"context": "post-check"},
                {"context": "convention"},
                {"context": "tidy-check"},
                {"context": "check"}
              ]
            }}
          ]
        }
        JSON

  setup:merge-settings:
    # Configures the repo-level PR/merge settings: enables "Allow auto-merge" (so
    # dependabot_automerge.yml can arm native auto-merge), disables "Allow merge
    # commits" (squash/rebase only — keeps history linear; the ruleset enforces
    # the same on the default branch), auto-deletes head branches after merge, and
    # sets the squash commit to "PR title + commit details" (title=PR_TITLE,
    # message=COMMIT_MESSAGES) — so the PR title becomes the commit subject, which
    # commits.yml lints against the commit convention. Squash and rebase stay
    # enabled. Idempotent. Repo slug from the origin remote; needs `gh` admin.
    desc: Repo merge settings — auto-merge, no merge commits, delete branch, squash=PR title+commits
    vars:
      REPO:
        sh: gh repo view --json nameWithOwner -q .nameWithOwner
    cmds:
      - |
        echo "Merge config on {{.REPO}}: auto-merge, squash=PR-title+commits, no merge commits, delete branch"
        gh api --method PATCH "repos/{{.REPO}}" \
          -F allow_auto_merge=true \
          -F allow_merge_commit=false \
          -F delete_branch_on_merge=true \
          -f squash_merge_commit_title=PR_TITLE \
          -f squash_merge_commit_message=COMMIT_MESSAGES \
          --silent

  setup:app-credentials:
    # Pushes the tidy/auto-merge GitHub App credentials from 1Password into the
    # repo. ULTRA-SAFE by construction: every value flows `op read` → `gh` over a
    # PIPE — it never lands on disk, never becomes a command-line argument (so not
    # in `ps` or shell history), never enters the environment (so not inherited by
    # child processes), and is never printed. `gh` also encrypts each secret
    # client-side (libsodium sealed box) before upload. Needs `op` (1Password CLI)
    # signed in and `gh` authenticated with admin on the repo.
    #
    # Point these env vars at YOUR 1Password item. They are op:// *references*, not
    # secrets — but they reveal your vault layout, so DON'T commit them to a public
    # repo; export them from your shell / a local (gitignored) env file:
    #   OP_CLIENT_ID_REF    op:// path to the App Client ID
    #   OP_PRIVATE_KEY_REF  op:// path to the App private key (.pem)
    #   OP_APP_ID_REF       op:// path to the numeric App ID
    desc: 'Push App creds from 1Password → Dependabot secrets + TIDY_APP_ID variable'
    vars:
      REPO:
        sh: gh repo view --json nameWithOwner -q .nameWithOwner
    cmds:
      - |
        set -euo pipefail
        command -v op >/dev/null || { echo "1Password CLI (op) not found on PATH" >&2; exit 1; }
        : "${OP_CLIENT_ID_REF:?export OP_CLIENT_ID_REF=op://Vault/Item/field}"
        : "${OP_PRIVATE_KEY_REF:?export OP_PRIVATE_KEY_REF=op://Vault/Item/field}"
        : "${OP_APP_ID_REF:?export OP_APP_ID_REF=op://Vault/Item/field}"
        repo="{{.REPO}}"
        # Single-line values: strip any trailing newline in-pipe (never in args).
        echo "→ Dependabot secret TIDY_APP_CLIENT_ID"
        op read "$OP_CLIENT_ID_REF"  | tr -d '\r\n' | gh secret set TIDY_APP_CLIENT_ID --app dependabot --repo "$repo"
        # Private key is multi-line — pipe it through untouched.
        echo "→ Dependabot secret TIDY_APP_PRIVATE_KEY"
        op read "$OP_PRIVATE_KEY_REF" | gh secret set TIDY_APP_PRIVATE_KEY --app dependabot --repo "$repo"
        echo "→ Actions variable TIDY_APP_ID"
        op read "$OP_APP_ID_REF"      | tr -d '\r\n' | gh variable set TIDY_APP_ID --repo "$repo"
        echo "✓ pushed — values stayed in-pipe (no disk, args, env, or history)"
