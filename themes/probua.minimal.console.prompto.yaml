# Console variant of the `probua.minimal` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of probua.minimal.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

git:
    options:
        branch_icon: ""
        fetch_status: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    template: git:{{ if or (.Working.Changed) (.Staging.Changed) (gt .StashCount 0) }}<lightYellow>{{ .HEAD }}</>{{ else }}{{ .HEAD }}{{ end }}{{ if .Staging.Changed }} <white>{{ .Staging.String }}</>{{ end }}{{ if .Working.Changed }} <lightRed>{{ .Working.String }}</>{{ end }}
path:
    foreground: lightBlue
    options:
        style: full
        windows_registry_icon: reg
    template: '{{ .Path }} '
prompt:
    - segments:
        - session
        - path
        - git
    - segments:
        - status
session:
    foreground: lightYellow
    template: '{{ .UserName }}@{{ .HostName }} '
status:
    foreground: lightYellow
    foreground_templates:
        - '{{ if gt .Code 0 }}lightBlue{{ end }}'
    options:
        always_enabled: true
    template: '> '
