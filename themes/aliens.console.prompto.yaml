cursor_padding: true
git:
    background: lightGreen
    foreground: darkGray
    trailing_separator: '>'
    template: ' {{ .HEAD }} '
    options:
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
path:
    background: lightMagenta
    foreground: lightWhite
    options:
        style: full
        windows_registry_icon: reg
    trailing_separator: '>'
    template: ' {{ .Path }} '
prompt:
    - segments:
        - session
        - path
        - git
        - python
python:
    background: lightRed
    foreground: lightWhite
    leading_separator: <transparent,background>></>
    template: ' {{ if .Error }}{{ .Error }}{{ else }}{{ if .Venv }}{{ .Venv }} {{ end }}{{ .Full }}{{ end }} '
    trailing_separator: )
session:
