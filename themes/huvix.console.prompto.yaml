# Code generated by src/tools/genconsolethemes; DO NOT EDIT.
#
# Console variant of "huvix", for the Linux virtual console.
#
# Nerd Font icons are removed and Powerline separators replaced with ASCII,
# because a console font carries neither. Colors are approximated to the 16
# ANSI colors a console can show, so themes that differ only in shade look
# alike here.
#
# To take this file over, delete the generated marker on the first line: the
# generator then leaves it alone. Otherwise edit huvix.prompto.yaml and regenerate.

battery:
    foreground: darkGray
    foreground_templates:
        - '{{if eq "Charging" .State.String}}lightCyan{{end}}'
        - '{{if eq "Discharging" .State.String}}lightRed{{end}}'
        - '{{if eq "Full" .State.String}}lightGreen{{end}}'
    options:
        charged_icon: ' '
        charging_icon: ' '
        discharging_icon: ' '
    trailing_separator: '>'
    template: '[{{ if not .Error }}{{ .Icon }}{{ .Percentage }}{{ end }}{{ .Error }}]'
executiontime:
    foreground: white
    options:
        always_enabled: false
        style: austin
        threshold: 100
    trailing_separator: '>'
    template: '{{ .FormattedMs }}'
cursor_padding: true
git:
    foreground: cyan
    options:
        branch_icon: ""
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    template: <white>git(</>{{ .HEAD }}<white>) </>
go:
    foreground: lightCyan
    trailing_separator: '>'
    template: '({{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}) '
path:
    foreground: cyan
    options:
        style: agnoster_short
        windows_registry_icon: reg
    template: ' {{ .Path }} '
prompt:
    - segments:
        - session
        - path
        - go
        - python
        - git
        - executiontime
    - segments:
        - battery
python:
    foreground: lightBlue
    trailing_separator: '>'
    template: '( {{ if .Error }}{{ .Error }}{{ else }}{{ if .Venv }}{{ .Venv }} {{ end }}{{ .Full }}{{ end }}) '
session:
    foreground: lightYellow
    template: '@{{ .UserName }} >'
