# Console variant of the `cloud-context` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of cloud-context.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

aws:
    background: p:background-color
    foreground: p:cloud-text-amazon
    style: powerline
    template: ' <p:symbol-color></> {{.Profile}}{{if .Region}} {{.Region}}{{end}}'
az:
    background: p:background-color
    foreground: p:cloud-text-azure
    options:
        source: cli
    style: powerline
    template: ' <p:symbol-color></> {{ .Name }}'
az.2:
    background: p:background-color
    foreground: p:cloud-text-azure
    options:
        source: pwsh
    style: powerline
    template: ' <p:symbol-color></> (PS) {{ .Name }}'
console_title_template: '{{ if or .Root .Segments.Git.RepoName }}[ {{ if .Root }}Admin{{ end }}{{ if and .Root .Segments.Git.RepoName }}@{{ end }}{{ if .Segments.Git.RepoName }}{{ .Segments.Git.RepoName }}{{ end }} ]{{ end }} {{ .Folder }}'
executiontime:
    background: p:background-color
    foreground: p:timer-text
    options:
        style: austin
        threshold: 1
    trailing_style: powerline
    template: ' <p:symbol-color></> {{ .FormattedMs }}'
firebase:
    background: p:background-color
    foreground: p:cloud-text-firebase
    style: powerline
    template: ' <p:symbol-color></> {{ .Project }}'
gcp:
    background: p:background-color
    foreground: p:cloud-text-gcp
    style: powerline
    template: ' <p:symbol-color></> {{ .Project }}'
git:
    background: p:background-color
    foreground: p:git-text
    style: powerline
    template: ' <p:symbol-color></> {{ .RepoName }}'
    options:
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
git.2:
    background: p:background-color
    foreground: p:git-text
    options:
        fetch_status: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    style: powerline
    template: '{{ .HEAD }}{{ if .Staging.Changed }} {{ .Staging.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Working.Changed }} {{ .Working.String }}{{ end }}{{ if gt .StashCount 0 }} {{ .StashCount }}{{ end }} '
kubectl:
    background: p:background-color
    foreground: p:kubernetes-text
    style: powerline
    template: <p:symbol-color></> {{.Context}}{{if .Namespace}} {{.Namespace}}{{end}}
palette:
    background-color: transparent
    cloud-text-amazon: lightBlue
    cloud-text-azure: lightBlue
    cloud-text-firebase: lightRed
    cloud-text-gcp: lightBlue
    error-background: red
    error-text: black
    git-text: green
    kubernetes-text: lightYellow
    symbol-color: lightWhite
    talosctl-text: lightRed
    timer-text: red
path:
    background: p:background-color
    foreground: p:symbol-color
    options:
        folder_separator_icon: /
        style: folder
        windows_registry_icon: reg
    trailing_style: powerline
    template: ' {{ path .Path .Location }} '
prompt:
    - segments:
        - time
        - kubectl
        - talosctl
        - aws
        - az
        - az.2
        - gcp
        - firebase
        - git
        - executiontime
        - status
        - status.2
    - segments:
        - time.2
        - path
        - git.2
    - segments:
        - root
        - text
root:
    background: p:error-background
    foreground: p:background-color
    leading_separator: )
    template: ' # '
    trailing_separator: (
status:
    background: p:background-color
    foreground: p:symbol-color
    options:
        always_enabled: true
    style: powerline
    template: '{{ if eq .Code 0 }} {{ end }}'
status.2:
    background: p:error-background
    foreground: p:error-text
    leading_separator: ' |'
    template: '{{ if ne .Code 0 }} {{ .Code }}{{ if (ne (reason .Code) (toString .Code)) }} - {{ reason .Code }}{{else}}{{ end }} {{ end }}'
    trailing_separator: '|'
talosctl:
    background: p:background-color
    foreground: p:talosctl-text
    style: powerline
    template: <p:symbol-color></> {{.Context}}
text:
    background: p:background-color
    foreground: p:git-text
    template: '{{ if .Root }}{{ else }}<p:symbol-color> > </>{{ end }}'
time:
    background: p:background-color
    foreground: p:timer-text
    options:
        time_format: "15:04:05"
    style: powerline
    template: ' <p:symbol-color></> {{ dateInZone .Format .LastDate "UTC" }} '
time.2:
    background: p:background-color
    foreground: p:timer-text
    options:
        time_format: "15:04:05"
    style: powerline
    template: ' <p:symbol-color></> {{ .LastDate | date .Format }} '
