# Console variant of the `glowsticks` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of glowsticks.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

console_title_template: ' {{ .Shell }} in {{ if ne .Folder "~"}} {{ .Folder }}{{else}}{{end}}'
cursor_padding: true
palette:
    black: darkGray
    blue: cyan
    darkred: red
    green: darkGray
    orange: lightRed
    red: lightRed
    white: lightWhite
prompt:
    - segments:
        - session
        - path
        - executiontime
        - status
rprompt:
    - segments:
        - shell
        - battery
secondary:
    - segments:
        - text.secondary
transient:
    - segments:
        - text.transient
battery:
    background_templates:
        - '{{if eq "Charging" .State.String }}p:green{{end}}'
        - '{{if eq "Discharging" .State.String}}p:orange{{end}}'
    foreground: p:white
    leading_separator: <
    options:
        charged_icon: ""
        charging_icon: ""
        discharging_icon: ' '
    template: ' {{.Templates }}{{ .Percentage}} <transparent><</>'
    templates:
        - '{{if eq "Discharging" .State.String}}{{if lt .Percentage 11}}{{else if lt .Percentage 21}}{{else if lt .Percentage 31}}{{else if lt .Percentage 41}}{{else if lt .Percentage 51}}{{else if lt .Percentage 61}}{{else if lt .Percentage 71}}{{else if lt .Percentage 81}}{{else if lt .Percentage 91}}{{else}}{{end}}{{end}}'
        - '{{if eq "Charging" .State.String}}{{ if lt .Percentage 21}}{{else if lt .Percentage 31}}{{else if lt .Percentage 41}}{{else if lt .Percentage 61}}{{else if lt .Percentage 81}}{{else if lt .Percentage 91}}{{else}}{{end}}{{end}}'
    templates_logic: first_match
executiontime:
    background: p:darkred
    foreground: p:white
    options:
        always_enabled: true
        style: round
    trailing_separator: '>'
    template: ' {{ .FormattedMs }} '
path:
    background: p:orange
    foreground: p:white
    options:
        home_icon: ""
        style: folder
        windows_registry_icon: reg
    trailing_separator: '>'
    template: ' {{ .Path }} '
session:
    background: p:black
    foreground: p:white
    trailing_separator: '>'
    template: '{{ .UserName }}@{{ .HostName }} '
shell:
    background: p:black
    foreground: p:white
    template: <p:black,transparent>(</> {{ .Name }}<transparent,p:black><</>
status:
    background: p:blue
    background_templates:
        - '{{ if gt .Code 0 }}p:red{{ end }}'
    foreground: p:white
    options:
        always_enabled: true
    template: ' {{ if gt .Code 0 }} {{ reason .Code }}{{ else }}{{ end }} '
    trailing_separator: )
text.secondary:
    foreground: p:white
    template: ' '
text.transient:
    foreground: p:white
    template: ' '
