# Code generated by src/tools/genconsolethemes; DO NOT EDIT.
#
# Console variant of "glowsticks", for the Linux virtual console.
#
# Nerd Font icons are removed and Powerline separators replaced with ASCII,
# because a console font carries neither. Colors are approximated to the 16
# ANSI colors a console can show, so themes that differ only in shade look
# alike here.
#
# To take this file over, delete the generated marker on the first line: the
# generator then leaves it alone. Otherwise edit glowsticks.prompto.yaml and regenerate.

console_title_template: ' {{ .Shell }} in {{ if ne .Folder "~"}} {{ .Folder }}{{else}}{{end}}'
cursor_padding: true
palette:
    black: darkGray
    blue: cyan
    darkred: red
    green: darkGray
    orange: lightRed
    red: lightRed
    white: lightWhite
prompt:
    - segments:
        - session
        - path
        - executiontime
        - status
rprompt:
    - segments:
        - shell
        - battery
secondary:
    - segments:
        - text.secondary
transient:
    - segments:
        - text.transient
battery:
    background_templates:
        - '{{if eq "Charging" .State.String }}p:green{{end}}'
        - '{{if eq "Discharging" .State.String}}p:orange{{end}}'
    foreground: p:white
    leading_separator: <
    options:
        charged_icon: ""
        charging_icon: ""
        discharging_icon: ' '
    template: ' {{.Templates }}{{ .Percentage}} <transparent><</>'
    templates:
        - '{{if eq "Discharging" .State.String}}{{if lt .Percentage 11}}{{else if lt .Percentage 21}}{{else if lt .Percentage 31}}{{else if lt .Percentage 41}}{{else if lt .Percentage 51}}{{else if lt .Percentage 61}}{{else if lt .Percentage 71}}{{else if lt .Percentage 81}}{{else if lt .Percentage 91}}{{else}}{{end}}{{end}}'
        - '{{if eq "Charging" .State.String}}{{ if lt .Percentage 21}}{{else if lt .Percentage 31}}{{else if lt .Percentage 41}}{{else if lt .Percentage 61}}{{else if lt .Percentage 81}}{{else if lt .Percentage 91}}{{else}}{{end}}{{end}}'
    templates_logic: first_match
executiontime:
    background: p:darkred
    foreground: p:white
    options:
        always_enabled: true
        style: round
    trailing_separator: '>'
    template: ' {{ .FormattedMs }} '
path:
    background: p:orange
    foreground: p:white
    options:
        home_icon: ""
        style: folder
        windows_registry_icon: reg
    trailing_separator: '>'
    template: ' {{ .Path }} '
session:
    background: p:black
    foreground: p:white
    trailing_separator: '>'
    template: '{{ .UserName }}@{{ .HostName }} '
shell:
    background: p:black
    foreground: p:white
    template: <p:black,transparent>(</> {{ .Name }}<transparent,p:black><</>
status:
    background: p:blue
    background_templates:
        - '{{ if gt .Code 0 }}p:red{{ end }}'
    foreground: p:white
    options:
        always_enabled: true
    template: ' {{ if gt .Code 0 }} {{ reason .Code }}{{ else }}{{ end }} '
    trailing_separator: )
text.secondary:
    foreground: p:white
    template: ' '
text.transient:
    foreground: p:white
    template: ' '
