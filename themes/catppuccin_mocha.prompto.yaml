cursor_padding: true
git:
    foreground: p:lavender
    options:
        branch_icon: ' '
        cherry_pick_icon: ' '
        commit_icon: ' '
        fetch_status: false
        fetch_upstream_icon: false
        merge_icon: ' '
        no_commits_icon: ' '
        rebase_icon: ' '
        revert_icon: ' '
        tag_icon: ' '
    template: '{{ .HEAD }} '
os:
    foreground: p:os
    template: '{{.Icon}} '
palette:
    blue: '#89B4FA'
    closer: p:os
    lavender: '#B4BEFE'
    os: '#ACB0BE'
    pink: '#F5C2E7'
path:
    foreground: p:pink
    options:
        folder_icon: ....
        home_icon: "~"
        style: agnoster_short
    template: '{{ .Path }} '
prompt:
    - segments:
        - os
        - session
        - path
        - git
        - text
session:
    foreground: p:blue
    template: '{{ .UserName }}@{{ .HostName }} '
text:
    foreground: p:closer
    template: 
