# Console variant of the `chips` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of chips.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

battery:
    background_templates:
        - '{{ if .Error }}p:c-battery-state-error{{ end }}'
        - '{{ if le .Percentage 15 }}p:c-battery-15-less{{ end }}'
        - '{{ if and (ge .Percentage 16) (le .Percentage 30) }}p:c-battery-30-less{{ end }}'
        - '{{ if and (ge .Percentage 31) (le .Percentage 45) }}p:c-battery-45-less{{ end }}'
        - '{{ if and (ge .Percentage 46) (le .Percentage 55) }}p:c-battery-55-less{{ end }}'
        - '{{ if and (ge .Percentage 56) (le .Percentage 70) }}p:c-battery-70-less{{ end }}'
        - '{{ if and (ge .Percentage 71) (le .Percentage 90) }}p:c-battery-90-less{{ end }}'
        - '{{ if and (ge .Percentage 91) (le .Percentage 100) }}p:c-battery-100-less{{ end }}'
    foreground: p:c-badge-text
    leading_style: rounded
    template: '{{ if eq "True" (title (default "False" .Env.DISABLE_SEGMENT_BATTERY)) }}{{ else }}{{ if not .Error }}{{ if eq "Charging" .State.String }} {{ else if eq "Discharging" .State.String }}{{ else if eq "Full" .State.String }}~ {{ else }}? {{ end }}{{ if le .Percentage 15 }}{{ else if and (ge .Percentage 16) (le .Percentage 30) }}{{ else if and (ge .Percentage 31) (le .Percentage 45) }}{{ else if and (ge .Percentage 46) (le .Percentage 55)}}{{ else if and (ge .Percentage 56) (le .Percentage 70) }}{{ else if and (ge .Percentage 71) (le .Percentage 80) }}{{ else if and (ge .Percentage 81) (le .Percentage 95) }}{{ else }}{{ end }} {{ .Percentage }}%{{ else }}!{{ end }}{{ end }}'
    trailing_style: rounded
console_title_template: '{{ if .Segments.Session.SSHSession }}SSH''d{{ if or .Root }} & {{ end }}{{ end }}{{ if .Root }}# (as {{ .UserName }}) | {{ end }}{{ if .WSL }}WSL | {{ end }}{{ .Folder }} ({{ .Shell }})'
crystal:
    background_templates:
        - '{{ if empty .Full }}p:c-project-generic-error{{ else }}p:c-project-crystal{{ end }}'
    foreground: p:c-badge-text
    leading_style: rounded
    template: '{{ if eq "False" (title (default "False" .Env.DISABLE_SEGMENT_PROJECT_CRYSTAL)) }} {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}{{ end }}'
    trailing_separator: ') '
dart:
    background_templates:
        - '{{ if empty .Full }}p:c-project-generic-error{{ else }}p:c-project-flutter{{ end }}'
    foreground: p:c-badge-text
    leading_style: rounded
    template: '{{ if eq "False" (title (default "False" .Env.DISABLE_SEGMENT_PROJECT_FLUTTER)) }}Flutter | {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}{{ end }}'
    trailing_separator: ') '
executiontime:
    background_templates:
        - '{{ if lt .Ms 60000 }}p:c-exec-fast{{ end }}'
        - '{{ if lt .Ms 3600000 }}p:c-exec-normal{{ end }}'
        - '{{ if lt .Ms 10800000 }}p:c-exec-slow{{ end }}'
        - '{{ if ge .Ms 10800000 }}p:c-exec-slower{{ end }}'
    foreground: p:c-badge-text
    leading_style: rounded
    options:
        style: austin
        threshold: 1
    template: '{{ if eq "False" (title (default "False" .Env.DISABLE_SEGMENT_PRIMARY_EXEC_TIME)) }} {{ .FormattedMs }}.{{ end }}'
    trailing_separator: ') '
cursor_padding: true
git:
    background: p:c-git-normal
    background_templates:
        - '{{ if gt .Ahead 0 }}p:c-git-ahead{{ end }}'
        - '{{ if gt .Behind 0 }}p:c-git-behind{{ end }}'
        - '{{ if and (gt .Ahead 0) (gt .Behind 0) }}p:c-git-ahead-behind{{ end }}'
        - '{{ if and (not .Working.Changed) (.Staging.Changed) }}p:c-git-staging{{ end }}'
        - '{{ if and (.Working.Changed) (.Staging.Changed) }}p:c-git-staging-working{{ end }}'
        - '{{ if .UpstreamGone }}p:c-git-upstream-gone{{ end }}'
        - '{{ if and (.Working.Changed) (not .Staging.Changed) }}p:c-git-working{{ end }}'
    foreground: p:c-badge-text
    leading_separator: ' ('
    options:
        branch_icon: ' '
        fetch_status: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    template: '{{ .HEAD }} {{ .BranchStatus }}{{ if .Working.Changed }} > ({{ .Working.String }}){{ end }}{{ if and .Working.Changed .Staging.Changed }} > {{ end }}{{ if .Staging.Changed }}{{ if not .Working.Changed }} {{ end }} ({{ .Staging.String }}){{ end }}{{ if .StashCount }} {{ .StashCount }} Stash{{ if gt .StashCount 1 }}es{{ end }}{{ end }}'
    trailing_style: rounded
lua:
    background_templates:
        - '{{ if .Error }}p:c-project-generic-error{{ else }}p:c-project-lua{{ end }}'
    foreground: p:c-badge-text
    leading_style: rounded
    template: '{{ if eq "False" (title (default "False" .Env.DISABLE_SEGMENT_PROJECT_LUA)) }} {{ if or (.Error) (empty .Full) }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}{{ end }}'
    trailing_separator: ') '
node:
    background_templates:
        - '{{ if empty .Full }}p:c-project-generic-error{{ else }}p:c-project-node{{ end }}'
    foreground: p:c-badge-text
    leading_style: rounded
    template: '{{ if eq "False" (title (default "False" .Env.DISABLE_SEGMENT_PROJECT_NODE)) }} {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}{{ end }}'
    trailing_separator: ') '
palette:
    c-badge-folder: lightYellow
    c-badge-return-custom: lightWhite
    c-badge-return-fail-term: lightRed
    c-badge-return-success: lightYellow
    c-badge-text: black
    c-badge-white: lightWhite
    c-battery-15-less: lightRed
    c-battery-30-less: lightYellow
    c-battery-45-less: lightYellow
    c-battery-55-less: lightYellow
    c-battery-70-less: lightYellow
    c-battery-90-less: lightWhite
    c-battery-100-less: lightYellow
    c-battery-state-error: lightRed
    c-date-time-afternoon: lightYellow
    c-date-time-evening: lightWhite
    c-date-time-morning: lightYellow
    c-date-time-night: white
    c-date-time-noon: lightYellow
    c-exec-fast: lightYellow
    c-exec-normal: lightYellow
    c-exec-slow: lightYellow
    c-exec-slower: lightRed
    c-git-ahead: lightCyan
    c-git-ahead-behind: lightWhite
    c-git-behind: lightRed
    c-git-normal: lightGreen
    c-git-staging: lightYellow
    c-git-staging-working: lightWhite
    c-git-upstream-gone: lightRed
    c-git-working: lightCyan
    c-project-crystal: lightWhite
    c-project-flutter: lightCyan
    c-project-generic-error: lightRed
    c-project-lua: white
    c-project-node: lightGreen
    c-project-python: lightYellow
    c-project-rust: lightYellow
    c-secondary-ellipsis: lightYellow
    c-shell-state-root-active: lightCyan
    c-shell-state-root-ssh-active: lightWhite
    c-shell-state-ssh-active: lightWhite
    c-wakatime-overtime: lightRed
    c-wakatime-quota: lightWhite
    c-wakatime-undertime: lightCyan
    c-wakatime-warm-up: lightWhite
    c-wakatime-working: lightYellow
path:
    background_templates:
        - '{{ if not (empty .Env.OVERRIDE_FOLDER_BADGE_BG) }}{{ .Env.OVERRIDE_FOLDER_BADGE_BG }}{{ else }}p:c-badge-folder{{ end }}'
    foreground_templates:
        - '{{ if not (empty .Env.OVERRIDE_FOLDER_BADGE_FG) }}{{ .Env.OVERRIDE_FOLDER_BADGE_FG }}{{ else }}p:c-badge-text{{ end }}'
    leading_style: rounded
    options:
        folder_separator_icon: /
        hide_root_location: true
        max_depth: 2
        style: agnoster_short
        windows_registry_icon: reg
    template: ' {{ .Path }}'
    trailing_style: rounded
prompt:
    - segments:
        - path
        - git
    - segments:
        - session
        - text
        - crystal
        - dart
        - lua
        - node
        - rust
        - python
        - text.2
python:
    background_templates:
        - '{{ if empty .Full }}p:c-project-generic-error{{ else }}p:c-project-python{{ end }}'
    foreground: p:c-badge-text
    leading_style: rounded
    options:
        display_mode: context
    template: '{{ if or (eq "False" (title (default "False" .Env.DISABLE_SEGMENT_PROJECT_PYTHON))) (eq "False" (title (default "False" .Env.DISABLE_SEGMENT_PROJECT_PYTHON_VENV))) }} {{ if eq "False" (title (default "False" .Env.DISABLE_SEGMENT_PROJECT_PYTHON)) }}{{ .Full }}{{ end }}{{ if and (.Venv) (eq "False" (title (default "False" .Env.DISABLE_SEGMENT_PROJECT_PYTHON))) (eq "False" (title (default "False" .Env.DISABLE_SEGMENT_PROJECT_PYTHON_VENV))) }} {{ end }}{{ if and (.Venv) (eq "False" (title (default "False" .Env.DISABLE_SEGMENT_PROJECT_PYTHON_VENV))) }}{{ if .Env.SEGMENT_PROJECT_PYTHON_ACTIVE_VENV_STR }}{{ .Env.SEGMENT_PROJECT_PYTHON_ACTIVE_VENV_STR }}{{ else }}{{ .Venv }}{{ end }}{{ end }}{{ end }}'
    trailing_separator: ') '
rprompt:
    - segments:
        - executiontime
        - wakatime
        - time
        - battery
rust:
    background_templates:
        - '{{ if empty .Full }}p:c-project-generic-error{{ else }}p:c-project-rust{{ end }}'
    foreground: p:c-badge-text
    leading_style: rounded
    template: '{{ if eq "False" (title (default "False" .Env.DISABLE_SEGMENT_PROJECT_RUST)) }} {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}{{ end }}'
    trailing_separator: ') '
secondary:
    - segments:
        - text.secondary
text.secondary:
    background: transparent
    foreground: p:c-secondary-ellipsis
    template: ' ... '
session:
    template: '{{ if false }}{{ end }}'
text:
    background_templates:
        - '{{ if and (.Segments.Session.SSHSession) (not .Root) }}p:c-shell-state-ssh-active{{ end }}'
        - '{{ if and (not .Segments.Session.SSHSession) (.Root) }}p:c-shell-state-root-active{{ end }}'
        - '{{ if and (.Segments.Session.SSHSession) (.Root) }}p:c-shell-state-root-ssh-active{{ end }}'
    foreground: p:c-badge-text
    leading_style: rounded
    template: '{{ if or (.Segments.Session.SSHSession) (.Root) }}{{ if .Segments.Session.SSHSession }} SSH{{ end }}{{ if and (.Segments.Session.SSHSession) (.Root) }} {{ end }}{{ if .Root }}# Root{{ end }}{{ end }}'
    trailing_separator: ') '
text.2:
    foreground_templates:
        - '{{ if eq "False" (title (default "False" .Env.ENABLE_ARROW_DIVIDER_COLOR_EXECUTION_RETURN)) }}p:c-badge-white{{ else }}{{ if eq .Code 0 }}p:c-badge-return-success{{ else if or (eq .Code 1) (eq .Code 130) }}p:c-badge-return-fail-term{{ else }}p:c-badge-return-custom{{ end }}{{ end }}'
    template: '>'
time:
    background_templates:
        - '{{ if regexMatch "(^(0[6-9])|(1[0-1])):" (.LastDate | date .Format) }}p:c-date-time-morning{{ end }}'
        - '{{ if regexMatch ("(^1[2-4]):") (.LastDate | date .Format) }}p:c-date-time-noon{{ end }}'
        - '{{ if regexMatch ("(^1[5-7]):") (.LastDate | date .Format) }}p:c-date-time-afternoon{{ end }}'
        - '{{ if regexMatch "(^(1[8-9])|(2[0-3])):" (.LastDate | date .Format) }}p:c-date-time-evening{{ end }}'
        - '{{ if regexMatch "^(0[0-5]):" (.LastDate | date .Format) }}p:c-date-time-night{{ end }}'
    foreground: p:c-badge-text
    leading_style: rounded
    options:
        time_format: 15:04 (01/02)
    template: '{{ if eq "False" (title (default "False" .Env.DISABLE_SEGMENT_DTIME)) }} {{ .LastDate | date .Format }}{{ end }}'
    trailing_separator: ') '
transient:
    - segments:
        - text.transient
text.transient:
    template: '{{ if eq "False" (title (default "False" .Env.DISABLE_SEGMENT_TRANSIENT)) }}<{{ if eq .Code 0 }}p:c-badge-return-success{{ else if or (eq .Code 1) (eq .Code 130) }}p:c-badge-return-fail-term{{ else }}p:c-badge-return-custom{{ end }}>(</><p:c-badge-text,{{ if eq .Code 0 }}p:c-badge-return-success{{ else if or (eq .Code 1) (eq .Code 130) }}p:c-badge-return-fail-term{{ else }}p:c-badge-return-custom{{ end }}> > {{ if .Segments.Executiontime.Ms }}{{ if eq "False" (title (default "False" .Env.DISABLE_SEGMENT_TRANSIENT_EXEC_TIME)) }} {{ .Segments.Executiontime.FormattedMs }} {{ end }}{{ end }}<b>{{ if eq .Code 0 }}OK{{ else if eq .Code 1 }}FAIL{{ else if eq .Code 130 }}TERM{{ else }}Code{{ end }} ({{ .Code }})</b></><{{ if eq .Code 0 }}p:c-badge-return-success{{ else if or (eq .Code 1) (eq .Code 130) }}p:c-badge-return-fail-term{{ else }}p:c-badge-return-custom{{ end }}>)</> {{ end }}> '
wakatime:
    background_templates:
        - '{{ if lt .CumulativeTotal.Seconds 3600 }}p:c-wakatime-undertime{{ end }}'
        - '{{ if lt .CumulativeTotal.Seconds 10800 }}p:c-wakatime-warm-up{{ end }}'
        - '{{ if lt .CumulativeTotal.Seconds 25200 }}p:c-wakatime-working{{ end }}'
        - '{{ if lt .CumulativeTotal.Seconds 28000 }}p:c-wakatime-quota{{ end }}'
        - '{{ if ge .CumulativeTotal.Seconds 28800 }}p:c-wakatime-overtime{{ end }}'
    cache:
        duration: 1m
        strategy: session
    foreground: p:c-badge-text
    leading_style: rounded
    options:
        http_timeout: 2000
        url: https://wakatime.com/api/v1/users/current/summaries?start=today&end=today&api_key={{ .Env.WAKATIME_API_KEY }}
    template: '{{ if and (.Env.WAKATIME_API_KEY) (eq "False" (title (default "False" .Env.DISABLE_SEGMENT_WAKATIME))) (gt .CumulativeTotal.Seconds 0) }} {{ secondsRound .CumulativeTotal.Seconds }}.{{ end }}'
    trailing_separator: ') '
