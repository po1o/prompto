cursor_padding: true
git:
    background: '#95ffa4'
    foreground: '#193549'
    trailing_separator: ""
    template: ' {{ .HEAD }} '
path:
    background: '#91ddff'
    foreground: '#100e23'
    options:
        folder_icon: 
        folder_separator_icon: '  '
        home_icon: 
        style: agnoster
    trailing_separator: ""
    template: ' {{ .Path }} '
prompt:
    - segments:
        - session
        - path
        - git
rprompt:
    - segments:
        - time
session:
    background: '#ffffff'
    foreground: '#100e23'
    trailing_separator: ""
    template: ' {{ .UserName }}@{{ .HostName }} '
time:
    foreground: '#007ACC'
    options:
        time_format: "15:04:05"
    template: ' {{ .LastDate | date .Format }} '
