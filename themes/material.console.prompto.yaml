# Console variant of the `material` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of material.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

git:
    foreground: lightRed
    options:
        branch_icon: ""
        fetch_status: false
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    template: <white>git:(</>{{ .HEAD }}<white>)</>
path:
    foreground: cyan
    options:
        style: folder
        windows_registry_icon: reg
    template: ' {{ .Path }} '
prompt:
    - segments:
        - text
        - path
        - git
        - status
        - time
status:
    foreground: white
    template: ' x'
text:
    foreground: lightWhite
    template: <white>></><lightGreen>></>
time:
    foreground: lightGreen
    options:
        time_format: "15:04"
    template: ' {{ .LastDate | date .Format }} '
