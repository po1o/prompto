# Console variant of the `devious-diamonds` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of devious-diamonds.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

console_title_template: '{{ .Folder }}'
cursor_padding: true
palette:
    black: black
    black-background: black
    blue: lightBlue
    comment-brightBlack: white
    cyan: lightCyan
    green: lightGreen
    lightBlue-brightBlue: white
    lightCyan-brightCyan: lightCyan
    lightGreen-brightGreen: lightGreen
    lightMagenta-brightPurple: lightMagenta
    lightRed-brightRed: white
    lightWhite-brightWhite: lightWhite
    lightYellow-brightYellow: lightYellow
    magenta-purple: lightMagenta
    purple: magenta
    red: lightRed
    selection-selectionBackground: darkGray
    white: lightWhite
    white-cursorColor-foreground: lightWhite
    yellow: lightYellow
prompt:
    - segments:
        - os
        - shell
        - session
        - angular
        - aurelia
        - aws
        - az
        - azfunc
        - go
        - java
        - julia
        - kubectl
        - node
        - php
        - project
        - python
        - ruby
        - rust
        - swift
        - time
        - executiontime
    - segments:
        - text.corner
        - status
        - path
        - text.root
rprompt:
    - segments:
        - git
angular:
    background: lightRed
    foreground: black
    options:
        fetch_version: true
    trailing_separator: '>'
    template: ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
aws:
    background: yellow
    foreground: black
    options:
        display_default: false
    trailing_separator: '>'
    template: ' {{ .Profile }}{{ if .Region }}@{{ .Region }}{{ end }} '
aurelia:
    background: magenta
    foreground: white
    options:
        fetch_version: true
    trailing_separator: '>'
    template: ' a {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
az:
    background: lightBlue
    foreground: black
    trailing_separator: '>'
    template: ' Subscription {{ .Name }} ({{ if .EnvironmentName | contains "AzureCloud" }}{{ "Global" }}{{ else }}{{ .EnvironmentName }}{{ end }}) '
azfunc:
    background: yellow
    foreground: black
    options:
        display_mode: files
        fetch_version: false
    trailing_separator: '>'
    template: ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
executiontime:
    background: cyan
    foreground: black
    options:
        style: austin
        threshold: 0
    template: ' {{ .FormattedMs }} '
    trailing_separator: '>'
git:
    background: magenta
    foreground: black
    leading_separator: <
    options:
        branch_icon: ' '
        fetch_status: true
        fetch_upstream_icon: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    template: '{{ .UpstreamIcon }}{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }} {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }} {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }} {{ .StashCount }}{{ end }}'
    trailing_separator: '>'
go:
    background: lightCyan
    foreground: black
    options:
        fetch_version: true
    trailing_separator: '>'
    template: ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
java:
    background: lightCyan
    foreground: black
    trailing_separator: '>'
    template: ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
julia:
    background: lightCyan
    foreground: black
    options:
        fetch_version: true
    trailing_separator: '>'
    template: ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
kubectl:
    background: lightYellow
    foreground: black
    trailing_separator: '>'
    template: ' {{.Context}}{{if .Namespace}} :: {{.Namespace}}{{end}} '
node:
    background: lightGreen
    foreground: black
    options:
        fetch_version: true
    trailing_separator: '>'
    template: ' {{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }}{{ .Full }} '
os:
    foreground: cyan
    options:
        alpine: alpine
        arch: arch
        centos: centos
        debian: debian
        elementary: elementary
        fedora: fedora
        gentoo: gentoo
        linux: linux
        macos: macos
        manjaro: manjaro
        mint: mint
        opensuse: opensuse
        raspbian: raspbian
        ubuntu: ubuntu
        windows: windows
        display_distro_name: true
        android: android
    template: ' {{ if .WSL }}{{ end }}{{.Icon}}-'
path:
    background: blue
    background_templates:
        - '{{ if not .Writable }}red{{ end }}'
    foreground: black
    options:
        folder_icon: ""
        folder_separator_icon: ' '
        home_icon: ""
        max_depth: 3
        style: agnoster_short
        windows_registry_icon: reg
    trailing_separator: '>'
    template: '{{ if eq ( gt .Code 0 ) .Writable }} {{ end }} {{ .Path }}{{ if not .Writable }} {{ end }}{{ if and .Writable .Root }} {{end}} '
php:
    background: lightCyan
    foreground: black
    trailing_separator: '>'
    template: ' {{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }}{{ .Full }} '
project:
    background: lightYellow
    foreground: black
    trailing_separator: '>'
    template: ' {{ if .Error }}{{ .Error }}{{ else }}{{ if .Version }} {{.Version}}{{ end }} {{ if .Name }}{{ .Name }}{{ end }}{{ end }} '
python:
    background: lightYellow
    foreground: black
    options:
        display_mode: files
        fetch_virtual_env: false
    trailing_separator: '>'
    template: ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
ruby:
    background: red
    foreground: black
    options:
        display_mode: files
        fetch_version: true
    trailing_separator: '>'
    template: ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
rust:
    background: lightRed
    foreground: black
    options:
        display_mode: files
        fetch_version: true
    trailing_separator: '>'
    template: ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
session:
    background: magenta
    foreground: black
    trailing_separator: '>'
    template: ' {{ if .SSHSession }} {{ end }}{{ .UserName }}@{{ .HostName }} '
shell:
    background: green
    foreground: black
    leading_separator: <
    template: ' {{ .Name }} '
status:
    background: blue
    background_templates:
        - '{{ if gt .Code 0 }}red{{ end }}'
    foreground: black
    leading_separator: <
    options:
        always_enabled: true
    template: ' {{ if gt .Code 0 }} {{ else }} {{ end }}{{ if eq ( gt .Code 0 ) .Segments.Path.Writable}} {{ end }}'
swift:
    background: blue
    foreground: black
    options:
        display_mode: files
        fetch_version: true
    trailing_separator: '>'
    template: ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
time:
    background: yellow
    foreground: black
    options:
        time_format: Mon | 15:04:05
    trailing_separator: '>'
    template: ' {{ .LastDate | date .Format }} '
text.corner:
    foreground: cyan
    template: ' -'
text.root:
    background: blue
    background_templates:
        - '{{ if and .Segments.Path.Writable (not .Root) }}{{ else }}red{{ end }}'
    foreground: white
    options:
        root_icon: ""
    template: '{{ if not .Root }} {{ end }}{{ if and .Root ( not .Segments.Path.Writable ) }} {{ end }}{{ if and .Root .Segments.Path.Writable }} {{ end }}'
    trailing_separator: '>'
