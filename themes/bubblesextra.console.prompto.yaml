# Console variant of the `bubblesextra` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of bubblesextra.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

battery:
    background: darkGray
    foreground: lightBlue
    foreground_templates:
        - '{{if eq "Charging" .State.String}}lightCyan{{end}}'
        - '{{if eq "Discharging" .State.String}}lightRed{{end}}'
        - '{{if eq "Full" .State.String}}lightGreen{{end}}'
    leading_separator: ' ('
    options:
        charged_icon: ' '
        charging_icon: '^ '
        discharging_icon: 'v '
    template: '{{ if not .Error }}{{ .Icon }}{{ .Percentage }}{{ end }}{{ .Error }}'
    trailing_style: rounded
executiontime:
    background: darkGray
    foreground: white
    leading_style: rounded
    options:
        style: austin
        threshold: 150
    template: '{{ .FormattedMs }}'
    trailing_separator: ') '
cursor_padding: true
git:
    background: darkGray
    foreground: lightCyan
    foreground_templates:
        - '{{ if or (.Working.Changed) (.Staging.Changed) }}lightRed{{ end }}'
        - '{{ if and (gt .Ahead 0) (gt .Behind 0) }}lightRed{{ end }}'
        - '{{ if gt .Ahead 0 }}white{{ end }}'
        - '{{ if gt .Behind 0 }}white{{ end }}'
    leading_separator: ' ('
    options:
        branch_template: '{{ trunc 25 .Branch }}'
        fetch_status: true
        fetch_upstream_icon: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    template: ' {{ .UpstreamIcon }}{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }} {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }} {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }} {{ .StashCount }}{{ end }} '
    trailing_style: rounded
go:
    background: darkGray
    foreground: lightCyan
    leading_separator: ' ('
    options:
        fetch_version: false
    template: '{{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}'
    trailing_style: rounded
java:
    background: darkGray
    foreground: lightRed
    leading_separator: ' ('
    options:
        fetch_version: false
    template: '{{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}'
    trailing_style: rounded
julia:
    background: darkGray
    foreground: lightBlue
    leading_separator: ' ('
    options:
        fetch_version: false
    template: '{{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
    trailing_style: rounded
node:
    background: darkGray
    foreground: lightGreen
    leading_separator: ' ('
    options:
        fetch_version: false
    template: '{{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }}{{ .Full }}'
    trailing_style: rounded
path:
    background: darkGray
    foreground: lightGreen
    leading_style: rounded
    options:
        style: folder
        windows_registry_icon: reg
    template: ' {{ .Path }}'
    trailing_style: rounded
php:
    background: lightBlue
    foreground: lightWhite
    leading_separator: ' ('
    options:
        fetch_version: false
    template: ' {{ .Full }} '
    trailing_style: rounded
prompt:
    - segments:
        - executiontime
        - text
python:
    background: darkGray
    foreground: lightYellow
    leading_separator: ' ('
    options:
        fetch_version: false
    template: ' {{ if .Error }}{{ .Error }}{{ else }}{{ if .Venv }}{{ .Venv }} {{ end }}{{ .Full }}{{ end }}'
    trailing_style: rounded
rprompt:
    - segments:
        - path
        - git
        - python
        - go
        - node
        - ruby
        - java
        - julia
        - php
        - battery
ruby:
    background: darkGray
    foreground: lightRed
    leading_separator: ' ('
    options:
        fetch_version: false
    template: '{{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}'
    trailing_style: rounded
text:
    background: darkGray
    foreground: lightRed
    leading_style: rounded
    template: '{{ .UserName }} >'
    trailing_style: rounded
