# Code generated by src/tools/genconsolethemes; DO NOT EDIT.
#
# Console variant of "patriksvensson", for the Linux virtual console.
#
# Nerd Font icons are removed and Powerline separators replaced with ASCII,
# because a console font carries neither. Colors are approximated to the 16
# ANSI colors a console can show, so themes that differ only in shade look
# alike here.
#
# To take this file over, delete the generated marker on the first line: the
# generator then leaves it alone. Otherwise edit patriksvensson.prompto.yaml and regenerate.

dotnet:
    foreground: magenta
    template: ' [.NET] {{ if .Unsupported }}{{ else }}{{ .Full }}{{ end }} '
cursor_padding: true
git:
    foreground: green
    foreground_templates:
        - '{{ if or (.Working.Changed) (.Staging.Changed) }}yellow{{ end }}'
        - '{{ if and (gt .Ahead 0) (gt .Behind 0) }}red{{ end }}'
        - '{{ if gt .Ahead 0 }}red{{ end }}'
        - '{{ if gt .Behind 0 }}green{{ end }}'
    options:
        fetch_status: true
        fetch_upstream_icon: true
        github_icon: ' '
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    template: ' on {{ .UpstreamIcon }}{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}<red> {{ .Working.String }}</>{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }}<yellow> {{ .Staging.String }}</>{{ end }}{{ if gt .StashCount 0 }} {{ .StashCount }}{{ end }}'
path:
    foreground: blue
    options:
        folder_icon: ""
        folder_separator_icon: /
        home_icon: ""
        style: agnoster
        windows_registry_icon: reg
    template: '{{ .Path }}'
prompt:
    - segments:
        - root
        - path
        - git
        - dotnet
    - segments:
        - time
        - text
root:
    foreground: red
    template: '# '
text:
    foreground: green
    template: '>'
time:
    foreground: yellow
    options:
        time_format: "15:04:05"
    template: '{{ .LastDate | date .Format }} '
