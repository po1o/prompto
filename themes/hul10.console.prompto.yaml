# Console variant of the `hul10` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of hul10.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

console_title_template: '{{if .Root}}[root] {{end}}{{.Shell}} in <{{.Folder}}>'
executiontime:
    background: transparent
    foreground: lightWhite
    options:
        style: austin
        threshold: 0
    template: '{{.FormattedMs}}'
cursor_padding: true
git:
    background: lightWhite
    foreground: p:black
    options:
        branch_icon: ' '
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    template: '{{.HEAD}} '
os:
    background: darkGray
    foreground: p:white
    options:
        linux: linux
        macos: macos
        ubuntu: ubuntu
        windows: windows
        display_distro_name: true
        android: android
    template: ' {{.Icon}}{{if .WSL}} (WSL){{end}} '
palette:
    black: black
    white: lightWhite
path:
    background: transparent
    foreground: p:white
    options:
        folder_icon: ""
        folder_separator_template: <lightCyan> >> </>
        home_icon: ""
        style: agnoster
        windows_registry_icon: reg
    template: <p:white>-</><lightCyan>[</> {{.Path}} <lightCyan>]</>
prompt:
    - segments:
        - text
        - os
        - shell
        - session
        - git
    - segments:
        - path
    - segments:
        - status
rprompt:
    - segments:
        - executiontime
        - time
session:
    background: lightYellow
    foreground: p:black
    template: ' {{.HostName}}\{{.UserName}} '
shell:
    background: p:white
    foreground: p:black
    template: ' {{.Name}} '
status:
    background: transparent
    foreground: lightGreen
    foreground_templates:
        - '{{if gt .Code 0}}lightRed{{end}}'
    options:
        always_enabled: true
    template: '>'
text:
    background: transparent
    foreground: p:white
    template: '-'
time:
    background: transparent
    foreground: lightWhite
    options:
        time_format: 02/01/06 15:04
    template: <p:white> . </>{{.LastDate | date .Format}}
