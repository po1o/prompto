        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
path:
    background: lightCyan
    foreground: black
    options:
        folder_icon: ""
        folder_separator_icon: ' > '
        style: full
        windows_registry_icon: reg
    trailing_separator: '>'
    template: ' {{ .Path }} '
prompt:
    - segments:
        - root
        - session
        - path
        - git
        - python
        - status
    - segments:
        - text
python:
    background: lightBlue
    foreground: black
