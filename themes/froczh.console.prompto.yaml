# Console variant of the `froczh` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of froczh.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

angular:
    background: black
    foreground: lightWhite
    trailing_separator: '>'
    template: ' {{ if .Error }}<lightRed>?</>{{ else }}{{ .Full }}{{ end }} '
aurelia:
    background: black
    foreground: lightWhite
    trailing_separator: '>'
    template: ' {{ if .Error }}<magenta>?</>{{ else }}{{ .Full }}{{ end }} '
console_title_template: '{{if .Root}} ! {{end}}{{.Folder | replace "~" "~" }} @ {{.HostName}}'
dotnet:
    background: lightCyan
    foreground: black
    trailing_separator: '>'
    template: ' {{ .Full }} '
executiontime:
    background: darkGray
    foreground: lightWhite
    leading_separator: '|'
    options:
        style: dallas
        threshold: 0
    template: ' {{ .FormattedMs }}s '
git:
    background: green
    background_templates:
        - '{{ if or (.Working.Changed) (.Staging.Changed) }}lightYellow{{ end }}'
        - '{{ if and (gt .Ahead 0) (gt .Behind 0) }}lightYellow{{ end }}'
        - '{{ if gt .Ahead 0 }}white{{ end }}'
        - '{{ if gt .Behind 0 }}white{{ end }}'
    foreground: black
    options:
        fetch_status: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    trailing_separator: '>'
    template: ' {{ .HEAD }}{{ if .Staging.Changed }}<lightRed> {{ .Staging.String }}</>{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Working.Changed }} {{ .Working.String }}{{ end }}{{ if gt .StashCount 0 }} {{ .StashCount }}{{ end }} '
node:
    background: black
    foreground: green
    trailing_separator: '>'
    template: ' {{ .Full }} '
npm:
    background: black
    foreground: lightRed
    trailing_separator: '>'
    template: ' {{ .Full }} '
os:
    background: blue
    foreground: lightWhite
    leading_separator: (
    template: '{{ if .WSL }}WSL at {{ end }}{{.Icon}} '
    options:
        display_distro_name: true
        android: android
        linux: linux
        macos: mac
path:
    background: cyan
    foreground: lightWhite
    leading_separator: <transparent,cyan>></>
    options:
        folder_icon: '...'
        folder_separator_icon: <transparent> \ </>
        home_icon: ""
        style: agnoster_short
        windows_registry_icon: reg
    template: ' {{ .Path }} '
    trailing_separator: '>'
prompt:
    - segments:
        - os
        - session
        - path
        - git
        - dotnet
        - angular
        - aurelia
        - node
        - npm
        - status
    - segments:
        - status.2
rprompt:
    - segments:
        - executiontime
        - time
session:
    background: blue
    foreground: lightWhite
    template: '| {{ .UserName }}@{{ .HostName }} '
    trailing_separator: '>'
status:
    background: red
    foreground: lightWhite
    trailing_separator: '>'
    template: '<transparent> </> {{ reason .Code }} '
status.2:
    foreground: lightWhite
    foreground_templates:
        - '{{ if gt .Code 0 }}red{{ end }}'
    options:
        always_enabled: true
    template: '> '
time:
    background: darkGray
    foreground: lightGreen
    options:
        time_format: 15:04:05 | Monday
    template: '<transparent> // </>{{ .LastDate | date .Format }} '
