# Console variant of the `montys` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of montys.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

executiontime:
    background: white
    foreground: lightWhite
    options:
        always_enabled: true
    trailing_separator: '>'
    template: ' {{ .FormattedMs }} '
cursor_padding: true
git:
    background: white
    foreground: lightWhite
    options:
        branch_icon: ' <lightWhite> </>'
        fetch_status: false
        fetch_upstream_icon: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    trailing_separator: '>'
    template: ' > ({{ .UpstreamIcon }}{{ .HEAD }}{{ if gt .StashCount 0 }} {{ .StashCount }}{{ end }}) '
node:
    background: white
    foreground: lightWhite
    trailing_separator: '>'
    template: ' {{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }}{{ .Full }} '
os:
    background: darkGray
    foreground: cyan
    leading_separator: (
    template: '{{ .Icon }} {{ .HostName }} '
    options:
        display_distro_name: true
        android: android
        linux: linux
        macos: mac
path:
    background: lightRed
    foreground: lightWhite
    options:
        folder_icon: ""
        folder_separator_icon: \
        home_icon: ""
        style: full
        windows_registry_icon: reg
    trailing_separator: '>'
    template: ' <black> </> {{ .Path }} '
prompt:
    - segments:
        - os
        - path
        - git
        - node
        - executiontime
        - time
        - status
    - segments:
        - root
        - text
root:
    foreground: lightRed
    template: '# '
status:
    background: cyan
    background_templates:
        - '{{ if gt .Code 0 }}red{{ end }}'
    foreground: lightWhite
    options:
        always_enabled: true
    template: ' {{ if gt .Code 0 }}{{ else }}{{ end }} '
    trailing_separator: )
text:
    foreground: lightRed
    template: ' <lightCyan><b>!</b></><b>{{ .UserName }}</b> <cyan>></><lightCyan>></>'
time:
    background: darkGray
    foreground: lightWhite
    options:
        time_format: 3:04 PM
    trailing_separator: '>'
    template: ' {{ .LastDate | date .Format }} '
