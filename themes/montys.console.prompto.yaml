# Code generated by src/tools/genconsolethemes; DO NOT EDIT.
#
# Console variant of "montys", for the Linux virtual console.
#
# Nerd Font icons are removed and Powerline separators replaced with ASCII,
# because a console font carries neither. Colors are approximated to the 16
# ANSI colors a console can show, so themes that differ only in shade look
# alike here.
#
# To take this file over, delete the generated marker on the first line: the
# generator then leaves it alone. Otherwise edit montys.prompto.yaml and regenerate.

executiontime:
    background: white
    foreground: lightWhite
    options:
        always_enabled: true
    trailing_separator: '>'
    template: ' {{ .FormattedMs }} '
cursor_padding: true
git:
    background: white
    foreground: lightWhite
    options:
        branch_icon: ' <lightWhite> </>'
        fetch_status: false
        fetch_upstream_icon: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    trailing_separator: '>'
    template: ' > ({{ .UpstreamIcon }}{{ .HEAD }}{{ if gt .StashCount 0 }} {{ .StashCount }}{{ end }}) '
node:
    background: white
    foreground: lightWhite
    trailing_separator: '>'
    template: ' {{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }}{{ .Full }} '
os:
    background: darkGray
    foreground: cyan
    leading_separator: (
    template: '{{ .Icon }} {{ .HostName }} '
    options:
        display_distro_name: true
        android: android
        linux: linux
        macos: mac
path:
    background: lightRed
    foreground: lightWhite
    options:
        folder_icon: ""
        folder_separator_icon: \
        home_icon: ""
        style: full
        windows_registry_icon: reg
    trailing_separator: '>'
    template: ' <black> </> {{ .Path }} '
prompt:
    - segments:
        - os
        - path
        - git
        - node
        - executiontime
        - time
        - status
    - segments:
        - root
        - text
root:
    foreground: lightRed
    template: '# '
status:
    background: cyan
    background_templates:
        - '{{ if gt .Code 0 }}red{{ end }}'
    foreground: lightWhite
    options:
        always_enabled: true
    template: ' {{ if gt .Code 0 }}{{ else }}{{ end }} '
    trailing_separator: )
text:
    foreground: lightRed
    template: ' <lightCyan><b>!</b></><b>{{ .UserName }}</b> <cyan>></><lightCyan>></>'
time:
    background: darkGray
    foreground: lightWhite
    options:
        time_format: 3:04 PM
    trailing_separator: '>'
    template: ' {{ .LastDate | date .Format }} '
