# Console variant of the `catppuccin` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of catppuccin.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

cursor_padding: true
git:
    background: p:lavender
    foreground: p:text
    options:
        branch_icon: ' '
        cherry_pick_icon: ' '
        commit_icon: ' '
        fetch_status: false
        fetch_upstream_icon: false
        merge_icon: ' '
        no_commits_icon: ' '
        rebase_icon: ' '
        revert_icon: ' '
        tag_icon: ' '
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
    style: powerline
    template: ' {{ .HEAD }}'
os:
    background: p:blue
    foreground: p:wight
    leading_style: rounded
    template: '{{.Icon}} '
    options:
        display_distro_name: true
        android: android
        linux: linux
        macos: mac
palette:
    blue: white
    lavender: white
    os: white
    pink: lightWhite
    text: darkGray
    wight: lightWhite
path:
    background: p:pink
    foreground: p:text
    options:
        folder_icon: '....'
        home_icon: "~"
        style: agnoster_short
        windows_registry_icon: reg
    trailing_style: powerline
    template: ' {{ .Path }}'
prompt:
    - segments:
        - os
        - session
        - path
        - git
session:
    background: p:blue
    foreground: p:text
    template: '{{ .UserName }}@{{ .HostName }}'
