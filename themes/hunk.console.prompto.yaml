# Console variant of the `hunk` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of hunk.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

executiontime:
    background: white
    foreground: lightWhite
    options:
        always_enabled: true
    trailing_separator: '>'
    template: ' {{ .FormattedMs }} '
cursor_padding: true
git:
    background: lightWhite
    background_templates:
        - '{{ if or (.Working.Changed) (.Staging.Changed) }}white{{ end }}'
        - '{{ if and (gt .Ahead 0) (gt .Behind 0) }}lightRed{{ end }}'
        - '{{ if gt .Ahead 0 }}white{{ end }}'
        - '{{ if gt .Behind 0 }}lightRed{{ end }}'
    foreground: darkGray
    options:
        fetch_status: true
        fetch_upstream_icon: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    trailing_separator: '>'
    template: ' {{ .UpstreamIcon }} {{ .HEAD }}{{ if .Staging.Changed }} {{ .Staging.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Working.Changed }} {{ .Working.String }}{{ end }} '
node:
    background: white
    foreground: lightWhite
    trailing_separator: '>'
    template: ' {{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }}{{ .Full }} '
os:
    background: lightRed
    foreground: lightWhite
    leading_separator: (
    options:
        windows: windows
        display_distro_name: true
        android: android
        linux: linux
        macos: mac
    template: '{{ if .WSL }}WSL at {{ end }}{{.Icon}}'
path:
    background: lightRed
    foreground: lightWhite
    options:
        style: full
        windows_registry_icon: reg
    trailing_separator: '>'
    template: '{{ .Path }} '
prompt:
    - segments:
        - os
        - path
        - node
        - python
        - git
    - segments:
        - root.2
        - text
python:
    background: white
    foreground: lightWhite
    options:
        fetch_version: false
    trailing_separator: '>'
    template: ' {{ if .Error }}{{ .Error }}{{ else }}{{ if .Venv }}{{ .Venv }} {{ end }}{{ .Full }}{{ end }} '
root:
    background: white
    foreground: lightYellow
    trailing_separator: '>'
    template: ' !'
root.2:
    template: ' '
rprompt:
    - segments:
        - executiontime
        - root
        - session
        - shell
session:
    background: white
    foreground: lightWhite
    trailing_separator: '>'
    template: ' {{ .UserName }} '
shell:
    background: darkGray
    foreground: lightWhite
    template: ' {{ .Name }} '
    trailing_separator: )
text:
    foreground: lightWhite
    template: <lightGreen>></>
