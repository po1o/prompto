cursor_padding: true
git:
    background: '#95ffa4'
    foreground: '#193549'
    trailing_separator: ""
    template: ' {{ .HEAD }} '
path:
    background: '#91ddff'
    foreground: '#100e23'
    options:
        folder_icon: 
        folder_separator_icon: '  '
        home_icon: 
        style: agnoster
    trailing_separator: ""
    template: ' {{ .Path }} '
prompt:
    - segments:
        - root
        - session
        - path
        - git
        - python
        - status
python:
    background: '#906cff'
    foreground: '#100e23'
    trailing_separator: ""
    template: '  {{ if .Error }}{{ .Error }}{{ else }}{{ if .Venv }}{{ .Venv }} {{ end }}{{ .Full }}{{ end }} '
root:
    background: '#ffe9aa'
    foreground: '#100e23'
    trailing_separator: ""
    template: '  '
session:
    background: '#ffffff'
    foreground: '#100e23'
    trailing_separator: ""
    template: ' {{ .UserName }}@{{ .HostName }} '
status:
    background: '#ff8080'
    foreground: '#ffffff'
    trailing_separator: ""
    template: ' {{ reason .Code }} '
