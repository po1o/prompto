# Console variant of the `takuya` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of takuya.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

git:
    background: lightYellow
    background_templates:
        - '{{ if or (.Working.Changed) (.Staging.Changed) }}lightYellow{{ end }}'
        - '{{ if and (gt .Ahead 0) (gt .Behind 0) }}lightYellow{{ end }}'
        - '{{ if gt .Ahead 0 }}white{{ end }}'
        - '{{ if gt .Behind 0 }}white{{ end }}'
    foreground: black
    options:
        branch_icon: ' '
        fetch_status: true
        fetch_upstream_icon: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    style: powerline
    template: ' {{ .HEAD }} {{ if .Working.Changed }}{{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }}<lightRed> {{ .Staging.String }}</>{{ end }} '
node:
    background: darkGray
    foreground: darkGray
    leading_separator: ' ('
    options:
        fetch_package_manager: true
        npm_icon: ' <lightRed></> '
        yarn_icon: ' <cyan></>'
    template: ' {{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }}{{ .Full }}'
    trailing_style: rounded
path:
    background: darkGray
    foreground: lightWhite
    options:
        style: full
        windows_registry_icon: reg
    trailing_style: powerline
    template: ' {{ .Path }} '
prompt:
    - segments:
        - shell
        - root
        - path
        - git
    - segments:
        - text
        - status
root:
    background: lightRed
    foreground: lightYellow
    options:
        root_icon: ""
    template: '<parentBackground>></> '
rprompt:
    - segments:
        - node
        - time
shell:
    background: cyan
    foreground: lightWhite
    leading_separator: --(
    template: ' {{ .Name }} '
status:
    foreground: lightWhite
    foreground_templates:
        - '{{ if gt .Code 0 }}lightRed{{ end }}'
    options:
        always_enabled: true
    template: '> '
text:
    foreground: cyan
    template: --
time:
    background: lightCyan
    foreground: lightWhite
    leading_separator: ' ('
    template: ' {{ .LastDate | date .Format }} '
    trailing_style: rounded
