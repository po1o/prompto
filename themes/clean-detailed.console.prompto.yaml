# Console variant of the `clean-detailed` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of clean-detailed.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

console_title_template: '{{ .Folder }}'
executiontime:
    background: darkGray
    foreground: lightWhite
    leading_separator: <
    options:
        style: roundrock
        threshold: 0
    template: ' {{ .FormattedMs }} '
    trailing_separator: '>'
git:
    background: cyan
    foreground: black
    leading_separator: <
    options:
        branch_icon: ' '
        fetch_status: true
        fetch_upstream_icon: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    template: ' {{ .UpstreamIcon }}{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }} {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }} {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }} {{ .StashCount }}{{ end }} '
    trailing_separator: '>'
os:
    background: lightWhite
    foreground: black
    leading_separator: <
    options:
        macos: ' '
        ubuntu: ' '
        windows: ' '
        display_distro_name: true
        android: android
        linux: linux
    template: ' {{ if .WSL }}WSL at {{ end }}{{.Icon}}'
    trailing_separator: <transparent,lightWhite><</>
path:
    options:
        folder_icon: ' '
        folder_separator_icon: ' '
        home_icon: ' '
        windows_registry_icon: reg
    template: ' {{ .Path }} '
prompt:
    - segments:
        - os
        - shell
        - sysinfo
        - executiontime
    - segments:
        - text
        - time
        - root
        - path
    - segments:
        - status
root:
    template: ' # '
rprompt:
    - segments:
        - git
shell:
    background: lightWhite
    foreground: black
    leading_separator: <
    template: ' {{ .Name }}'
    trailing_separator: <transparent,lightWhite><</>
status:
    options:
        always_enabled: true
    template: '-- '
sysinfo:
    background: lightBlue
    foreground: lightWhite
    leading_separator: <
    template: ' MEM: {{ round .PhysicalPercentUsed .Precision }}% | {{ (div ((sub .PhysicalTotalMemory .PhysicalAvailableMemory)|float64) 1073741824.0) }}/{{ (div .PhysicalTotalMemory 1073741824.0) }}GB '
    trailing_separator: <transparent,lightBlue><</>
text:
    template: --
time:
    options:
        time_format: "15:04"
    template: ' * {{ .LastDate | date .Format }} |'
transient:
    - segments:
        - text.transient
text.transient:
    background: transparent
    foreground: lightWhite
    template: ' '
