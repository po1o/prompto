cursor_padding: true
git:
    background: lightGreen
    foreground: darkGray
    trailing_separator: '>'
    template: ' {{ .HEAD }} '
    options:
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
path:
    background: lightCyan
    foreground: black
    options:
        folder_icon: ""
        folder_separator_icon: ' > '
        home_icon: ""
        style: agnoster
        windows_registry_icon: reg
    trailing_separator: '>'
    template: ' {{ .Path }} '
prompt:
    - segments:
        - session
        - path
        - git
rprompt:
    - segments:
        - time
session:
    background: lightWhite
    foreground: black
    trailing_separator: '>'
    template: ' {{ .UserName }}@{{ .HostName }} '
time:
    foreground: cyan
    options:
        time_format: "15:04:05"
    template: ' {{ .LastDate | date .Format }} '
