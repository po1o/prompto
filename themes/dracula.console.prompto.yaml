# Console variant of the `dracula` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of dracula.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

aws:
    background: lightYellow
    foreground: darkGray
    leading_style: powerline
    template: ' {{.Profile}}{{if .Region}}@{{.Region}}{{end}}'
    trailing_style: rounded
cursor_padding: true
git:
    background: lightYellow
    foreground: lightWhite
    options:
        branch_icon: ""
        fetch_status: false
        fetch_upstream_icon: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    style: powerline
    template: ' ({{ .UpstreamIcon }}{{ .HEAD }}{{ if gt .StashCount 0 }} {{ .StashCount }}{{ end }}) '
node:
    background: lightCyan
    foreground: lightWhite
    style: powerline
    template: ' {{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }}{{ .Full }} '
path:
    background: white
    foreground: lightWhite
    options:
        style: folder
        windows_registry_icon: reg
    trailing_style: powerline
    template: ' {{ .Path }} '
prompt:
    - segments:
        - session
        - path
        - git
        - node
        - time
rprompt:
    - segments:
        - aws
session:
    background: darkGray
    foreground: lightWhite
    leading_style: rounded
    template: '{{ .UserName }} '
time:
    background: lightMagenta
    foreground: lightWhite
    options:
        time_format: "15:04"
    template: ' * {{ .LastDate | date .Format }} '
    style: powerline
