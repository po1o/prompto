# Code generated by src/tools/genconsolethemes; DO NOT EDIT.
#
# Console variant of "iterm2", for the Linux virtual console.
#
# Nerd Font icons are removed and Powerline separators replaced with ASCII,
# because a console font carries neither. Colors are approximated to the 16
# ANSI colors a console can show, so themes that differ only in shade look
# alike here.
#
# To take this file over, delete the generated marker on the first line: the
# generator then leaves it alone. Otherwise edit iterm2.prompto.yaml and regenerate.

battery:
    background: lightRed
    background_templates:
        - '{{if eq "Charging" .State.String}}lightGreen{{end}}'
        - '{{if eq "Discharging" .State.String}}lightYellow{{end}}'
        - '{{if eq "Full" .State.String}}cyan{{end}}'
    foreground: black
    trailing_separator: '>'
    template: ' {{ if not .Error }}{{ .Icon }}{{ .Percentage }}{{ end }}{{ .Error }} '
console_title_template: '{{ .Shell }} in {{ .Folder }}'
cursor_padding: true
git:
    background: lightYellow
    background_templates:
        - '{{ if or (.Working.Changed) (.Staging.Changed) }}lightRed{{ end }}'
        - '{{ if and (gt .Ahead 0) (gt .Behind 0) }}lightRed{{ end }}'
        - '{{ if gt .Ahead 0 }}white{{ end }}'
        - '{{ if gt .Behind 0 }}lightRed{{ end }}'
    foreground: darkGray
    options:
        fetch_status: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    trailing_separator: '>'
    template: ' {{ .HEAD }}{{ if .Staging.Changed }} {{ .Staging.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Working.Changed }} {{ .Working.String }}{{ end }}{{ if gt .StashCount 0 }} {{ .StashCount }}{{ end }} '
os:
    background: darkGray
    foreground: lightWhite
    options:
        windows: windows
        display_distro_name: true
        android: android
        linux: linux
        macos: mac
    trailing_separator: '>'
    template: ' {{ if .WSL }}WSL at {{ end }}{{.Icon}}'
path:
    background: cyan
    foreground: darkGray
    options:
        folder_separator_icon: /
        style: full
        windows_registry_icon: reg
    trailing_separator: '>'
    template: ' {{ .Path }} '
prompt:
    - segments:
        - os
        - session
        - path
        - git
        - status
    - segments:
        - root
        - text
python:
    background: cyan
    foreground: darkGray
    options:
        display_mode: context
        fetch_virtual_env: true
    trailing_separator: '>'
    template: ' {{ .Venv }} '
root:
    foreground: lightYellow
    template: ' ! '
rprompt:
    - segments:
        - battery
        - python
        - time
session:
    background: darkGray
    foreground: lightYellow
    trailing_separator: '>'
    template: '{{ .UserName }} '
status:
    background: lightGreen
    background_templates:
        - '{{ if gt .Code 0 }}lightRed{{ end }}'
    foreground: black
    options:
        always_enabled: true
    trailing_separator: '>'
    template: ' x '
text:
    foreground: lightRed
    template: ' '
time:
    background: darkGray
    foreground: lightWhite
    trailing_separator: '>'
    template: '<lightWhite> </>{{ .LastDate | date .Format }} '
transient:
    - segments:
        - text.transient
text.transient:
    background: transparent
    foreground: lightYellow
    template: '{{if .Root}}! {{end}} '
