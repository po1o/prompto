# Code generated by src/tools/genconsolethemes; DO NOT EDIT.
#
# Console variant of "quick-term", for the Linux virtual console.
#
# Nerd Font icons are removed and Powerline separators replaced with ASCII,
# because a console font carries neither. Colors are approximated to the 16
# ANSI colors a console can show, so themes that differ only in shade look
# alike here.
#
# To take this file over, delete the generated marker on the first line: the
# generator then leaves it alone. Otherwise edit quick-term.prompto.yaml and regenerate.

executiontime:
    background: lightWhite
    foreground: darkGray
    options:
        always_enabled: true
        style: austin
    trailing_separator: '>'
    template: ' {{ .FormattedMs }} '
cursor_padding: true
git:
    background: green
    background_templates:
        - '{{ if or (.Working.Changed) (.Staging.Changed) }}yellow{{ end }}'
        - '{{ if and (gt .Ahead 0) (gt .Behind 0) }}darkGray{{ end }}'
        - '{{ if gt .Ahead 0 }}darkGray{{ end }}'
        - '{{ if gt .Behind 0 }}darkGray{{ end }}'
    foreground: lightWhite
    leading_separator: <transparent,background>></>
    options:
        branch_gone_icon: ""
        branch_icon: ' '
        branch_identical_icon: ""
        branch_template: '{{ trunc 25 .Branch }}'
        fetch_status: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    template: ' {{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }} <transparent>></> <black> {{ .Working.String }}</>{{ end }}{{ if .Staging.Changed }} <transparent>></> <black> {{ .Staging.String }}</>{{ end }}{{ if gt .StashCount 0 }} <transparent>></> <black> {{ .StashCount }}</>{{ end }} '
    trailing_separator: '>'
os:
    background: yellow
    foreground: lightWhite
    leading_separator: --<
    options:
        alpine: alpine
        arch: arch
        centos: centos
        debian: debian
        elementary: elementary
        fedora: fedora
        gentoo: gentoo
        linux: linux
        macos: macos
        manjaro: manjaro
        mint: mint
        opensuse: opensuse
        raspbian: raspbian
        ubuntu: ubuntu
        windows: windows
        display_distro_name: true
        android: android
    template: ' {{ .Icon }} '
path:
    background: cyan
    foreground: lightWhite
    options:
        folder_icon: ..
        folder_separator_icon: ' <transparent>></> '
        max_depth: 3
        style: agnoster_short
        windows_registry_icon: reg
    trailing_separator: '>'
    template: ' {{ .Path }} '
prompt:
    - segments:
        - os
        - session
        - path
        - git
    - segments:
        - text
rprompt:
    - segments:
        - executiontime
        - time
session:
    background: lightWhite
    foreground: darkGray
    trailing_separator: '>'
    template: ' {{ .UserName }} '
text:
    foreground: yellow
    template: -- {{ if .Root }}#{{else}}${{end}}
time:
    background: yellow
    foreground: lightWhite
    options:
        time_format: "15:04:05"
    template: ' {{ .LastDate | date .Format }} '
    trailing_separator: '>'
