# Console variant of the `nordtron` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of nordtron.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

aws:
    foreground: white
    template: <white>--[</>{{.Profile}}{{if .Region}}@{{.Region}}{{end}}<white>]</>
cursor_padding: true
git:
    foreground: white
    options:
        fetch_status: true
        fetch_upstream_icon: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    template: <white>--[</>{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}<white> * </>{{ end }}{{ if .Staging.Changed }}<white> * </>{{ end }}<white>]</>
kubectl:
    foreground: white
    template: '<white>--[</>{{.Context}}{{if .Namespace}} :: {{.Namespace}}{{end}}<white>]</>'
path:
    foreground: white
    options:
        style: full
        windows_registry_icon: reg
    template: <white>-[</>{{ .Path }}<white>]</>
prompt:
    - segments:
        - session
        - git
        - aws
        - kubectl
        - root
        - status
    - segments:
        - path
    - segments:
        - text
root:
    foreground: lightWhite
    template: <white>[</><white>]</>
session:
    foreground: white
    template: <white>-[</>{{ .UserName }}<white>]</>
status:
    foreground: lightWhite
    template: <white>[x</>{{ reason .Code }}<white>]</>
text:
    foreground: white
    template: ' '
