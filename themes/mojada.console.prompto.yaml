# Code generated by src/tools/genconsolethemes; DO NOT EDIT.
#
# Console variant of "mojada", for the Linux virtual console.
#
# Nerd Font icons are removed and Powerline separators replaced with ASCII,
# because a console font carries neither. Colors are approximated to the 16
# ANSI colors a console can show, so themes that differ only in shade look
# alike here.
#
# To take this file over, delete the generated marker on the first line: the
# generator then leaves it alone. Otherwise edit mojada.prompto.yaml and regenerate.

battery:
    background: lightRed
    background_templates:
        - '{{if eq "Charging" .State.String}}lightCyan{{end}}'
        - '{{if eq "Discharging" .State.String}}lightRed{{end}}'
        - '{{if eq "Full" .State.String}}lightGreen{{end}}'
    foreground: lightWhite
    options:
        charged_icon: ' '
        charging_icon: ' '
        discharging_icon: ' '
    trailing_separator: '>'
    template: ' {{ if not .Error }}{{ .Icon }}{{ .Percentage }}{{ end }}{{ .Error }}% '
console_title_template: '{{.UserName}}@{{.HostName}} : {{.Folder}}'
executiontime:
    foreground: lightWhite
    options:
        always_enabled: true
    template: '{{ .FormattedMs }} '
cursor_padding: true
git:
    background: lightYellow
    background_templates:
        - '{{ if or (.Working.Changed) (.Staging.Changed) }}lightRed{{ end }}'
        - '{{ if and (gt .Ahead 0) (gt .Behind 0) }}lightRed{{ end }}'
        - '{{ if gt .Ahead 0 }}lightRed{{ end }}'
        - '{{ if gt .Behind 0 }}white{{ end }}'
    foreground: darkGray
    options:
        fetch_status: true
        fetch_upstream_icon: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    trailing_separator: '>'
    template: ' {{ .UpstreamIcon }}{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Staging.Changed }} {{ .Staging.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Working.Changed }} {{ .Working.String }}{{ end }}{{ if gt .StashCount 0 }} {{ .StashCount }}{{ end }} '
os:
    background: lightWhite
    foreground: cyan
    leading_separator: (
    options:
        arch: arch
        debian: debian
        fedora: fedora
        linux: linux
        macos: macos
        manjaro: manjaro
        opensuse: opensuse
        ubuntu: ubuntu
        windows: windows
        display_distro_name: true
        android: android
    template: ' {{ if .WSL }}WSL at {{ end }}{{.Icon}} '
path:
    background: cyan
    foreground: lightWhite
    options:
        folder_separator_icon: /
        home_icon: "~"
        max_depth: 2
        style: letter
        windows_registry_icon: reg
    trailing_separator: '>'
    template: ' {{ .Path }} '
prompt:
    - segments:
        - os
        - session
        - root
        - path
        - git
        - text
root:
    background: lightRed
    foreground: lightWhite
    trailing_separator: '>'
    template: ' #'
rprompt:
    - segments:
        - status
        - executiontime
        - battery
        - time
session:
    background: lightWhite
    foreground: cyan
    trailing_separator: '>'
    template: '{{ .UserName }}<black>@</><lightRed>{{ .HostName }}</> '
status:
    foreground: lightWhite
    options:
        always_enabled: true
    template: ' {{ if gt .Code 0 }}{{ else }}{{ end }} '
text:
    foreground: lightYellow
    template: ' {{if .Root}}#{{else}}${{end}}'
time:
    background: white
    foreground: lightWhite
    options:
        time_format: 15:04 (Mon)
    template: ' {{ .LastDate | date .Format }} '
    trailing_separator: )
