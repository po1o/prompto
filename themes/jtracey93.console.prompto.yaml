# Code generated by src/tools/genconsolethemes; DO NOT EDIT.
#
# Console variant of "jtracey93", for the Linux virtual console.
#
# Nerd Font icons are removed and Powerline separators replaced with ASCII,
# because a console font carries neither. Colors are approximated to the 16
# ANSI colors a console can show, so themes that differ only in shade look
# alike here.
#
# To take this file over, delete the generated marker on the first line: the
# generator then leaves it alone. Otherwise edit jtracey93.prompto.yaml and regenerate.

executiontime:
    background: darkGray
    foreground: lightWhite
    options:
        style: dallas
        threshold: 0
    template: ' {{ .FormattedMs }}s '
cursor_padding: true
git:
    background: cyan
    foreground: lightWhite
    options:
        fetch_status: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    template: ' branch ({{ .HEAD }}{{ if .Staging.Changed }} {{ .Staging.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Working.Changed }} {{ .Working.String }}{{ end }}) '
path:
    background: lightYellow
    foreground: darkGray
    options:
        style: full
        windows_registry_icon: reg
    template: ' {{ .Path }} '
prompt:
    - segments:
        - session
        - path
        - git
        - spotify
        - time
        - executiontime
        - status
    - segments:
        - status.2
session:
    background: lightRed
    foreground: lightWhite
    leading_separator: (
    template: '{{ if .SSHSession }} {{ end }}{{ .UserName }} '
spotify:
    background: lightGreen
    foreground: lightWhite
    options:
        paused_icon: '|| '
        playing_icon: '> '
        stopped_icon: '[] '
    template: ' {{ .Icon }}{{ if ne .Status "stopped" }}{{ .Artist }} - {{ .Track }}{{ end }} '
status:
    background: cyan
    background_templates:
        - '{{ if .Error }}lightRed{{ end }}'
    foreground: lightWhite
    options:
        always_enabled: true
    trailing_separator: '>'
status.2:
    foreground: lightWhite
    foreground_templates:
        - '{{ if gt .Code 0 }}red{{ end }}'
    options:
        always_enabled: true
    template: '> '
time:
    background: magenta
    foreground: lightWhite
    options:
        time_format: "15:04:05"
    template: ' {{ .LastDate | date .Format }} '
