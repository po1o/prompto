# Console variant of the `powerlevel10k_classic` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of powerlevel10k_classic.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

git:
    background: darkGray
    foreground: lightYellow
    template: '<cyan>> </>{{ .HEAD }} '
    options:
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
os:
    background: darkGray
    foreground: cyan
    template: ' {{ if .WSL }}WSL at {{ end }}{{.Icon}} >'
    options:
        display_distro_name: true
        android: android
        linux: linux
        macos: mac
path:
    background: darkGray
    foreground: cyan
    options:
        style: full
        windows_registry_icon: reg
    template: ' {{ .Path }} '
prompt:
    - segments:
        - os
        - root
        - path
        - git
        - text
    - segments:
        - status
root:
    background: darkGray
    foreground: cyan
    template: ' # '
rprompt:
    - segments:
        - session
        - time
session:
    background: darkGray
    foreground: lightYellow
    trailing_separator: '>'
    template: ' {{ .UserName }}@{{ .HostName }} <cyan><</>'
status:
    foreground: lightYellow
    foreground_templates:
        - '{{ if gt .Code 0 }}lightRed{{ end }}'
    options:
        always_enabled: true
    template: '> '
text:
    background: transparent
    foreground: darkGray
    template: '>'
time:
    background: darkGray
    foreground: lightYellow
    options:
        time_format: "15:04:05"
    template: ' {{ .LastDate | date .Format }} '
