# Code generated by src/tools/genconsolethemes; DO NOT EDIT.
#
# Console variant of "powerlevel10k_classic", for the Linux virtual console.
#
# Nerd Font icons are removed and Powerline separators replaced with ASCII,
# because a console font carries neither. Colors are approximated to the 16
# ANSI colors a console can show, so themes that differ only in shade look
# alike here.
#
# To take this file over, delete the generated marker on the first line: the
# generator then leaves it alone. Otherwise edit powerlevel10k_classic.prompto.yaml and regenerate.

git:
    background: darkGray
    foreground: lightYellow
    template: '<cyan>> </>{{ .HEAD }} '
    options:
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
os:
    background: darkGray
    foreground: cyan
    template: ' {{ if .WSL }}WSL at {{ end }}{{.Icon}} >'
    options:
        display_distro_name: true
        android: android
        linux: linux
        macos: mac
path:
    background: darkGray
    foreground: cyan
    options:
        style: full
        windows_registry_icon: reg
    template: ' {{ .Path }} '
prompt:
    - segments:
        - os
        - root
        - path
        - git
        - text
    - segments:
        - status
root:
    background: darkGray
    foreground: cyan
    template: ' # '
rprompt:
    - segments:
        - session
        - time
session:
    background: darkGray
    foreground: lightYellow
    trailing_separator: '>'
    template: ' {{ .UserName }}@{{ .HostName }} <cyan><</>'
status:
    foreground: lightYellow
    foreground_templates:
        - '{{ if gt .Code 0 }}lightRed{{ end }}'
    options:
        always_enabled: true
    template: '> '
text:
    background: transparent
    foreground: darkGray
    template: '>'
time:
    background: darkGray
    foreground: lightYellow
    options:
        time_format: "15:04:05"
    template: ' {{ .LastDate | date .Format }} '
