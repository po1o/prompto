        - session
        - path
        - git
        - terraform
        - status
    - segments:
        - text
        - text.2
root:
    foreground: lightRed
    template: ' <darkGray,>as</> root'
rprompt:
    - segments:
        - shell
        - root
        - time
session:
    foreground: darkGray
    template: '- {{ .UserName }}@{{ .HostName }} '
shell:
    foreground: cyan
    template: '{{ .Name }}'
status:
    background: lightRed
    foreground: lightWhite
    trailing_separator: '>'
