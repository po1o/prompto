# Console variant of the `stelbent.minimal` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of stelbent.minimal.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

cursor_padding: true
git:
    background: lightGreen
    background_templates:
        - '{{ if or (.Working.Changed) (.Staging.Changed) }}lightRed{{ end }}'
        - '{{ if and (gt .Ahead 0) (gt .Behind 0) }}lightRed{{ end }}'
        - '{{ if gt .Ahead 0 }}white{{ end }}'
        - '{{ if gt .Behind 0 }}white{{ end }}'
    foreground: black
    options:
        branch_ahead_icon: ^
        branch_behind_icon: v
        branch_gone_icon: '!='
        branch_icon: ' '
        branch_identical_icon: '='
        cherry_pick_icon: 'ok '
        commit_icon: '> '
        fetch_status: true
        merge_icon: 't '
        no_commits_icon: '[no commits]'
        rebase_icon: 'L '
        tag_icon: '> '
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        revert_icon: 'revert '
    trailing_separator: '>'
    template: ' {{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }} {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }} {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }} {{ .StashCount }}{{ end }} '
path:
    background: lightCyan
    foreground: black
    options:
        style: folder
        windows_registry_icon: reg
    trailing_separator: '>'
    template: ' {{ .Path }} '
prompt:
    - segments:
        - session
        - path
        - git
        - terraform
        - status
    - segments:
        - text
        - text.2
root:
    foreground: lightRed
    template: ' <darkGray,>as</> root'
rprompt:
    - segments:
        - shell
        - root
        - time
session:
    foreground: darkGray
    template: '- {{ .UserName }}@{{ .HostName }} '
shell:
    foreground: cyan
    template: '{{ .Name }}'
status:
    background: lightRed
    foreground: lightWhite
    trailing_separator: '>'
    template: ' error '
terraform:
    background: lightYellow
    foreground: black
    trailing_separator: '>'
    template: ' {{ .WorkspaceName }} '
text:
    foreground: darkGray
    template: '- '
text.2:
    foreground: lightWhite
    template: $
time:
    foreground: darkGray
    options:
        time_format: "15:04:05"
    template: ' <darkGray,>|</> {{ .LastDate | date .Format }}'
