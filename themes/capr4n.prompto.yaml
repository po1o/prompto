console_title_template: "{{if .Root}} ⚡ {{end}}{{.UserName}} ➔ \U0001F4C1{{.Folder}}"
executiontime:
    background: '#83769c'
    foreground: '#ffffff'
    options:
        always_enabled: true
    template: '  {{ .FormattedMs }} '
cursor_padding: true
git:
    background: '#95ffa4'
    foreground: '#193549'
    trailing_separator: ""
    template: ' {{ .HEAD }} '
path:
    background: '#C678DD'
    foreground: '#ffffff'
    options:
        folder_icon: 
        folder_separator_icon: '  '
        max_depth: 2
        style: agnoster_short
    trailing_separator: ""
    template: ' {{ .Path }} '
prompt:
    - segments:
        - session
        - path
        - git
rprompt:
    - segments:
        - time
        - executiontime
session:
    background: '#61AFEF'
    foreground: '#ffffff'
    template: '{{if .Root}}  {{.UserName}} {{else}} {{.UserName}} {{end}}'
    trailing_separator: 
time:
    background: '#003543'
    foreground: '#ffffff'
    template: '  {{ .LastDate | date .Format }} '
