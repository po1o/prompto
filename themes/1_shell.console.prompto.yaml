# Console variant of the `1_shell` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of 1_shell.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

console_title_template: '{{ .Folder }}'
executiontime:
    foreground: white
    options:
        style: dallas
        threshold: 0
    template: ' {{ .FormattedMs }}s <lightWhite></>'
git:
    foreground: lightMagenta
    options:
        branch_icon: ' '
        fetch_status: true
        fetch_upstream_icon: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    template: ' {{ .UpstreamIcon }}{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }} {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }} {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }} {{ .StashCount }}{{ end }} '
path:
    foreground: white
    leading_separator: <cyan> </><white>{</>
    options:
        folder_icon: ""
        folder_separator_icon: ' '
        home_icon: home
        style: agnoster_full
        windows_registry_icon: reg
    template: ' {{ .Path }} '
    trailing_separator: <white>}</>
prompt:
    - segments:
        - session
        - time
        - git
    - segments:
        - path
        - status
root:
    options:
        root_icon: ' '
    template: ' # '
rprompt:
    - segments:
        - text
        - executiontime
        - root
        - sysinfo
session:
    foreground: white
    leading_separator: <lightRed> </>
    template: '{{ .UserName }} <lightWhite>on</>'
status:
    foreground: white
    foreground_templates:
        - '{{ if gt .Code 0 }}lightRed{{ end }}'
    options:
        always_enabled: true
    template: ' x '
sysinfo:
    foreground: lightGreen
    template: ' <lightWhite>MEM:</> {{ round .PhysicalPercentUsed .Precision }}% ({{ (div ((sub .PhysicalTotalMemory .PhysicalAvailableMemory)|float64) 1073741824.0) }}/{{ (div .PhysicalTotalMemory 1073741824.0) }}GB)'
text:
    foreground: white
time:
    foreground: white
    template: ' {{ .LastDate | date "Monday" }} <lightWhite>at</> {{ .LastDate | date "3:04 PM" }} '
transient:
    - segments:
        - text.transient
text.transient:
    background: transparent
    foreground: lightWhite
    template: ' '
