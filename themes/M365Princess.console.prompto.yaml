# Console variant of the `M365Princess` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of M365Princess.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

cursor_padding: true
git:
    background: p:salmon
    foreground: p:white
    options:
        branch_icon: ""
        fetch_status: false
        fetch_upstream_icon: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    style: powerline
    template: ' > ({{ .UpstreamIcon }}{{ .HEAD }}{{ if gt .StashCount 0 }} {{ .StashCount }}{{ end }}) '
node:
    background: p:sky
    foreground: p:white
    style: powerline
    template: ' {{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }}{{ .Full }} '
palette:
    blush: lightRed
    plum: magenta
    salmon: white
    sky: white
    tan: yellow
    teal: cyan
    teal_blue: darkGray
    white: lightWhite
path:
    background: p:blush
    foreground: p:white
    options:
        style: folder
        windows_registry_icon: reg
    trailing_style: powerline
    template: ' {{ .Path }} '
prompt:
    - segments:
        - session
        - path
        - git
        - node
        - time
rprompt:
    - segments:
        - text
        - text.2
        - text.3
session:
    background: p:plum
    foreground: p:white
    leading_style: rounded
    template: '{{ .UserName }} '
text:
    background: p:tan
    foreground: p:white
    leading_style: rounded
    template: '{{ if .Env.PNPPSHOST }} {{ .Env.PNPPSHOST }} {{ end }}'
text.2:
    background: p:teal
    foreground: p:white
    style: powerline
    template: '{{ if .Env.PNPPSSITE }} {{ .Env.PNPPSSITE }}{{ end }}'
text.3:
    background: p:teal
    foreground: p:white
    template: '{{ if .Env.PNPPSSITE }} {{ end }}'
    style: rounded
time:
    background: p:teal_blue
    foreground: p:white
    options:
        time_format: "15:04"
    template: ' * {{ .LastDate | date .Format }} '
    style: powerline
