# alike here.
#
# To take this file over, delete the generated marker on the first line: the
# generator then leaves it alone. Otherwise edit M365Princess.prompto.yaml and regenerate.

cursor_padding: true
git:
    background: p:salmon
    foreground: p:white
    options:
        branch_icon: ""
        fetch_status: false
        fetch_upstream_icon: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    trailing_separator: '>'
    template: ' > ({{ .UpstreamIcon }}{{ .HEAD }}{{ if gt .StashCount 0 }} {{ .StashCount }}{{ end }}) '
node:
    background: p:sky
    foreground: p:white
    trailing_separator: '>'
    template: ' {{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }}{{ .Full }} '
palette:
    blush: lightRed
    plum: magenta
    salmon: white
    sky: white
    tan: yellow
    teal: cyan
    teal_blue: darkGray
    white: lightWhite
path:
    background: p:blush
    foreground: p:white
    options:
        style: folder
        windows_registry_icon: reg
    trailing_separator: '>'
    template: ' {{ .Path }} '
prompt:
    - segments:
        - session
        - path
        - git
        - node
        - time
rprompt:
    - segments:
        - text
        - text.2
        - text.3
session:
    background: p:plum
    foreground: p:white
    leading_separator: (
    template: '{{ .UserName }} '
text:
    background: p:tan
    foreground: p:white
    leading_separator: (
    template: '{{ if .Env.PNPPSHOST }} {{ .Env.PNPPSHOST }} {{ end }}'
text.2:
    background: p:teal
    foreground: p:white
    trailing_separator: '>'
    template: '{{ if .Env.PNPPSSITE }} {{ .Env.PNPPSSITE }}{{ end }}'
text.3:
    background: p:teal
    foreground: p:white
    template: '{{ if .Env.PNPPSSITE }} {{ end }}'
    trailing_separator: )
time:
    background: p:teal_blue
    foreground: p:white
    options:
        time_format: "15:04"
    template: ' * {{ .LastDate | date .Format }} '
    trailing_separator: '>'
