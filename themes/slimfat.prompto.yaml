console_title_template: '{{if .Root}}root :: {{end}}{{.Shell}} :: {{.Folder}}'
dotnet:
    background: '#2f2f2f'
    foreground: '#3891A6'
    template: '  {{ if .Unsupported }}{{ else }}{{ .Full }}{{ end }}<#7a7a7a> </>'
executiontime:
    foreground: '#FFCE5C'
    options:
        style: roundrock
        threshold: 500
    template: ' {{ .FormattedMs }}<#fafafa>  </>'
cursor_padding: true
git:
    background: '#2f2f2f'
    foreground: '#ffeb3b'
    foreground_templates:
        - '{{ if or (.Working.Changed) (.Staging.Changed) }}#ffeb3b{{ end }}'
        - '{{ if gt .Ahead 0 }}#2EC4B6{{ end }}'
        - '{{ if gt .Behind 0 }}#8A4FFF{{ end }}'
    options:
        fetch_status: true
        fetch_upstream_icon: true
    template: '<#7a7a7a> </>{{ .UpstreamIcon }}{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}<#E84855>  {{ .Working.String }}</>{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }}<#2FDA4E>  {{ .Staging.String }}</>{{ end }}{{ if gt .StashCount 0 }}  {{ .StashCount }}{{ end }} '
node:
    background: '#2f2f2f'
    foreground: '#6CA35E'
    template: '  {{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }}{{ .Full }}<#7a7a7a> </>'
os:
    background: '#2f2f2f'
    foreground: '#26C6DA'
    leading_separator: ▓
    options:
        alpine: 
        arch: 
        centos: 
        debian: 
        elementary: 
        fedora: 
        gentoo: 
        linux: 
        macos: 
        manjaro: 
        mint: 
        opensuse: 
        raspbian: 
        ubuntu: 
        windows: 
    template: ' {{ if .WSL }} on {{ end }}{{ .Icon }}<#7a7a7a> </>'
path:
    background: '#2f2f2f'
    foreground: '#fafafa'
    options:
        folder_icon: <#B5B2C2> </>
        style: full
    template: '<#f2f200>  </>{{ .Path }} '
prompt:
    - segments:
        - os
        - session
        - root
        - path
        - git
        - text
    - segments:
        - text.3
python:
    background: '#2f2f2f'
    foreground: '#96E072'
    template: '  {{ if .Error }}{{ .Error }}{{ else }}{{ if .Venv }}{{ .Venv }} {{ end }}{{ .Full }}{{ end }}<#7a7a7a> </>'
root:
    background: '#2f2f2f'
    foreground: '#ffff66'
    template: ' <#7a7a7a> </>'
rprompt:
    - segments:
        - text.2
        - node
        - python
        - dotnet
        - time
    - segments:
        - text.4
        - executiontime
        - status
session:
    background: '#2f2f2f'
    foreground: '#fafafa'
    template: ' {{ if ne .Env.PROMPTO_SESSION_DEFAULT_USER .UserName }}<#77f5d6>{{ .UserName }}</><#7a7a7a></>{{ end }}<#2EEFBF>{{ .HostName }}</><#7a7a7a> </>'
status:
    foreground: '#9FD356'
    foreground_templates:
        - '{{ if gt .Code 0 }}#E84855{{ end }}'
    options:
        always_enabled: true
    template: '  {{ if gt .Code 0 }}{{ .Code }}{{ end }} '
text:
    background: '#2f2f2f'
    foreground: '#fafafa'
    trailing_separator: 
text.2:
    background: '#2f2f2f'
    foreground: '#fafafa'
    leading_separator: 
text.3:
    foreground: '#7a7a7a'
    template: ' ~#@❯ '
text.4:
    foreground: '#7a7a7a'
    template: ' ❮ '
time:
    background: '#2f2f2f'
    foreground: '#fafafa'
    options:
        time_format: "15:04:05"
    template: ' {{ .LastDate | date .Format }}<#007ACC>  </>'
    trailing_separator: ▓
transient:
    - segments:
        - text.transient
text.transient:
    background: transparent
    foreground: '#7a7a7a'
    template: ' ~#@❯ '
