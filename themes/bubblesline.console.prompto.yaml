# Console variant of the `bubblesline` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of bubblesline.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

battery:
    background: darkGray
    foreground: lightBlue
    foreground_templates:
        - '{{if eq "Charging" .State.String}}lightCyan{{end}}'
        - '{{if eq "Discharging" .State.String}}lightRed{{end}}'
        - '{{if eq "Full" .State.String}}lightGreen{{end}}'
    leading_separator: ' ('
    options:
        charged_icon: '* '
        charging_icon: '^ '
        discharging_icon: 'v '
    template: '{{ if not .Error }}{{ .Icon }}{{ .Percentage }}{{ end }}{{ .Error }}'
    trailing_separator: )
git:
    background: darkGray
    foreground: lightCyan
    leading_separator: ' ('
    options:
        branch_icon: ""
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    template: '{{ .HEAD }}'
    trailing_separator: )
go:
    background: darkGray
    foreground: lightCyan
    leading_separator: ' ('
    options:
        fetch_version: false
    template: '{{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}'
    trailing_separator: )
java:
    background: darkGray
    foreground: lightRed
    leading_separator: ' ('
    options:
        fetch_version: false
    template: '{{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}'
    trailing_separator: )
julia:
    background: darkGray
    foreground: lightBlue
    leading_separator: ' ('
    options:
        fetch_version: false
    template: '{{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}'
    trailing_separator: )
node:
    background: darkGray
    foreground: lightGreen
    leading_separator: ' ('
    options:
        fetch_version: false
    template: '{{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }}{{ .Full }}'
    trailing_separator: )
path:
    background: darkGray
    foreground: lightGreen
    leading_separator: (
    options:
        style: folder
        windows_registry_icon: reg
    template: ' {{ .Path }}'
    trailing_separator: )
prompt:
    - segments:
        - session
python:
    background: darkGray
    foreground: lightYellow
    leading_separator: ' ('
    options:
        fetch_version: false
    template: '{{ if .Error }}{{ .Error }}{{ else }}{{ if .Venv }}{{ .Venv }} {{ end }}{{ .Full }}{{ end }}'
    trailing_separator: )
rprompt:
    - segments:
        - path
        - git
        - python
        - go
        - node
        - ruby
        - java
        - julia
        - battery
ruby:
    background: darkGray
    foreground: lightRed
    leading_separator: ' ('
    options:
        fetch_version: false
    template: '{{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}'
    trailing_separator: )
session:
    background: darkGray
    foreground: lightBlue
    leading_separator: (
    template: '{{ .UserName }} >'
    trailing_separator: ') '
