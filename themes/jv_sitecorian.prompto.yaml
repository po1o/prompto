console_title_template: '{{if .Root}}Admin: {{end}} {{.Folder}}'
executiontime:
    background: '#2B2B2B'
    foreground: '#ffffff'
    leading_separator: 
    options:
        always_enabled: true
    template: ' {{ .FormattedMs }}<#ffffff>  </>'
    trailing_separator: 
cursor_padding: true
git:
    background: '#6f42c1'
    foreground: '#ffffff'
    options:
        fetch_status: true
        fetch_upstream_icon: true
    trailing_separator: ""
    template: ' {{ .UpstreamIcon }}{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }}  {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }}  {{ .StashCount }}{{ end }} '
os:
    background: '#2B2B2B'
    foreground: '#1CA6A3'
    trailing_separator: ""
    template: ' {{ if .WSL }}WSL at {{ end }}{{.Icon}} '
path:
    background: '#185F7B'
    foreground: '#ffffff'
    options:
        home_icon: '  '
        style: mixed
    template: '{{ .Path }} '
    trailing_separator: 
prompt:
    - segments:
        - text
    - segments:
        - text.2
        - text.3
        - path
        - git
        - text.4
        - status
    - segments:
        - text.5
        - os
        - root
        - session
root:
    background: '#2B2B2B'
    foreground: '#FBD951'
    trailing_separator: ""
    template: ' '
rprompt:
    - segments:
        - time
        - executiontime
    - segments:
        - shell
session:
    background: '#DC291E'
    foreground: '#ffffff'
    trailing_separator: ""
    template: ' {{ .UserName }} '
shell:
    background: '#000000'
    foreground: '#666666'
    template:  {{ .Name }}
status:
    background: '#4caf50'
    background_templates:
        - '{{ if gt .Code 0 }}red{{ end }}'
    foreground: '#ffffff'
    options:
        always_enabled: true
    trailing_separator: ""
    template: ' {{ if gt .Code 0 }}{{ else }} ♥{{ end }} '
text:
    foreground: '#ffffff'
text.2:
    foreground: '#185F7B'
    template: 
text.3:
    background: '#185F7B'
    foreground: '#185F7B'
    trailing_separator: ""
text.4:
    template: ''
text.5:
    foreground: '#2B2B2B'
    template: 
time:
    background: '#2B2B2B'
    foreground: '#ffffff'
    leading_separator: 
    options:
        time_format: 3:04:05 PM
    template: ' {{ .LastDate | date .Format }}<#ffffff>  </>'
    trailing_separator: 
