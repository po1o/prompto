# Code generated by src/tools/genconsolethemes; DO NOT EDIT.
#
# Console variant of "tokyo", for the Linux virtual console.
#
# Nerd Font icons are removed and Powerline separators replaced with ASCII,
# because a console font carries neither. Colors are approximated to the 16
# ANSI colors a console can show, so themes that differ only in shade look
# alike here.
#
# To take this file over, delete the generated marker on the first line: the
# generator then leaves it alone. Otherwise edit tokyo.prompto.yaml and regenerate.

aws:
    foreground: white
    template: '[<lightWhite></> <lightYellow>{{ .Profile }}</>{{if .Region}}@<lightYellow>{{ .Region }}</>{{ end }}]'
az:
    foreground: white
    template: '[<lightWhite></> Subscription: <lightYellow>{{ .Name }}</>]'
azd:
    foreground: white
    template: '[<lightWhite></> Azure Developer CLI Environment: <lightYellow>{{ .DefaultEnvironment }}</> :: <lightYellow>{{ .Version }}</>]'
battery:
    foreground: lightRed
    foreground_templates:
        - '{{if eq "Charging" .State.String}}lightCyan{{end}}'
        - '{{if eq "Discharging" .State.String}}lightRed{{end}}'
        - '{{if eq "Full" .State.String}}lightGreen{{end}}'
    options:
        charged_icon: '<lightWhite></> '
        charging_icon: ' '
        discharging_icon: '<lightYellow></> '
    template: '[{{ if not .Error }}{{ .Icon }}{{ .Percentage }}{{ end }}{{ .Error }}]'
error_line:
    background: transparent
    template: '<red></> '
executiontime:
    foreground: white
    options:
        style: dallas
        threshold: 0
    template: '[<lightWhite></> {{ .FormattedMs }}s]'
cursor_padding: true
gcp:
    foreground: white
    template: '[{{ if .Error }}{{ .Error }}{{ else }}<lightWhite></> <lightYellow>{{ .Project }}</> :: <lightYellow>{{.Account}}</>{{ end }}]'
git:
    foreground: white
    options:
        fetch_status: true
        fetch_upstream_icon: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    template: '[<lightWhite>{{ .UpstreamIcon }} </>{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }} <lightWhite></> {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }} <lightWhite></> {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }} <lightWhite></> {{ .StashCount }}{{ end }}]'
kubectl:
    foreground: white
    template: '[<lightWhite></> <lightYellow>{{.Context}}</>{{if .Namespace}} :: <lightYellow>{{.Namespace}}</>{{end}}]'
path:
    foreground: white
    options:
        style: full
        windows_registry_icon: reg
    template: '[<lightWhite></> <white>{{ .Path }}</>]'
project:
    foreground: white
    template: '[{{ if .Error }}{{ .Error }}{{ else }}{{ if .Name }}<lightWhite></> {{ .Name }}{{ end }}{{ if .Target }} {{ .Target }}{{ end }}{{ end }}]'
prompt:
    - leading_separator: <white>-</>
      segments:
        - time
        - session
        - sysinfo
        - battery
        - executiontime
    - leading_separator: <white>-</>
      segments:
        - az
        - azd
        - aws
        - gcp
        - kubectl
        - project
    - leading_separator: <white>-</>
      segments:
        - path
        - git
    - leading_separator: <white>--</>
      segments:
        - root
        - status
        - text
root:
    template: <lightYellow>[#]</>
secondary:
    - segments:
        - text.secondary
text.secondary:
    background: transparent
    template: ' '
session:
    foreground: white
    template: '[<lightWhite></> {{ .UserName }} :: <lightWhite></> {{ .HostName }}]'
status:
    foreground: white
    template: '[<lightWhite></> Error, check your command]'
sysinfo:
    foreground: white
    template: '[<lightWhite></> RAM: {{ (div ((sub .PhysicalTotalMemory .PhysicalAvailableMemory)|float64) 1073741824.0) }}/{{ (div .PhysicalTotalMemory 1073741824.0) }}GB]'
text:
    template: '>'
time:
    foreground: white
    options:
        time_format: 01/02/2006 @ 3:04:05 PM MST
    template: '[<lightWhite></> {{ .LastDate | date .Format }}]'
valid_line:
    background: transparent
    template: '> '
