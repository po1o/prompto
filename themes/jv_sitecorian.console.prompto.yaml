# Console variant of the `jv_sitecorian` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of jv_sitecorian.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

console_title_template: '{{if .Root}}Admin: {{end}} {{.Folder}}'
executiontime:
    background: darkGray
    foreground: lightWhite
    leading_separator: '|'
    options:
        always_enabled: true
    template: ' {{ .FormattedMs }}<lightWhite> </>'
    trailing_separator: '|'
cursor_padding: true
git:
    background: lightBlue
    foreground: lightWhite
    options:
        fetch_status: true
        fetch_upstream_icon: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    trailing_separator: '>'
    template: ' {{ .UpstreamIcon }}{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }} {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }} {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }} {{ .StashCount }}{{ end }} '
os:
    background: darkGray
    foreground: cyan
    trailing_separator: '>'
    template: ' {{ if .WSL }}WSL at {{ end }}{{.Icon}} '
    options:
        display_distro_name: true
        android: android
        linux: linux
        macos: mac
path:
    background: darkGray
    foreground: lightWhite
    options:
        home_icon: ' '
        style: mixed
        windows_registry_icon: reg
    template: '{{ .Path }} '
    trailing_separator: '>'
prompt:
    - segments:
        - text
    - segments:
        - text.2
        - text.3
        - path
        - git
        - text.4
        - status
    - segments:
        - text.5
        - os
        - root
        - session
root:
    background: darkGray
    foreground: lightYellow
    trailing_separator: '>'
    template: '# '
rprompt:
    - segments:
        - time
        - executiontime
    - segments:
        - shell
session:
    background: red
    foreground: lightWhite
    trailing_separator: '>'
    template: ' {{ .UserName }} '
shell:
    background: black
    foreground: darkGray
    template: ' {{ .Name }}'
status:
    background: lightGreen
    background_templates:
        - '{{ if gt .Code 0 }}red{{ end }}'
    foreground: lightWhite
    options:
        always_enabled: true
    trailing_separator: '>'
    template: ' {{ if gt .Code 0 }}{{ else }} *{{ end }} '
text:
    foreground: lightWhite
text.2:
    foreground: darkGray
    template: '|'
text.3:
    background: darkGray
    foreground: darkGray
    trailing_separator: '>'
text.4:
    template: ''
text.5:
    foreground: darkGray
    template: '|'
time:
    background: darkGray
    foreground: lightWhite
    leading_separator: '|'
    options:
        time_format: 3:04:05 PM
    template: ' {{ .LastDate | date .Format }}<lightWhite> </>'
    trailing_separator: '|'
