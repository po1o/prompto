# Console variant of the `jandedobbeleer` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of jandedobbeleer.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

aws:
    background_templates:
        - '{{if contains "default" .Profile}}lightRed{{end}}'
        - '{{if contains "jan" .Profile}}lightRed{{end}}'
    foreground: lightWhite
    options:
        display_default: false
    trailing_separator: '>'
    template: ' {{ .Profile }}{{ if .Region }}@{{ .Region }}{{ end }} '
azfunc:
    background: lightYellow
    foreground: lightWhite
    options:
        display_mode: files
        fetch_version: false
    trailing_separator: '>'
    template: ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
battery:
    background: lightRed
    background_templates:
        - '{{if eq "Charging" .State.String}}lightCyan{{end}}'
        - '{{if eq "Discharging" .State.String}}lightRed{{end}}'
        - '{{if eq "Full" .State.String}}lightGreen{{end}}'
    foreground: lightWhite
    options:
        charged_icon: ' '
        charging_icon: ' '
        discharging_icon: ' '
    trailing_separator: '>'
    template: ' {{ if not .Error }}{{ .Icon }}{{ .Percentage }}{{ end }}{{ .Error }} '
console_title_template: '{{ .Shell }} in {{ .Folder }}'
executiontime:
    background: white
    foreground: lightWhite
    options:
        always_enabled: true
    template: '<transparent>></> {{ .FormattedMs }} '
cursor_padding: true
git:
    background: lightYellow
    background_templates:
        - '{{ if or (.Working.Changed) (.Staging.Changed) }}lightRed{{ end }}'
        - '{{ if and (gt .Ahead 0) (gt .Behind 0) }}lightRed{{ end }}'
        - '{{ if gt .Ahead 0 }}white{{ end }}'
        - '{{ if gt .Behind 0 }}white{{ end }}'
    foreground: darkGray
    leading_separator: (
    options:
        branch_template: '{{ trunc 25 .Branch }}'
        fetch_status: true
        fetch_upstream_icon: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    template: ' {{ .UpstreamIcon }}{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }} {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }} {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }} {{ .StashCount }}{{ end }} '
    trailing_separator: )
go:
    background: lightCyan
    foreground: black
    options:
        fetch_version: true
    trailing_separator: '>'
    template: ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
julia:
    background: lightBlue
    foreground: black
    options:
        fetch_version: true
    trailing_separator: '>'
    template: ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
node:
    background: white
    foreground: lightWhite
    options:
        fetch_version: true
    trailing_separator: '>'
    template: ' {{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }}{{ .Full }} '
path:
    background: lightRed
    foreground: lightWhite
    options:
        folder_separator_icon: ' > '
        home_icon: "~"
        style: folder
        windows_registry_icon: reg
    trailing_separator: '>'
    template: ' {{ .Path }} '
prompt:
    - segments:
        - session
        - path
        - git
        - node
        - go
        - julia
        - python
        - ruby
        - azfunc
        - aws
        - root
        - executiontime
        - status
python:
    background: lightYellow
    foreground: black
    options:
        display_mode: files
        fetch_virtual_env: false
    trailing_separator: '>'
    template: ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
root:
    background: lightYellow
    foreground: black
    trailing_separator: '>'
    template: ' # '
rprompt:
    - segments:
        - shell
        - ytm
        - battery
        - time
ruby:
    background: red
    foreground: lightWhite
    options:
        display_mode: files
        fetch_version: true
    trailing_separator: '>'
    template: ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
session:
    background: white
    foreground: lightWhite
    leading_separator: (
    template: ' {{ .UserName }} '
    trailing_separator: '>'
shell:
    background: cyan
    foreground: lightWhite
    template: <cyan,transparent>(</> {{ .Name }} <transparent,cyan><</>
status:
    background: cyan
    background_templates:
        - '{{ if gt .Code 0 }}lightRed{{ end }}'
    foreground: lightWhite
    options:
        always_enabled: true
    template: '<parentBackground>></> '
    trailing_separator: )
time:
    background: cyan
    foreground: black
    leading_separator: <
    template: ' {{ .LastDate | date .Format }} '
    trailing_separator: )
ytm:
    background: lightGreen
    foreground: black
    options:
        paused_icon: ' '
        playing_icon: ' '
        ad_icon: 'ad '
        stopped_icon: '[] '
    trailing_separator: '>'
    template: ' {{ .Icon }}{{ if ne .Status "stopped" }}{{ .Artist }} - {{ .Track }}{{ end }} '
