cursor_padding: true
git:
    foreground: '#C2C206'
    template: '{{ .HEAD }} '
path:
    foreground: '#ffffff'
    options:
        style: full
    template: '{{ .Path }} '
prompt:
    - segments:
        - path
        - git
        - root
        - status
    - segments:
        - text
root:
    foreground: '#B5B50D'
    template: '  '
status:
    foreground: '#C94A16'
    template: 'x{{ reason .Code }} '
text:
    foreground: '#007ACC'
    template: 
