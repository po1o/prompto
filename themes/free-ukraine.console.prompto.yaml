# Console variant of the `free-ukraine` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of free-ukraine.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

battery:
    background: cyan
    foreground: lightYellow
    leading_style: powerline
    options:
        charged_icon: ' '
        charging_icon: ' '
        discharging_icon: ' '
    template: ' {{ if not .Error }}{{ .Icon }}{{ .Percentage }}{{ end }}{{ .Error }}% <black><</>'
console_title_template: '{{if .Root}}Admin: {{end}} {{.Folder}}'
executiontime:
    background: cyan
    foreground: lightYellow
    leading_style: powerline
    options:
        always_enabled: true
    template: ' {{ .FormattedMs }} <black><</>'
cursor_padding: true
git:
    background: cyan
    foreground: lightYellow
    options:
        fetch_status: true
        fetch_upstream_icon: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    style: powerline
    template: ' {{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }} {{ .Working.String }}{{ end }}{{ if and (.Staging.Changed) (.Working.Changed) }} |{{ end }}{{ if .Staging.Changed }} {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0}} {{ .StashCount }}{{ end }}{{ if gt .WorktreeCount 0}} {{ .WorktreeCount }}{{ end }} '
git.2:
    background: lightBlue
    background_templates:
        - '{{ if or (.Working.Changed) (.Staging.Changed) }}lightBlue{{ end }}'
        - '{{ if and (gt .Ahead 0) (gt .Behind 0) }}yellow{{ end }}'
        - '{{ if gt .Ahead 0 }}lightGreen{{ end }}'
        - '{{ if gt .Behind 0 }}lightRed{{ end }}'
    foreground: cyan
    options:
        fetch_status: false
        fetch_upstream_icon: false
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    style: powerline
    template: ""
os:
    background: cyan
    foreground: lightYellow
    style: powerline
    template: ' {{ if .WSL }}WSL at {{ end }}{{.Icon}} '
    options:
        display_distro_name: true
        android: android
        linux: linux
        macos: mac
path:
    background: cyan
    foreground: lightYellow
    options:
        home_icon: ""
        style: mixed
        windows_registry_icon: reg
    template: '{{ .Path }} '
    trailing_style: powerline
prompt:
    - segments:
        - text
    - segments:
        - text.2
        - text.3
        - path
        - git
        - git.2
        - text.4
        - status
    - segments:
        - text.6
        - os
        - root
        - session
root:
    background: cyan
    foreground: lightYellow
    style: powerline
    template: '# '
rprompt:
    - segments:
        - text.5
        - battery
        - executiontime
        - time
    - segments:
        - text.7
        - text.8
        - text.9
        - text.10
session:
    background: lightYellow
    foreground: cyan
    style: powerline
    template: ' {{ if .SSHSession }} {{ end }}{{ .UserName }} '
status:
    background: lightYellow
    foreground: cyan
    foreground_templates:
        - '{{ if gt .Code 0 }}red{{ end }}'
    leading_separator: <transparent,lightYellow>></>
    options:
        always_enabled: true
    template: ' {{ if gt .Code 0 }} {{ else }} * {{ end }}'
    trailing_style: powerline
text:
    foreground: lightWhite
text.2:
    foreground: cyan
    template: '|'
text.3:
    background: cyan
    foreground: lightYellow
    style: powerline
    template: ' '
text.4:
    template: ''
text.5:
    background: cyan
    foreground: lightYellow
    leading_style: rounded
    template: ' <black><</>'
text.6:
    foreground: cyan
    template: '|'
text.7:
    foreground: cyan
    template: ""
text.8:
    foreground: lightYellow
    template: ""
text.9:
    foreground: cyan
    template: ""
text.10:
    foreground: lightYellow
    template: ' Ukraine'
time:
    background: cyan
    foreground: lightYellow
    leading_style: powerline
    options:
        time_format: _2,15:04
    template: ' {{ .LastDate | date .Format }}'
    trailing_style: rounded
