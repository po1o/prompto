# Console variant of the `gruvbox` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of gruvbox.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

aws:
    background_templates:
        - '{{if contains "default" .Profile}}lightRed{{end}}'
        - '{{if contains "jan" .Profile}}lightRed{{end}}'
    foreground: lightWhite
    options:
        display_default: false
    style: powerline
    template: ' {{ .Profile }}{{ if .Region }}@{{ .Region }}{{ end }} '
azfunc:
    background: lightYellow
    foreground: lightWhite
    options:
        display_mode: files
        fetch_version: false
    style: powerline
    template: ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
console_title_template: '{{ .Folder }}'
cursor_padding: true
git:
    background: yellow
    background_templates:
        - '{{ if or (.Working.Changed) (.Staging.Changed) }}lightRed{{ end }}'
        - '{{ if and (gt .Ahead 0) (gt .Behind 0) }}lightRed{{ end }}'
        - '{{ if gt .Ahead 0 }}white{{ end }}'
        - '{{ if gt .Behind 0 }}white{{ end }}'
    foreground: black
    leading_style: rounded
    options:
        branch_icon: ' '
        branch_identical_icon: '*'
        branch_template: '{{ trunc 25 .Branch }}'
        fetch_status: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    template: ' {{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }} {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }} {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }} {{ .StashCount }}{{ end }} '
    trailing_style: rounded
go:
    background: lightCyan
    foreground: black
    options:
        fetch_version: true
    style: powerline
    template: ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
julia:
    background: lightBlue
    foreground: black
    options:
        fetch_version: true
    style: powerline
    template: ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
os:
    background: darkGray
    foreground: lightWhite
    style: powerline
    template: '{{ if .WSL }}WSL at{{ end }} {{.Icon}} '
    options:
        display_distro_name: true
        android: android
        linux: linux
        macos: mac
path:
    background: darkGray
    foreground: black
    options:
        style: full
        windows_registry_icon: reg
    trailing_style: powerline
    template: ' {{ .Path }} '
prompt:
    - segments:
        - os
        - path
        - git
        - go
        - julia
        - python
        - ruby
        - azfunc
        - aws
        - root
python:
    background: lightYellow
    foreground: black
    options:
        display_mode: files
        fetch_virtual_env: false
    style: powerline
    template: ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
root:
    background: lightYellow
    foreground: black
    style: powerline
    template: ' # '
ruby:
    background: red
    foreground: lightWhite
    options:
        display_mode: files
        fetch_version: true
    style: powerline
    template: ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
