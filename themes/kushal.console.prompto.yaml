# Console variant of the `kushal` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of kushal.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

cmake:
    background: green
    foreground: lightWhite
    style: powerline
    template: ' cmake {{ .Full }} '
console_title_template: '{{ if .Root }}root @ {{ end }}{{ .Shell }} in {{ .Folder }}'
executiontime:
    background: darkGray
    foreground: lightWhite
    options:
        style: roundrock
        threshold: 0
    template: ' {{ .FormattedMs }} '
    trailing_style: rounded
git:
    background: cyan
    background_templates:
        - '{{ if or (.Working.Changed) (.Staging.Changed) }}cyan{{ end }}'
        - '{{ if and (gt .Ahead 0) (gt .Behind 0) }}cyan{{ end }}'
        - '{{ if gt .Ahead 0 }}white{{ end }}'
        - '{{ if gt .Behind 0 }}white{{ end }}'
    foreground: black
    options:
        branch_icon: ' '
        fetch_status: true
        fetch_upstream_icon: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    style: powerline
    template: ' {{ .UpstreamIcon }}{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }} {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }}<lightWhite> {{ .Staging.String }}</>{{ end }}{{ if gt .StashCount 0 }} {{ .StashCount }}{{ end }} '
go:
    background: lightCyan
    foreground: lightWhite
    style: powerline
    template: ' {{ .Full }} '
os:
    background: darkGray
    foreground: lightWhite
    leading_style: powerline
    options:
        alpine: alpine
        arch: arch
        centos: centos
        debian: debian
        elementary: elementary
        fedora: fedora
        gentoo: gentoo
        linux: linux
        macos: macos
        manjaro: manjaro
        mint: mint
        opensuse: opensuse
        raspbian: raspbian
        ubuntu: ubuntu
        windows: windows
        display_distro_name: true
        android: android
    template: ' {{ if .WSL }} on {{ end }}{{ .Icon }} '
pwd: osc99
path:
    foreground: white
    leading_separator: <cyan> </><white> in </>
    options:
        folder_icon: ' '
        folder_separator_icon: ' '
        home_icon: ' '
        max_depth: 3
        style: agnoster_short
        windows_registry_icon: reg
    template: ' {{ .Path }} '
prompt:
    - segments:
        - os
        - shell
        - root
        - cmake
        - python
        - go
        - rust
        - git
    - segments:
        - text
        - time
        - path
    - segments:
        - text.2
        - status.2
python:
    background: lightYellow
    foreground: black
    options:
        display_mode: context
    style: powerline
    template: ' {{ if .Venv }}{{ .Venv }} {{ end }}{{ .Full }} '
root:
    background: lightRed
    foreground: lightWhite
    style: powerline
    template: ' admin '
rprompt:
    - segments:
        - status
        - executiontime
rust:
    background: white
    foreground: darkGray
    style: powerline
    template: ' {{ .Full }} '
secondary:
    - segments:
        - text.secondary
text.secondary:
    background: transparent
    foreground: lightWhite
    template: '--> '
shell:
    background: cyan
    foreground: black
    style: powerline
    template: ' {{ .Name }} '
status:
    background: cyan
    background_templates:
        - '{{ if gt .Code 0 }}lightRed{{ end }}'
    foreground: darkGray
    foreground_templates:
        - '{{ if gt .Code 0 }}lightWhite{{ end }}'
    leading_style: rounded
    options:
        always_enabled: true
    template: ' {{ if gt .Code 0 }}{{ else }}{{ end }} '
status.2:
    foreground: lightWhite
    options:
        always_enabled: true
    template: '> '
text:
    foreground: lightWhite
    template: --
text.2:
    foreground: lightWhite
    template: --
time:
    foreground: lightWhite
    options:
        time_format: "15:04:05"
    template: <lightWhite></> {{ .LastDate | date .Format }} <lightCyan>|</> {{ .LastDate | date "2 Jan, Monday" }} <lightCyan>|</>
transient:
    - segments:
        - text.transient
text.transient:
    background: transparent
    foreground: lightWhite
    template: ' '
