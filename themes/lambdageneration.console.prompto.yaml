# Code generated by src/tools/genconsolethemes; DO NOT EDIT.
#
# Console variant of "lambdageneration", for the Linux virtual console.
#
# Nerd Font icons are removed and Powerline separators replaced with ASCII,
# because a console font carries neither. Colors are approximated to the 16
# ANSI colors a console can show, so themes that differ only in shade look
# alike here.
#
# To take this file over, delete the generated marker on the first line: the
# generator then leaves it alone. Otherwise edit lambdageneration.prompto.yaml and regenerate.

battery:
    background: black
    foreground: cyan
    foreground_templates:
        - '{{ if eq "Full" .State.String }}black{{ end }}'
        - '{{ if eq "Charging" .State.String }}lightCyan{{ end }}'
        - '{{ if eq "Discharging" .State.String }}lightRed{{ end }}'
    options:
        charged_icon: ' '
        charging_icon: ' '
        discharging_icon: ' '
    trailing_separator: '>'
    template: ' {{ if not .Error }}{{ .Icon }}{{ .Percentage }}{{ end }}{{ .Error }} >'
executiontime:
    background: black
    foreground: lightRed
    options:
        always_enabled: true
        style: austin
        threshold: 500
    trailing_separator: '>'
    template: ' {{ .FormattedMs }} >'
cursor_padding: true
git:
    background: black
    foreground: lightYellow
    options:
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
os:
    background: black
    foreground: lightRed
    leading_separator: --<
    template: ' {{ if .WSL }}WSL at {{ end }}{{.Icon}} >'
    options:
        display_distro_name: true
        android: android
        linux: linux
        macos: mac
path:
    background: black
    foreground: lightRed
    options:
        style: full
        windows_registry_icon: reg
    template: ' {{ .Path }} '
    trailing_separator: (
path.2:
    background: lightRed
    foreground: black
    leading_separator: --(
    template: ""
    trailing_separator: )
    options:
        windows_registry_icon: reg
prompt:
    - segments:
        - os
        - executiontime
        - root
        - path
        - git
        - battery
        - status
    - segments:
        - path.2
root:
    background: black
    foreground: cyan
    template: ' # '
rprompt:
    - segments:
        - session
        - time
session:
    background: black
    foreground: lightRed
    leading_separator: (
    template: ' {{ if .SSHSession }} {{ end }}{{ .UserName }}@{{ .HostName }} <lightRed><</> '
status:
    background: black
    background_templates:
        - '{{ if gt .Code 0 }}black{{ end }}'
    foreground: lightRed
    options:
        always_enabled: true
    template: ' {{ if gt .Code 0 }} {{ reason .Code }}{{ else }}{{ end }} '
    trailing_separator: )
time:
    background: black
    foreground: lightRed
    options:
        time_format: 15:04:05, _2
    template: '{{ .LastDate | date .Format }} '
    trailing_separator: )
