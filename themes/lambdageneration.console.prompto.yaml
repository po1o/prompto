# Console variant of the `lambdageneration` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of lambdageneration.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

battery:
    background: black
    foreground: cyan
    foreground_templates:
        - '{{ if eq "Full" .State.String }}black{{ end }}'
        - '{{ if eq "Charging" .State.String }}lightCyan{{ end }}'
        - '{{ if eq "Discharging" .State.String }}lightRed{{ end }}'
    options:
        charged_icon: ' '
        charging_icon: ' '
        discharging_icon: ' '
    style: powerline
    template: ' {{ if not .Error }}{{ .Icon }}{{ .Percentage }}{{ end }}{{ .Error }} >'
executiontime:
    background: black
    foreground: lightRed
    options:
        always_enabled: true
        style: austin
        threshold: 500
    trailing_style: powerline
    template: ' {{ .FormattedMs }} >'
cursor_padding: true
git:
    background: black
    foreground: lightYellow
    options:
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
os:
    background: black
    foreground: lightRed
    leading_separator: --<
    template: ' {{ if .WSL }}WSL at {{ end }}{{.Icon}} >'
    options:
        display_distro_name: true
        android: android
        linux: linux
        macos: mac
path:
    background: black
    foreground: lightRed
    options:
        style: full
        windows_registry_icon: reg
    template: ' {{ .Path }} '
    trailing_separator: (
path.2:
    background: lightRed
    foreground: black
    leading_separator: --(
    template: ""
    trailing_style: rounded
    options:
        windows_registry_icon: reg
prompt:
    - segments:
        - os
        - executiontime
        - root
        - path
        - git
        - battery
        - status
    - segments:
        - path.2
root:
    background: black
    foreground: cyan
    template: ' # '
rprompt:
    - segments:
        - session
        - time
session:
    background: black
    foreground: lightRed
    leading_style: rounded
    template: ' {{ if .SSHSession }} {{ end }}{{ .UserName }}@{{ .HostName }} <lightRed><</> '
status:
    background: black
    background_templates:
        - '{{ if gt .Code 0 }}black{{ end }}'
    foreground: lightRed
    options:
        always_enabled: true
    template: ' {{ if gt .Code 0 }} {{ reason .Code }}{{ else }}{{ end }} '
    style: rounded
time:
    background: black
    foreground: lightRed
    options:
        time_format: 15:04:05, _2
    template: '{{ .LastDate | date .Format }} '
    style: rounded
