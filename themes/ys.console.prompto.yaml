cursor_padding: true
git:
    options:
        fetch_status: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    template: '<darkGray>on</> <white>git:</><cyan>{{ .HEAD }}</>{{ if .Working.Changed }}<red> x</>{{ end }} '
path:
    foreground: lightYellow
    options:
        style: full
        windows_registry_icon: reg
    template: '<darkGray>in </>{{ .Path }} '
prompt:
    - segments:
        - python
    - segments:
        - text
        - root
        - session
        - path
        - git
        - time
        - status
    - segments:
        - text.2
python:
    foreground: white
    options:
        fetch_version: false
    template: ({{ if .Error }}{{ .Error }}{{ else }}{{ if .Venv }}{{ .Venv }} {{ end }}{{ .Full }}{{ end }})
root:
    foreground: red
    template: ' % '
session:
    template: '<cyan>{{ .UserName }}</> <darkGray>@</> <green>{{ .HostName }}</> '
status:
    foreground: red
    template: ' C:{{ if gt .Code 0 }}{{ .Code }}{{ end }} '
text:
    foreground: lightBlue
    template: '# '
text.2:
    foreground: lightRed
    template: $
time:
    foreground: darkGray
    template: '[{{ .LastDate | date .Format }}]'
