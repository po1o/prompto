# Code generated by src/tools/genconsolethemes; DO NOT EDIT.
#
# Console variant of "sim-web", for the Linux virtual console.
#
# Nerd Font icons are removed and Powerline separators replaced with ASCII,
# because a console font carries neither. Colors are approximated to the 16
# ANSI colors a console can show, so themes that differ only in shade look
# alike here.
#
# To take this file over, delete the generated marker on the first line: the
# generator then leaves it alone. Otherwise edit sim-web.prompto.yaml and regenerate.

console_title_template: '{{ .Folder }}'
executiontime:
    foreground: white
    options:
        style: dallas
        threshold: 0
    trailing_separator: '>'
    template: ' {{ .FormattedMs }}s <lightWhite></>'
git:
    foreground: lightRed
    options:
        branch_icon: ' '
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    trailing_separator: '>'
    template: ({{ .HEAD }})
node:
    foreground: green
    trailing_separator: '>'
    template: ' {{ .Full }} '
npm:
    foreground: lightRed
    trailing_separator: '>'
    template: '<lightWhite>and</> {{ .Full }} '
path:
    foreground: white
    options:
        folder_icon: ""
        folder_separator_icon: ' > '
        home_icon: home
        style: agnoster_full
        windows_registry_icon: reg
    trailing_separator: '>'
    template: ' {{ .Path }} '
prompt:
    - segments:
        - path
        - git
    - segments:
        - status
rprompt:
    - segments:
        - executiontime
        - node
        - npm
status:
    foreground: cyan
    options:
        always_enabled: true
    template: '<cyan>></>_: '
transient:
    - segments:
        - text.transient
text.transient:
    background: transparent
    foreground: lightWhite
    template: '{{ .Shell }}'
