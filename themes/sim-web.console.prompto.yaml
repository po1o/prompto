# Console variant of the `sim-web` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of sim-web.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

console_title_template: '{{ .Folder }}'
executiontime:
    foreground: white
    options:
        style: dallas
        threshold: 0
    trailing_style: powerline
    template: ' {{ .FormattedMs }}s <lightWhite></>'
git:
    foreground: lightRed
    options:
        branch_icon: ' '
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    style: powerline
    template: ({{ .HEAD }})
node:
    foreground: green
    style: powerline
    template: ' {{ .Full }} '
npm:
    foreground: lightRed
    style: powerline
    template: '<lightWhite>and</> {{ .Full }} '
path:
    foreground: white
    options:
        folder_icon: ""
        folder_separator_icon: ' > '
        home_icon: home
        style: agnoster_full
        windows_registry_icon: reg
    trailing_style: powerline
    template: ' {{ .Path }} '
prompt:
    - segments:
        - path
        - git
    - segments:
        - status
rprompt:
    - segments:
        - executiontime
        - node
        - npm
status:
    foreground: cyan
    options:
        always_enabled: true
    template: '<cyan>></>_: '
transient:
    - segments:
        - text.transient
text.transient:
    background: transparent
    foreground: lightWhite
    template: '{{ .Shell }}'
