az:
    background: '#1a1af5'
    foreground: '#ffffff'
    template: '  {{ .Name }} '
    trailing_separator: 
console_title_template: '{{if .Root}}root :: {{end}}{{.Shell}} :: {{.Folder}}'
cursor_padding: true
git:
    background: '#ffffff'
    foreground: '#000000'
    foreground_templates:
        - '{{ if or (.Working.Changed) (.Staging.Changed) }}#ffea00{{ end }}'
        - '{{ if gt .Ahead 0 }}#2EC4B6{{ end }}'
        - '{{ if gt .Behind 0 }}#8A4FFF{{ end }}'
    options:
        fetch_status: true
        fetch_upstream_icon: true
    template: '<#000000> </>{{ .UpstreamIcon }}{{ .HEAD }}{{ if .Staging.Changed }}<#2FDA4E>  {{ .Staging.String }}</>{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Working.Changed }}<#E84855>  {{ .Working.String }}</>{{ end }} '
os:
    background: '#ffffff'
    foreground: '#000000'
    leading_separator: 
    options:
        alpine: 
        arch: 
        centos: 
        debian: 
        elementary: 
        fedora: 
        gentoo: 
        linux: 
        macos: 
        manjaro: 
        mint: 
        opensuse: 
        raspbian: 
        ubuntu: 
        windows: 
    template: ' {{ if .WSL }} on {{ end }}{{ .Icon }}<#000000> </>'
path:
    background: '#ffffff'
    foreground: '#000000'
    options:
        folder_icon: <#000000> </>
        folder_separator_icon: <#000000> </>
        home_icon: ' '
        style: agnoster_short
    template: '<#000000>  </>{{ .Path }} '
prompt:
    - segments:
        - text
        - session
        - az
        - status
    - segments:
        - os
        - root
        - path
        - git
        - terraform
        - text.2
    - segments:
        - text.3
root:
    background: '#000000'
    foreground: '#ffffff'
    template: ' <#ffffff> </>'
session:
    background: '#4707a8'
    foreground: '#ffffff'
    leading_separator: 
    template: ' {{ .UserName }}@{{ .HostName }} '
    trailing_separator: 
status:
    background: '#4707a8'
    background_templates:
        - '{{ if gt .Code 0 }}#f1184c{{ end }}'
    foreground: '#ffffff'
    leading_separator: <transparent></>
    options:
        always_enabled: true
    template: '  '
    trailing_separator: 
terraform:
    background: '#ffffff'
    foreground: '#000000'
    trailing_separator: ""
    template: ' {{ .WorkspaceName }} '
text:
    background: '#4707a8'
    foreground: '#000000'
    leading_separator: 
text.2:
    background: '#ffffff'
    foreground: '#000000'
    trailing_separator: 
text.3:
    foreground: '#1a1af5'
    template: ' ❯ '
