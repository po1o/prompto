console_title_template: '{{if .Segments.Git.RepoName}} {{.Segments.Git.RepoName}} {{else}} {{.Folder}} {{end}}'
cursor_padding: true
git:
    background: lightGreen
    background_templates:
        - '{{ if or (.Working.Changed) (.Staging.Changed) }}lightRed{{ end }}'
        - '{{ if and (gt .Ahead 0) (gt .Behind 0) }}lightRed{{ end }}'
        - '{{ if gt .Ahead 0 }}white{{ end }}'
        - '{{ if gt .Behind 0 }}white{{ end }}'
    foreground: black
    options:
        branch_ahead_icon: ^
        branch_behind_icon: v
        branch_gone_icon: '!='
        branch_icon: ' '
        branch_identical_icon: '='
        cherry_pick_icon: 'ok '
        commit_icon: '> '
        fetch_status: true
        merge_icon: 't '
        no_commits_icon: '[no commits]'
        rebase_icon: 'L '
        tag_icon: '> '
        untracked_modes:
            /Users/user/Projects/prompto/: "no"
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        revert_icon: 'revert '
    trailing_separator: '>'
    template: ' {{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }} {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }} {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }} {{ .StashCount }}{{ end }} '
path:
    background: lightCyan
    foreground: black
    options:
        style: agnoster_full
        windows_registry_icon: reg
    trailing_separator: '>'
    template: ' {{ .Path }} '
prompt:
    - segments:
        - session
        - path
        - git
        - terraform
        - status
        - time
    - segments:
        - text
        - text.2
session:
    foreground: darkGray
    template: '- {{ if .SSHSession }} {{ end }}{{ .UserName }}@{{ .HostName }} '
status:
    background: lightRed
    foreground: lightWhite
    trailing_separator: '>'
    template: ' {{ if gt .Code 0 }}error{{ else }}{{ end }} '
terraform:
    background: lightYellow
    foreground: black
    trailing_separator: '>'
    template: ' {{ .WorkspaceName }}{{ if .Version }} {{ .Version }}{{ end }} '
text:
    foreground: darkGray
