# Code generated by src/tools/genconsolethemes; DO NOT EDIT.
#
# Console variant of "slimfat", for the Linux virtual console.
#
# Nerd Font icons are removed and Powerline separators replaced with ASCII,
# because a console font carries neither. Colors are approximated to the 16
# ANSI colors a console can show, so themes that differ only in shade look
# alike here.
#
# To take this file over, delete the generated marker on the first line: the
# generator then leaves it alone. Otherwise edit slimfat.prompto.yaml and regenerate.

console_title_template: '{{if .Root}}root :: {{end}}{{.Shell}} :: {{.Folder}}'
dotnet:
    background: darkGray
    foreground: cyan
    template: ' {{ if .Unsupported }}{{ else }}{{ .Full }}{{ end }}<darkGray> <</>'
executiontime:
    foreground: lightYellow
    options:
        style: roundrock
        threshold: 500
    template: ' {{ .FormattedMs }}<lightWhite> </>'
cursor_padding: true
git:
    background: darkGray
    foreground: lightYellow
    foreground_templates:
        - '{{ if or (.Working.Changed) (.Staging.Changed) }}lightYellow{{ end }}'
        - '{{ if gt .Ahead 0 }}cyan{{ end }}'
        - '{{ if gt .Behind 0 }}lightBlue{{ end }}'
    options:
        fetch_status: true
        fetch_upstream_icon: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    template: '<darkGray>> </>{{ .UpstreamIcon }}{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}<lightRed> {{ .Working.String }}</>{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }}<lightGreen> {{ .Staging.String }}</>{{ end }}{{ if gt .StashCount 0 }} {{ .StashCount }}{{ end }} '
node:
    background: darkGray
    foreground: white
    template: ' {{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }}{{ .Full }}<darkGray> <</>'
os:
    background: darkGray
    foreground: cyan
    leading_separator: )#
    options:
        alpine: alpine
        arch: arch
        centos: centos
        debian: debian
        elementary: elementary
        fedora: fedora
        gentoo: gentoo
        linux: linux
        macos: macos
        manjaro: manjaro
        mint: mint
        opensuse: opensuse
        raspbian: raspbian
        ubuntu: ubuntu
        windows: windows
        display_distro_name: true
        android: android
    template: ' {{ if .WSL }} on {{ end }}{{ .Icon }}<darkGray> ></>'
path:
    background: darkGray
    foreground: lightWhite
    options:
        folder_icon: <white> </>
        style: full
        windows_registry_icon: reg
    template: '<lightYellow> </>{{ .Path }} '
prompt:
    - segments:
        - os
        - session
        - root
        - path
        - git
        - text
    - segments:
        - text.3
python:
    background: darkGray
    foreground: lightGreen
    template: ' {{ if .Error }}{{ .Error }}{{ else }}{{ if .Venv }}{{ .Venv }} {{ end }}{{ .Full }}{{ end }}<darkGray> <</>'
root:
    background: darkGray
    foreground: lightYellow
    template: ' <darkGray> ></>'
rprompt:
    - segments:
        - text.2
        - node
        - python
        - dotnet
        - time
    - segments:
        - text.4
        - executiontime
        - status
session:
    background: darkGray
    foreground: lightWhite
    template: ' {{ if ne .Env.PROMPTO_SESSION_DEFAULT_USER .UserName }}<lightCyan>{{ .UserName }}</><darkGray></>{{ end }}<lightCyan>{{ .HostName }}</><darkGray> ></>'
status:
    foreground: lightGreen
    foreground_templates:
        - '{{ if gt .Code 0 }}lightRed{{ end }}'
    options:
        always_enabled: true
    template: ' {{ if gt .Code 0 }}{{ .Code }}{{ end }} '
text:
    background: darkGray
    foreground: lightWhite
    trailing_separator: '>'
text.2:
    background: darkGray
    foreground: lightWhite
    leading_separator: <
text.3:
    foreground: darkGray
    template: ' ~#@> '
text.4:
    foreground: darkGray
    template: ' < '
time:
    background: darkGray
    foreground: lightWhite
    options:
        time_format: "15:04:05"
    template: ' {{ .LastDate | date .Format }}<cyan> </>'
    trailing_separator: '#('
transient:
    - segments:
        - text.transient
text.transient:
    background: transparent
    foreground: darkGray
    template: ' ~#@> '
