# Code generated by src/tools/genconsolethemes; DO NOT EDIT.
#
# Console variant of "honukai", for the Linux virtual console.
#
# Nerd Font icons are removed and Powerline separators replaced with ASCII,
# because a console font carries neither. Colors are approximated to the 16
# ANSI colors a console can show, so themes that differ only in shade look
# alike here.
#
# To take this file over, delete the generated marker on the first line: the
# generator then leaves it alone. Otherwise edit honukai.prompto.yaml and regenerate.

cursor_padding: true
git:
    foreground: yellow
    template: '<lightWhite>on git:</>{{ .HEAD }} '
    options:
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
path:
    foreground: cyan
    options:
        folder_icon: ""
        folder_separator_icon: ' > '
        style: full
        windows_registry_icon: reg
    template: ' {{ .Path }} '
prompt:
    - segments:
        - session
        - path
        - git
    - segments:
        - root
        - python
        - status
        - text
python:
    foreground: black
    template: ' {{ if .Error }}{{ .Error }}{{ else }}{{ if .Venv }}{{ .Venv }} {{ end }}{{ .Full }}{{ end }} '
root:
    foreground: lightYellow
    template: '# '
rprompt:
    - segments:
        - time
session:
    foreground: lightWhite
    template: '<cyan># </><cyan>{{ .UserName }}</> <lightWhite>in</> <green>{{ .HostName }}</> '
status:
    foreground: yellow
    template: ' {{ reason .Code }} '
text:
    foreground: yellow
    template: '> '
time:
    foreground: lightWhite
    template: '[{{ .LastDate | date .Format }}]'
