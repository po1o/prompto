# Console variant of the `honukai` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of honukai.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

cursor_padding: true
git:
    foreground: yellow
    template: '<lightWhite>on git:</>{{ .HEAD }} '
    options:
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
path:
    foreground: cyan
    options:
        folder_icon: ""
        folder_separator_icon: ' > '
        style: full
        windows_registry_icon: reg
    template: ' {{ .Path }} '
prompt:
    - segments:
        - session
        - path
        - git
    - segments:
        - root
        - python
        - status
        - text
python:
    foreground: black
    template: ' {{ if .Error }}{{ .Error }}{{ else }}{{ if .Venv }}{{ .Venv }} {{ end }}{{ .Full }}{{ end }} '
root:
    foreground: lightYellow
    template: '# '
rprompt:
    - segments:
        - time
session:
    foreground: lightWhite
    template: '<cyan># </><cyan>{{ .UserName }}</> <lightWhite>in</> <green>{{ .HostName }}</> '
status:
    foreground: yellow
    template: ' {{ reason .Code }} '
text:
    foreground: yellow
    template: '> '
time:
    foreground: lightWhite
    template: '[{{ .LastDate | date .Format }}]'
