# Console variant of the `cloud-native-azure` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of cloud-native-azure.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

az:
    background: white
    foreground: black
    style: powerline
    template: ' Subscription {{ .Name }} ({{ if .EnvironmentName | contains "AzureCloud" }}{{ "Global" }}{{ else }}{{ .EnvironmentName }}{{ end }}) '
battery:
    background: lightRed
    background_templates:
        - '{{if eq "Charging" .State.String}}lightCyan{{end}}'
        - '{{if eq "Discharging" .State.String}}lightRed{{end}}'
        - '{{if eq "Full" .State.String}}lightGreen{{end}}'
    foreground: lightWhite
    options:
        charged_icon: ' '
        charging_icon: ' '
        discharging_icon: ' '
    style: powerline
    template: ' {{ if not .Error }}{{ .Icon }}{{ .Percentage }}{{ end }}{{ .Error }} '
console_title_template: '{{ .Shell }} in {{ .Folder }}'
cursor_padding: true
git:
    background: lightYellow
    background_templates:
        - '{{ if or (.Working.Changed) (.Staging.Changed) }}lightRed{{ end }}'
        - '{{ if and (gt .Ahead 0) (gt .Behind 0) }}lightRed{{ end }}'
        - '{{ if gt .Ahead 0 }}white{{ end }}'
        - '{{ if gt .Behind 0 }}white{{ end }}'
    foreground: darkGray
    options:
        fetch_status: true
        fetch_upstream_icon: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    style: powerline
    template: ' {{ .UpstreamIcon }}{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }} {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }} {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }} {{ .StashCount }}{{ end }} '
kubectl:
    background: lightYellow
    foreground: black
    leading_style: rounded
    template: ' Kubernetes {{.Context}} cluster {{if .Namespace}}- {{.Namespace}} namespace{{end}} '
    trailing_style: powerline
path:
    background: lightRed
    foreground: lightWhite
    options:
        style: folder
        windows_registry_icon: reg
    trailing_style: powerline
    template: ' {{ .Path }} '
prompt:
    - segments:
        - session
        - path
        - git
        - status
    - segments:
        - kubectl
        - az
    - segments:
        - text
rprompt:
    - segments:
        - shell
        - battery
        - time
session:
    background: white
    foreground: lightWhite
    leading_style: rounded
    template: ' {{ if .SSHSession }} {{ end }}{{ .UserName }}@{{ .HostName }} '
    trailing_style: powerline
shell:
    background: cyan
    foreground: lightWhite
    template: <cyan,transparent>(</> {{ .Name }} <transparent,cyan><</>
status:
    background: cyan
    background_templates:
        - '{{ if gt .Code 0 }}lightRed{{ end }}'
    foreground: lightWhite
    leading_separator: <transparent,background>></>
    options:
        always_enabled: true
    template: ' {{ if gt .Code 0 }} {{ reason .Code }}{{ else }}{{ end }} '
    trailing_style: rounded
text:
    foreground: lightRed
    template: ' ~ '
time:
    background: cyan
    foreground: black
    leading_style: powerline
    template: ' {{ .LastDate | date .Format }} '
    trailing_style: rounded
