# Code generated by src/tools/genconsolethemes; DO NOT EDIT.
#
# Console variant of "emodipt-extend", for the Linux virtual console.
#
# Nerd Font icons are removed and Powerline separators replaced with ASCII,
# because a console font carries neither. Colors are approximated to the 16
# ANSI colors a console can show, so themes that differ only in shade look
# alike here.
#
# To take this file over, delete the generated marker on the first line: the
# generator then leaves it alone. Otherwise edit emodipt-extend.prompto.yaml and regenerate.

executiontime:
    foreground: lightYellow
    foreground_templates:
        - '{{ if gt .Code 0 }}lightRed{{ end }}'
    options:
        always_enabled: true
        style: roundrock
    template: ' {{ .FormattedMs }} '
cursor_padding: true
git:
    foreground: lightYellow
    foreground_templates:
        - '{{ if or (.Working.Changed) (.Staging.Changed) }}lightRed{{ end }}'
        - '{{ if and (gt .Ahead 0) (gt .Behind 0) }}lightRed{{ end }}'
        - '{{ if gt .Ahead 0 }}white{{ end }}'
        - '{{ if gt .Behind 0 }}white{{ end }}'
    options:
        branch_template: '{{ trunc 25 .Branch }}'
        fetch_status: true
        fetch_upstream_icon: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    template: ' {{ .UpstreamIcon }}{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }} {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }} {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }} {{ .StashCount }}{{ end }} '
path:
    foreground: white
    options:
        style: full
        windows_registry_icon: reg
    template: ' {{ .Path }}'
prompt:
    - segments:
        - time
        - shell
        - git
    - segments:
        - path
    - segments:
        - root
        - text
root:
    foreground: lightRed
    template: '!'
rprompt:
    - segments:
        - status
        - executiontime
shell:
    foreground: lightRed
    options:
        mapped_shell_names:
            bash: Bash
            cmd: Cmd
            powershell: Shell
            pwsh: Shell
    template: ' {{ .Name }}'
status:
    foreground: lightYellow
    foreground_templates:
        - '{{ if gt .Code 0 }}lightRed{{ end }}'
    template: ' x{{ reason .Code }}'
text:
    foreground: lightRed
    template: '>'
time:
    foreground: white
    options:
        time_format: "15:04"
    template: '[{{ .LastDate | date .Format }}]'
