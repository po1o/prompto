# Console variant of the `jblab_2021` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of jblab_2021.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

console_title_template: '{{if .Root}} ! {{end}}{{.Folder | replace "~" "~"}} @ {{.HostName}}'
executiontime:
    background: cyan
    foreground: black
    leading_separator: <transparent,cyan>></>
    options:
        style: dallas
        threshold: 0
    template: ' {{ .FormattedMs }}s '
    trailing_style: powerline
cursor_padding: true
git:
    background: black
    background_templates:
        - '{{ if or (.Working.Changed) (.Staging.Changed) }}lightBlue{{ end }}'
        - '{{ if and (gt .Ahead 0) (gt .Behind 0) }}lightBlue{{ end }}'
        - '{{ if gt .Ahead 0 }}lightBlue{{ end }}'
        - '{{ if gt .Behind 0 }}lightBlue{{ end }}'
    foreground: lightWhite
    options:
        fetch_status: true
        fetch_upstream_icon: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    style: powerline
    template: ' {{ .UpstreamIcon }}{{ .HEAD }}{{ if .Staging.Changed }} {{ .Staging.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Working.Changed }} {{ .Working.String }}{{ end }}{{ if gt .StashCount 0 }} {{ .StashCount }}{{ end }} '
os:
    background: black
    foreground: lightWhite
    leading_style: rounded
    template: ' {{ .Icon }} '
    trailing_style: powerline
    options:
        display_distro_name: true
        android: android
        linux: linux
        macos: mac
path:
    background: cyan
    foreground: black
    leading_separator: <transparent,cyan>></>
    options:
        folder_icon: '...'
        folder_separator_icon: <transparent> > </>
        home_icon: ""
        style: agnoster_short
        windows_registry_icon: reg
    template: ' {{ .Path }} '
    trailing_style: powerline
prompt:
    - segments:
        - os
        - root
        - path
        - git
        - time
        - executiontime
        - status
root:
    background: red
    foreground: lightWhite
    leading_separator: <transparent,red>></>
    template: ' # '
    trailing_style: powerline
status:
    background: red
    foreground: lightWhite
    leading_separator: <transparent,background>></>
    template: '<transparent> </> {{ reason .Code }} '
    trailing_style: powerline
time:
    background: black
    foreground: lightWhite
    leading_separator: <transparent,black>></>
    options:
        time_format: "15:04"
    template: ' {{ .LastDate | date .Format }} '
    trailing_style: powerline
