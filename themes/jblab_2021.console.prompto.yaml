# Code generated by src/tools/genconsolethemes; DO NOT EDIT.
#
# Console variant of "jblab_2021", for the Linux virtual console.
#
# Nerd Font icons are removed and Powerline separators replaced with ASCII,
# because a console font carries neither. Colors are approximated to the 16
# ANSI colors a console can show, so themes that differ only in shade look
# alike here.
#
# To take this file over, delete the generated marker on the first line: the
# generator then leaves it alone. Otherwise edit jblab_2021.prompto.yaml and regenerate.

console_title_template: '{{if .Root}} ! {{end}}{{.Folder | replace "~" "~"}} @ {{.HostName}}'
executiontime:
    background: cyan
    foreground: black
    leading_separator: <transparent,cyan>></>
    options:
        style: dallas
        threshold: 0
    template: ' {{ .FormattedMs }}s '
    trailing_separator: '>'
cursor_padding: true
git:
    background: black
    background_templates:
        - '{{ if or (.Working.Changed) (.Staging.Changed) }}lightBlue{{ end }}'
        - '{{ if and (gt .Ahead 0) (gt .Behind 0) }}lightBlue{{ end }}'
        - '{{ if gt .Ahead 0 }}lightBlue{{ end }}'
        - '{{ if gt .Behind 0 }}lightBlue{{ end }}'
    foreground: lightWhite
    options:
        fetch_status: true
        fetch_upstream_icon: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    trailing_separator: '>'
    template: ' {{ .UpstreamIcon }}{{ .HEAD }}{{ if .Staging.Changed }} {{ .Staging.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Working.Changed }} {{ .Working.String }}{{ end }}{{ if gt .StashCount 0 }} {{ .StashCount }}{{ end }} '
os:
    background: black
    foreground: lightWhite
    leading_separator: (
    template: ' {{ .Icon }} '
    trailing_separator: '>'
    options:
        display_distro_name: true
        android: android
        linux: linux
        macos: mac
path:
    background: cyan
    foreground: black
    leading_separator: <transparent,cyan>></>
    options:
        folder_icon: '...'
        folder_separator_icon: <transparent> > </>
        home_icon: ""
        style: agnoster_short
        windows_registry_icon: reg
    template: ' {{ .Path }} '
    trailing_separator: '>'
prompt:
    - segments:
        - os
        - root
        - path
        - git
        - time
        - executiontime
        - status
root:
    background: red
    foreground: lightWhite
    leading_separator: <transparent,red>></>
    template: ' # '
    trailing_separator: '>'
status:
    background: red
    foreground: lightWhite
    leading_separator: <transparent,background>></>
    template: '<transparent> </> {{ reason .Code }} '
    trailing_separator: '>'
time:
    background: black
    foreground: lightWhite
    leading_separator: <transparent,black>></>
    options:
        time_format: "15:04"
    template: ' {{ .LastDate | date .Format }} '
    trailing_separator: '>'
