angular:
    background: '#ffffff'
    foreground: '#ce092f'
    leading_separator: ' '
    template:  {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}
    trailing_separator: ' '
aurelia:
    background: '#ffffff'
    foreground: '#de1f84'
    leading_separator: ' '
    template: α {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}
    trailing_separator: ' '
aws:
    background: '#565656'
    foreground: '#faa029'
    leading_separator: 
    template:  {{.Profile}}{{if .Region}}@{{.Region}}{{end}}
    trailing_separator: ' '
azfunc:
    background: '#ffffff'
    foreground: '#5398c2'
    leading_separator: 
    template: <#f5bf45></> {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}
    trailing_separator: ' '
battery:
    background: '#f36943'
    background_templates:
        - '{{if eq "Charging" .State.String}}#b8e994{{end}}'
        - '{{if eq "Discharging" .State.String}}#fff34e{{end}}'
        - '{{if eq "Full" .State.String}}#33DD2D{{end}}'
    foreground: '#262626'
    options:
        charged_icon: ' '
        charging_icon: ' '
        discharging_icon: ' '
    trailing_separator: ""
    template: ' {{ if not .Error }}{{ .Icon }}{{ .Percentage }}{{ end }}{{ .Error }} '
dart:
    background: '#e1e8e9'
    foreground: '#055b9c'
    leading_separator: ' '
    template:  {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}
    trailing_separator: ' '
dotnet:
    background: '#0e0e0e'
    foreground: '#0d6da8'
    leading_separator: 
    template:  {{ if .Unsupported }}{{ else }}{{ .Full }}{{ end }}
    trailing_separator: ' '
executiontime:
    background: '#83769c'
    foreground: '#ffffff'
    options:
        style: roundrock
        threshold: 0
    template: '  {{ .FormattedMs }} '
    trailing_separator: 
git:
    background: '#FFFB38'
    background_templates:
        - '{{ if or (.Working.Changed) (.Staging.Changed) }}#ffeb95{{ end }}'
        - '{{ if and (gt .Ahead 0) (gt .Behind 0) }}#c5e478{{ end }}'
        - '{{ if gt .Ahead 0 }}#C792EA{{ end }}'
        - '{{ if gt .Behind 0 }}#C792EA{{ end }}'
    foreground: '#011627'
    options:
        branch_icon: ' '
        fetch_status: true
        fetch_upstream_icon: true
    trailing_separator: ""
    template: ' {{ .UpstreamIcon }}{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }}<#ef5350>  {{ .Staging.String }}</>{{ end }} '
go:
    background: '#ffffff'
    foreground: '#06aad5'
    leading_separator: 
    template:  {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}
    trailing_separator: ' '
java:
    background: '#0e8ac8'
    foreground: '#ffffff'
    leading_separator: 
    template:  {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}
    trailing_separator: ' '
julia:
    background: '#945bb3'
    foreground: '#359a25'
    leading_separator: ' '
    template: <#ca3c34></> {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}
    trailing_separator: ' '
kubectl:
    background: '#316ce4'
    foreground: '#ffffff'
    leading_separator: 
    template: ' {{.Context}}{{if .Namespace}} :: {{.Namespace}}{{end}}'
    trailing_separator: 
node:
    background: '#303030'
    foreground: '#3C873A'
    leading_separator: 
    options:
        fetch_package_manager: true
        npm_icon: ' <#cc3a3a></> '
        yarn_icon: ' <#348cba></>'
    template:  {{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }}{{ .Full }}
    trailing_separator: ' '
nx:
    background: '#1e293b'
    foreground: '#ffffff'
    leading_separator: ' '
    template: '{{ if .Error }}{{ .Error }}{{ else }}Nx {{ .Full }}{{ end }}'
    trailing_separator: ' '
os:
    background: '#b2bec3'
    foreground: '#222222'
    leading_separator: 
    options:
        linux: 
        macos: 
        windows: 
    template: ' {{ if .WSL }}WSL at {{ end }}{{.Icon}} '
    trailing_separator: <transparent,background></>
path:
    background: '#FF9248'
    foreground: '#2d3436'
    options:
        folder_icon: '  '
        home_icon: 
        style: folder
    trailing_separator: ""
    template: '  {{ .Path }} '
prompt:
    - segments:
        - shell
        - root
        - path
        - git
        - executiontime
    - segments:
        - text
        - status
python:
    background: '#306998'
    foreground: '#FFE873'
    leading_separator: 
    template:  {{ if .Error }}{{ .Error }}{{ else }}{{ if .Venv }}{{ .Venv }} {{ end }}{{ .Full }}{{ end }}
    trailing_separator: ' '
root:
    background: '#ef5350'
    foreground: '#FFFB38'
    template: '<parentBackground></>  '
rprompt:
    - segments:
        - node
        - python
        - java
        - dotnet
        - go
        - rust
        - dart
        - angular
        - aurelia
        - nx
        - julia
        - ruby
        - azfunc
        - aws
        - kubectl
        - os
        - battery
        - time
ruby:
    background: '#ffffff'
    foreground: '#9c1006'
    leading_separator: 
    template:  {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}
    trailing_separator: ' '
rust:
    background: '#f3f0ec'
    foreground: '#925837'
    leading_separator: 
    template:  {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}
    trailing_separator: ' '
shell:
    background: '#0077c2'
    foreground: '#ffffff'
    leading_separator: ╭─
    template: ' {{ .Name }} '
status:
    foreground: '#e0f8ff'
    foreground_templates:
        - '{{ if gt .Code 0 }}#ef5350{{ end }}'
    options:
        always_enabled: true
    template: ' '
text:
    foreground: '#21c7c7'
    template: ╰─
time:
    background: '#40c4ff'
    foreground: '#ffffff'
    leading_separator: 
    options:
        time_format: _2,15:04
    template: '  {{ .LastDate | date .Format }} '
    trailing_separator: 
