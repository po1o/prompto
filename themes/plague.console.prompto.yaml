# Code generated by src/tools/genconsolethemes; DO NOT EDIT.
#
# Console variant of "plague", for the Linux virtual console.
#
# Nerd Font icons are removed and Powerline separators replaced with ASCII,
# because a console font carries neither. Colors are approximated to the 16
# ANSI colors a console can show, so themes that differ only in shade look
# alike here.
#
# To take this file over, delete the generated marker on the first line: the
# generator then leaves it alone. Otherwise edit plague.prompto.yaml and regenerate.

cursor_padding: true
git:
    background: lightYellow
    foreground: darkGray
    options:
        fetch_upstream_icon: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    trailing_separator: '>'
    template: ' {{ .UpstreamIcon }}{{ .HEAD }}{{ if gt .StashCount 0 }} {{ .StashCount }}{{ end }} '
node:
    background: white
    foreground: lightWhite
    trailing_separator: '>'
    template: ' {{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }}{{ .Full }} '
path:
    background: red
    foreground: black
    options:
        style: folder
        windows_registry_icon: reg
    trailing_separator: '>'
    template: ' {{ .Path }} '
prompt:
    - segments:
        - session
        - spotify
        - path
        - git
        - node
        - shell
        - root
        - status
root:
    background: lightYellow
    foreground: lightWhite
    trailing_separator: '>'
    template: ' # '
session:
    background: darkGray
    foreground: red
    leading_separator: (
    template: ' {{ .UserName }}@{{ .HostName }} '
    trailing_separator: '>'
shell:
    background: darkGray
    foreground: lightWhite
    trailing_separator: '>'
    template: ' {{ .Name }} '
spotify:
    background: lightGreen
    foreground: darkGray
    trailing_separator: '>'
    template: ' {{ .Icon }}{{ if ne .Status "stopped" }}{{ .Artist }} - {{ .Track }}{{ end }} '
    options:
        paused_icon: '|| '
        playing_icon: '> '
        stopped_icon: '[] '
status:
    background: cyan
    background_templates:
        - '{{ if gt .Code 0 }}lightRed{{ end }}'
    foreground: lightWhite
    options:
        always_enabled: true
    template: <transparent>></> <background,transparent>)</>
