# Console variant of the `plague` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of plague.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

cursor_padding: true
git:
    background: lightYellow
    foreground: darkGray
    options:
        fetch_upstream_icon: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    style: powerline
    template: ' {{ .UpstreamIcon }}{{ .HEAD }}{{ if gt .StashCount 0 }} {{ .StashCount }}{{ end }} '
node:
    background: white
    foreground: lightWhite
    style: powerline
    template: ' {{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }}{{ .Full }} '
path:
    background: red
    foreground: black
    options:
        style: folder
        windows_registry_icon: reg
    trailing_style: powerline
    template: ' {{ .Path }} '
prompt:
    - segments:
        - session
        - spotify
        - path
        - git
        - node
        - shell
        - root
        - status
root:
    background: lightYellow
    foreground: lightWhite
    style: powerline
    template: ' # '
session:
    background: darkGray
    foreground: red
    leading_style: rounded
    template: ' {{ .UserName }}@{{ .HostName }} '
    trailing_style: powerline
shell:
    background: darkGray
    foreground: lightWhite
    style: powerline
    template: ' {{ .Name }} '
spotify:
    background: lightGreen
    foreground: darkGray
    style: powerline
    template: ' {{ .Icon }}{{ if ne .Status "stopped" }}{{ .Artist }} - {{ .Track }}{{ end }} '
    options:
        paused_icon: '|| '
        playing_icon: '> '
        stopped_icon: '[] '
status:
    background: cyan
    background_templates:
        - '{{ if gt .Code 0 }}lightRed{{ end }}'
    foreground: lightWhite
    options:
        always_enabled: true
    template: <transparent>></> <background,transparent>)</>
