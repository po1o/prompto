# Code generated by src/tools/genconsolethemes; DO NOT EDIT.
#
# Console variant of "tokyonight_storm", for the Linux virtual console.
#
# Nerd Font icons are removed and Powerline separators replaced with ASCII,
# because a console font carries neither. Colors are approximated to the 16
# ANSI colors a console can show, so themes that differ only in shade look
# alike here.
#
# To take this file over, delete the generated marker on the first line: the
# generator then leaves it alone. Otherwise edit tokyonight_storm.prompto.yaml and regenerate.

console_title_template: ' {{ .Folder }} :: {{if .Root}}Admin{{end}}'
cursor_padding: true
git:
    foreground: p:light-sky-blue
    foreground_templates:
        - '{{ if or (.Working.Changed) (.Staging.Changed) }}p:terminal-red{{ end }}'
        - '{{ if and (gt .Ahead 0) (gt .Behind 0)}}p:light-sky-blue {{ end }}'
        - '{{ if gt .Ahead 0 }}p:terminal-blue{{ end }}'
        - '{{ if gt .Behind 0 }}p:celeste-blue{{ end }}'
    options:
        branch_icon: ' '
        fetch_status: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    template: ({{ .HEAD}})
go:
    foreground: p:light-sky-blue
    template: ' {{ .Full}}'
julia:
    foreground: p:terminal-magenta
    template: ' {{ .Full }}'
node:
    foreground: p:pistachio-green
    template: ' {{ .Full }} '
palette:
    blue-bell: white
    blue-black: darkGray
    celeste-blue: lightWhite
    light-sky-blue: lightCyan
    main-bg: darkGray
    pastal-grey: white
    pistachio-green: white
    t-background: p:main-bg
    terminal-black: darkGray
    terminal-blue: white
    terminal-green: lightCyan
    terminal-magenta: white
    terminal-red: lightRed
    terminal-white: white
    terminal-yellow: white
    white-blue: white
path:
    foreground: p:terminal-magenta
    options:
        style: folder
        windows_registry_icon: reg
    template: <b>{{ .Path }}</b> <p:light-sky-blue>!</>
php:
    foreground: p:terminal-blue
    template: ' {{ .Full }} '
prompt:
    - segments:
        - text
        - path
        - git
        - status
    - segments:
        - text.2
python:
    foreground: p:terminal-yellow
    template: ' {{ .Full }}'
rprompt:
    - segments:
        - node
        - php
        - python
        - julia
        - ruby
        - go
ruby:
    foreground: p:terminal-red
    template: ' {{ .Full}}'
secondary:
    - segments:
        - text.secondary
text.secondary:
    background: transparent
    foreground: p:terminal-blue
    template: '> '
status:
    foreground: p:terminal-red
    template: ' x'
terminal_background: p:t-background
text:
    background: transparent
    foreground: p:terminal-blue
    template: '> '
text.2:
    foreground: p:pistachio-green
    template: '>'
transient:
    - segments:
        - text.transient
text.transient:
    background: p:t-background
    foreground: p:terminal-blue
    template: '> '
