# Console variant of the `tokyonight_storm` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of tokyonight_storm.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

console_title_template: ' {{ .Folder }} :: {{if .Root}}Admin{{end}}'
cursor_padding: true
git:
    foreground: p:light-sky-blue
    foreground_templates:
        - '{{ if or (.Working.Changed) (.Staging.Changed) }}p:terminal-red{{ end }}'
        - '{{ if and (gt .Ahead 0) (gt .Behind 0)}}p:light-sky-blue {{ end }}'
        - '{{ if gt .Ahead 0 }}p:terminal-blue{{ end }}'
        - '{{ if gt .Behind 0 }}p:celeste-blue{{ end }}'
    options:
        branch_icon: ' '
        fetch_status: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    template: ({{ .HEAD}})
go:
    foreground: p:light-sky-blue
    template: ' {{ .Full}}'
julia:
    foreground: p:terminal-magenta
    template: ' {{ .Full }}'
node:
    foreground: p:pistachio-green
    template: ' {{ .Full }} '
palette:
    blue-bell: white
    blue-black: darkGray
    celeste-blue: lightWhite
    light-sky-blue: lightCyan
    main-bg: darkGray
    pastal-grey: white
    pistachio-green: white
    t-background: p:main-bg
    terminal-black: darkGray
    terminal-blue: white
    terminal-green: lightCyan
    terminal-magenta: white
    terminal-red: lightRed
    terminal-white: white
    terminal-yellow: white
    white-blue: white
path:
    foreground: p:terminal-magenta
    options:
        style: folder
        windows_registry_icon: reg
    template: <b>{{ .Path }}</b> <p:light-sky-blue>!</>
php:
    foreground: p:terminal-blue
    template: ' {{ .Full }} '
prompt:
    - segments:
        - text
        - path
        - git
        - status
    - segments:
        - text.2
python:
    foreground: p:terminal-yellow
    template: ' {{ .Full }}'
rprompt:
    - segments:
        - node
        - php
        - python
        - julia
        - ruby
        - go
ruby:
    foreground: p:terminal-red
    template: ' {{ .Full}}'
secondary:
    - segments:
        - text.secondary
text.secondary:
    background: transparent
    foreground: p:terminal-blue
    template: '> '
status:
    foreground: p:terminal-red
    template: ' x'
terminal_background: p:t-background
text:
    background: transparent
    foreground: p:terminal-blue
    template: '> '
text.2:
    foreground: p:pistachio-green
    template: '>'
transient:
    - segments:
        - text.transient
text.transient:
    background: p:t-background
    foreground: p:terminal-blue
    template: '> '
