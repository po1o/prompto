# Code generated by src/tools/genconsolethemes; DO NOT EDIT.
#
# Console variant of "thecyberden", for the Linux virtual console.
#
# Nerd Font icons are removed and Powerline separators replaced with ASCII,
# because a console font carries neither. Colors are approximated to the 16
# ANSI colors a console can show, so themes that differ only in shade look
# alike here.
#
# To take this file over, delete the generated marker on the first line: the
# generator then leaves it alone. Otherwise edit thecyberden.prompto.yaml and regenerate.

console_title_template: '{{ .Folder }}'
git:
    background: yellow
    background_templates:
        - '{{ if or (.Working.Changed) (.Staging.Changed) }}lightYellow{{ end }}'
        - '{{ if and (gt .Ahead 0) (gt .Behind 0) }}lightRed{{ end }}'
        - '{{ if gt .Ahead 0 }}lightRed{{ end }}'
        - '{{ if gt .Behind 0 }}lightGreen{{ end }}'
    foreground: black
    options:
        fetch_status: true
        fetch_upstream_icon: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    trailing_separator: '>'
    template: ' {{ .UpstreamIcon }}{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }} {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }} {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }} {{ .StashCount }}{{ end }} '
path:
    background: lightBlue
    foreground: lightWhite
    options:
        style: full
        windows_registry_icon: reg
    trailing_separator: '>'
    template: ' {{ .Path }} '
prompt:
    - segments:
        - session
        - path
        - git
        - status
    - segments:
        - root
        - shell
        - text
root:
    foreground: red
    template: '# '
rprompt:
    - segments:
        - time
session:
    background: cyan
    foreground: lightWhite
    leading_separator: (
    template: '{{ if .SSHSession }}{{ else }}{{ end }} {{ .UserName }}@{{ .HostName }}'
shell:
    foreground: lightWhite
    template: ' {{ .Name }} '
status:
    background: cyan
    background_templates:
        - '{{ if gt .Code 0 }}lightRed{{ end }}'
    foreground: lightWhite
    options:
        always_enabled: true
    template: ' '
    trailing_separator: )
text:
    foreground: lightWhite
    template: ' '
time:
    background: cyan
    foreground: lightWhite
    leading_separator: (
    options:
        time_format: "15:04:05"
    template: ' {{ .LastDate | date .Format }} '
    trailing_separator: )
