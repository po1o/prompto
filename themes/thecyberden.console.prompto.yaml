# Console variant of the `thecyberden` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of thecyberden.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

console_title_template: '{{ .Folder }}'
git:
    background: yellow
    background_templates:
        - '{{ if or (.Working.Changed) (.Staging.Changed) }}lightYellow{{ end }}'
        - '{{ if and (gt .Ahead 0) (gt .Behind 0) }}lightRed{{ end }}'
        - '{{ if gt .Ahead 0 }}lightRed{{ end }}'
        - '{{ if gt .Behind 0 }}lightGreen{{ end }}'
    foreground: black
    options:
        fetch_status: true
        fetch_upstream_icon: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    style: powerline
    template: ' {{ .UpstreamIcon }}{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }} {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }} {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }} {{ .StashCount }}{{ end }} '
path:
    background: lightBlue
    foreground: lightWhite
    options:
        style: full
        windows_registry_icon: reg
    trailing_style: powerline
    template: ' {{ .Path }} '
prompt:
    - segments:
        - session
        - path
        - git
        - status
    - segments:
        - root
        - shell
        - text
root:
    foreground: red
    template: '# '
rprompt:
    - segments:
        - time
session:
    background: cyan
    foreground: lightWhite
    leading_style: rounded
    template: '{{ if .SSHSession }}{{ else }}{{ end }} {{ .UserName }}@{{ .HostName }}'
shell:
    foreground: lightWhite
    template: ' {{ .Name }} '
status:
    background: cyan
    background_templates:
        - '{{ if gt .Code 0 }}lightRed{{ end }}'
    foreground: lightWhite
    options:
        always_enabled: true
    template: ' '
    style: rounded
text:
    foreground: lightWhite
    template: ' '
time:
    background: cyan
    foreground: lightWhite
    leading_style: rounded
    options:
        time_format: "15:04:05"
    template: ' {{ .LastDate | date .Format }} '
    trailing_style: rounded
