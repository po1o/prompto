# Console variant of the `xtoys` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of xtoys.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

git:
    foreground: lightCyan
    options:
        branch_icon: ""
        fetch_upstream_icon: false
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    template: 'HEAD:{{ .UpstreamIcon }}{{ .HEAD }} '
path:
    foreground: lightBlue
    options:
        style: agnoster_short
        windows_registry_icon: reg
    template: '{{ .Path }} '
prompt:
    - segments:
        - root
        - session
        - path
        - git
        - status
root:
    foreground: lightYellow
    template: '# '
session:
    template: '{{ .UserName }}@{{ .HostName }} '
status:
    foreground: lightCyan
    foreground_templates:
        - '{{ if gt .Code 0 }}lightRed{{ end }}'
    options:
        always_enabled: true
    template: '<white>></><lightCyan>></><foreground>></> '
