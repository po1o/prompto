executiontime:
    background: '#e4e4e4'
    foreground: '#585858'
    options:
        always_enabled: true
        style: austin
    trailing_separator: ""
    template: '  {{ .FormattedMs }} '
cursor_padding: true
git:
    background: '#378504'
    background_templates:
        - '{{ if or (.Working.Changed) (.Staging.Changed) }}#a97400{{ end }}'
        - '{{ if and (gt .Ahead 0) (gt .Behind 0) }}#54433a{{ end }}'
        - '{{ if gt .Ahead 0 }}#744d89{{ end }}'
        - '{{ if gt .Behind 0 }}#744d89{{ end }}'
    foreground: '#f2f3f8'
    leading_separator: <transparent,background></>
    options:
        branch_gone_icon: 
        branch_icon: ' '
        branch_identical_icon: 
        branch_template: '{{ trunc 25 .Branch }}'
        fetch_status: true
    template: ' {{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }} <transparent></> <#121318> {{ .Working.String }}</>{{ end }}{{ if .Staging.Changed }} <transparent></> <#121318> {{ .Staging.String }}</>{{ end }}{{ if gt .StashCount 0 }} <transparent></> <#121318> {{ .StashCount }}</>{{ end }} '
    trailing_separator: 
os:
    background: '#d75f00'
    foreground: '#f2f3f8'
    leading_separator: ╭─
    options:
        alpine: 
        arch: 
        centos: 
        debian: 
        elementary: 
        fedora: 
        gentoo: 
        linux: 
        macos: 
        manjaro: 
        mint: 
        opensuse: 
        raspbian: 
        ubuntu: 
        windows: 
    template: ' {{ .Icon }} '
path:
    background: '#0087af'
    foreground: '#f2f3f8'
    options:
        folder_icon: …
        folder_separator_icon: ' <transparent></> '
        max_depth: 3
        style: agnoster_short
    trailing_separator: ""
    template: ' {{ .Path }} '
prompt:
    - segments:
        - os
        - session
        - path
        - git
    - segments:
        - text
rprompt:
    - segments:
        - executiontime
        - time
session:
    background: '#e4e4e4'
    foreground: '#4e4e4e'
    trailing_separator: ""
    template: ' {{ .UserName }} '
text:
    foreground: '#d75f00'
    template: ╰─ {{ if .Root }}#{{else}}${{end}}
time:
    background: '#d75f00'
    foreground: '#f2f3f8'
    options:
        time_format: "15:04:05"
    template: '  {{ .LastDate | date .Format }} '
    trailing_separator: 
