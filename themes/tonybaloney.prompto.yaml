cursor_padding: true
git:
    background: '#18354c'
    foreground: '#ffc107'
    options:
        fetch_upstream_icon: true
    trailing_separator: ""
    template: ' {{ .UpstreamIcon }}{{ .HEAD }}{{ if gt .StashCount 0 }}  {{ .StashCount }}{{ end }} '
path:
    background: '#18354c'
    foreground: '#ffc107'
    leading_separator: 
    options:
        style: folder
    template: '  {{ .Path }} '
    trailing_separator: 
prompt:
    - segments:
        - path
        - git
        - python
        - root
python:
    background: '#ffc107'
    foreground: '#18354c'
    trailing_separator: ""
    template: '  {{ if .Error }}{{ .Error }}{{ else }}{{ if .Venv }}{{ .Venv }} {{ end }}{{ .Full }}{{ end }} '
root:
    background: '#ffc107'
    foreground: '#18354c'
    trailing_separator: ""
    template: '  '
