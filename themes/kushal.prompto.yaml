cmake:
    background: '#1E9748'
    foreground: '#E8EAEE'
    trailing_separator: ""
    template: '   cmake {{ .Full }} '
console_title_template: '{{ if .Root }}root @ {{ end }}{{ .Shell }} in {{ .Folder }}'
executiontime:
    background: '#575656'
    foreground: '#D6DEEB'
    options:
        style: roundrock
        threshold: 0
    template: '  {{ .FormattedMs }} '
    trailing_separator: 
git:
    background: '#1BD4CD'
    background_templates:
        - '{{ if or (.Working.Changed) (.Staging.Changed) }}#16B1AC{{ end }}'
        - '{{ if and (gt .Ahead 0) (gt .Behind 0) }}#16B1AC{{ end }}'
        - '{{ if gt .Ahead 0 }}#B787D7{{ end }}'
        - '{{ if gt .Behind 0 }}#B787D7{{ end }}'
    foreground: '#011627'
    options:
        branch_icon: ' '
        fetch_status: true
        fetch_upstream_icon: true
    trailing_separator: ""
    template: ' {{ .UpstreamIcon }}{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }}<#CAEBE1>  {{ .Staging.String }}</>{{ end }}{{ if gt .StashCount 0 }}  {{ .StashCount }}{{ end }} '
go:
    background: '#7FD5EA'
    foreground: '#ffffff'
    trailing_separator: ""
    template: ' ‭ {{ .Full }} '
os:
    background: '#575656'
    foreground: '#D6DEEB'
    leading_separator: 
    options:
        alpine: 
        arch: 
        centos: 
        debian: 
        elementary: 
        fedora: 
        gentoo: 
        linux: 
        macos: 
        manjaro: 
        mint: 
        opensuse: 
        raspbian: 
        ubuntu: 
        windows: 
    template: ' {{ if .WSL }} on {{ end }}{{ .Icon }} '
pwd: osc99
path:
    foreground: '#B6D6F2'
    leading_separator: <#00C7FC>  </><#B6D6F2> in </>
    options:
        folder_icon: '  '
        folder_separator_icon: '  '
        home_icon: ' '
        max_depth: 3
        style: agnoster_short
    template: ' {{ .Path }} '
prompt:
    - segments:
        - os
        - shell
        - root
        - cmake
        - python
        - go
        - rust
        - git
    - segments:
        - text
        - time
        - path
    - segments:
        - text.2
        - status.2
python:
    background: '#FFDE57'
    foreground: '#011627'
    options:
        display_mode: context
    trailing_separator: ""
    template: '  {{ if .Venv }}{{ .Venv }} {{ end }}{{ .Full }} '
root:
    background: '#EF541C'
    foreground: '#D6DEEB'
    trailing_separator: ""
    template: '  admin '
rprompt:
    - segments:
        - status
        - executiontime
rust:
    background: '#99908A'
    foreground: '#193549'
    trailing_separator: ""
    template: '  {{ .Full }} '
secondary:
    - segments:
        - text.secondary
text.secondary:
    background: transparent
    foreground: '#D6DEEB'
    template: '╰─❯ '
shell:
    background: '#00C7FC'
    foreground: '#011627'
    trailing_separator: ""
    template: '  {{ .Name }} '
status:
    background: '#03DED3'
    background_templates:
        - '{{ if gt .Code 0 }}#E44141{{ end }}'
    foreground: '#414141'
    foreground_templates:
        - '{{ if gt .Code 0 }}#D6DEEB{{ end }}'
    leading_separator: 
    options:
        always_enabled: true
    template: ' {{ if gt .Code 0 }}{{ else }}{{ end }} '
status.2:
    foreground: '#D6DEEB'
    options:
        always_enabled: true
    template: '❯ '
text:
    foreground: '#D6DEEB'
    template: ╭─
text.2:
    foreground: '#D6DEEB'
    template: ╰─
time:
    foreground: '#F2D3B6'
    options:
        time_format: "15:04:05"
    template: '<#D6DEEB></> {{ .LastDate | date .Format }} <#79DFE1>|</>  {{ .LastDate | date "2 Jan, Monday" }} <#79DFE1>|</>'
transient:
    - segments:
        - text.transient
text.transient:
    background: transparent
    foreground: '#FEF5ED'
    template: ' '
