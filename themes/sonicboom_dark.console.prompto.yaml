# Console variant of the `sonicboom_dark` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of sonicboom_dark.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

executiontime:
    background: black
    foreground: lightWhite
    options:
        style: dallas
        threshold: 0
    template: '<black>> </>{{ .FormattedMs }}s '
    trailing_separator: '>'
cursor_padding: true
git:
    background: black
    foreground: green
    options:
        fetch_status: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    template: '<black>> </>{{ .HEAD }}{{ if .Staging.Changed }}<lightRed> {{ .Staging.String }}</>{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Working.Changed }} {{ .Working.String }}{{ end }}{{ if gt .StashCount 0 }} {{ .StashCount }}{{ end }} '
os:
    background: black
    foreground: lightWhite
    options:
        alpine: alpine
        arch: arch
        centos: centos
        debian: debian
        elementary: elementary
        fedora: fedora
        gentoo: gentoo
        linux: linux
        macos: macos
        manjaro: manjaro
        mint: mint
        opensuse: opensuse
        raspbian: raspbian
        ubuntu: ubuntu
        windows: windows
        display_distro_name: true
        android: android
    template: ' {{ if .WSL }}WSL at {{ end }}{{.Icon}} '
path:
    background: black
    foreground: lightCyan
    options:
        folder_icon: ""
        folder_separator_icon: ' <black>\ </>'
        home_icon: ""
        style: agnoster_short
        windows_registry_icon: reg
    template: ' {{ .Path }} '
prompt:
    - segments:
        - root
        - os
        - path
        - git
        - executiontime
    - segments:
        - status
root:
    background: black
    foreground: red
    template: ' !'
rprompt:
    - segments:
        - session
        - time
session:
    background: black
    foreground: lightCyan
    leading_separator: '|'
    template: ' {{ if .SSHSession }} {{ end }}{{ .UserName }}<transparent> / </>{{ .HostName }}'
status:
    foreground: green
    foreground_templates:
        - '{{ if gt .Code 0 }}red{{ end }}'
    options:
        always_enabled: true
    template: 'x '
time:
    background: black
    foreground: lightCyan
    options:
        time_format: 3:04:05 PM
    template: '<black> </>{{ .LastDate | date .Format }} '
    trailing_separator: '|'
