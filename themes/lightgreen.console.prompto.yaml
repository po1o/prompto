# Console variant of the `lightgreen` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of lightgreen.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

aws:
    background: darkGray
    foreground: lightRed
    leading_style: rounded
    template: ' {{.Profile}}{{if .Region}}@{{.Region}}{{end}}'
    trailing_separator: ') '
battery:
    background: lightRed
    background_templates:
        - '{{if eq "Charging" .State.String}}white{{end}}'
        - '{{if eq "Discharging" .State.String}}lightYellow{{end}}'
        - '{{if eq "Full" .State.String}}lightGreen{{end}}'
    foreground: black
    options:
        charged_icon: ' '
        charging_icon: ' '
        discharging_icon: ' '
    template: ' {{ if not .Error }}{{ .Icon }}{{ .Percentage }}{{ end }}{{ .Error }} <black><</>'
executiontime:
    options:
        always_enabled: true
        style: roundrock
    template: '{{ .FormattedMs }} '
git:
    background: black
    foreground: green
    options:
        fetch_status: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    template: '<black>> </>{{ .HEAD }}{{ if .Staging.Changed }}<lightRed> {{ .Staging.String }}</>{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Working.Changed }} {{ .Working.String }}{{ end }}{{ if gt .StashCount 0 }} {{ .StashCount }}{{ end }} '
go:
    background: lightWhite
    foreground: cyan
    leading_style: rounded
    template: ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}'
    trailing_separator: ') '
kubectl:
    background: lightBlue
    foreground: lightWhite
    leading_style: rounded
    template: ' {{.Context}}{{if .Namespace}} :: {{.Namespace}}{{end}}'
    trailing_style: rounded
os:
    background: transparent
    foreground: lightWhite
    options:
        alpine: alpine
        arch: arch
        centos: centos
        debian: debian
        elementary: elementary
        fedora: fedora
        gentoo: gentoo
        linux: linux
        macos: macos
        manjaro: manjaro
        mint: mint
        opensuse: opensuse
        raspbian: raspbian
        ubuntu: ubuntu
        windows: windows
        display_distro_name: true
        android: android
    template: ' {{ if .WSL }}WSL at {{ end }}{{.Icon}} '
path:
    background: black
    foreground: lightGreen
    leading_style: rounded
    options:
        style: folder
        windows_registry_icon: reg
    template: ' {{ .Path }}'
    trailing_style: rounded
prompt:
    - segments:
        - root
        - os
        - path
        - git
        - python
        - go
        - aws
        - terraform
        - kubectl
pwd: osc99
python:
    background: darkGray
    foreground: lightYellow
    leading_style: rounded
    template: ' {{ if .Error }}{{ .Error }}{{ else }}{{ if .Venv }}{{ .Venv }} {{ end }}{{ .Full }}{{ end }}'
    trailing_separator: ') '
root:
    background: black
    foreground: red
    template: ' !'
rprompt:
    - segments:
        - executiontime
        - sysinfo
        - battery
        - time
sysinfo:
    background: lightWhite
    foreground: darkGray
    template: ' {{ round .PhysicalPercentUsed .Precision }}% '
terraform:
    background: lightYellow
    foreground: black
    style: powerline
    template: '{{.WorkspaceName}}'
time:
    background: black
    foreground: lightGreen
    template: '{{ .LastDate | date .Format }}'
