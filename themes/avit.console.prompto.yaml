cursor_padding: true
git:
    foreground: lightYellow
    template: '{{ .HEAD }} '
    options:
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
path:
    foreground: lightWhite
    options:
        style: full
        windows_registry_icon: reg
    template: '{{ .Path }} '
prompt:
    - segments:
        - path
        - git
        - root
        - status
    - segments:
        - text
root:
    foreground: yellow
    template: ' # '
status:
    foreground: yellow
    template: 'x{{ reason .Code }} '
text:
    foreground: cyan
    template: ""
