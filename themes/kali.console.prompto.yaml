# Console variant of the `kali` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of kali.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

executiontime:
    foreground: white
    options:
        always_enabled: true
        style: round
    template: ' {{ .FormattedMs }} '
git:
    foreground: white
    template: <{{ if .Root }}lightBlue{{ else }}green{{ end }}>-[</>{{ .HEAD }}<{{ if .Root }}lightBlue{{ else }}green{{ end }}>]</>
    options:
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
path:
    foreground: lightWhite
    options:
        folder_separator_icon: <white>/</>
        style: full
        windows_registry_icon: reg
    template: <{{ if .Root }}lightBlue{{ else }}green{{ end }}>-[</>{{ .Path }}<{{ if .Root }}lightBlue{{ else }}green{{ end }}>]</>
prompt:
    - segments:
        - session
        - python
        - path
        - git
    - segments:
        - text
python:
    foreground: yellow
    options:
        fetch_version: false
        fetch_virtual_env: true
    template: <{{ if .Root }}lightBlue{{ else }}green{{ end }}>-[</> {{ if .Error }}{{ .Error }}{{ else }}{{ if .Venv }}{{ .Venv }}{{ end }}{{ .Full }}{{ end }}<{{ if .Root }}lightBlue{{ else }}green{{ end }}>]</>
rprompt:
    - segments:
        - executiontime
        - status
session:
    foreground: lightBlue
    foreground_templates:
        - '{{ if .Root }}lightRed{{ end }}'
    template: <{{ if .Root }}lightBlue{{ else }}green{{ end }}>---(</>{{ .UserName }}{{ if .Root }}{{ else }}*{{ end }}{{ .HostName }}<{{ if .Root }}lightBlue{{ else }}green{{ end }}>)</>
status:
    foreground: green
    foreground_templates:
        - '{{ if gt .Code 0 }}red{{ end }}'
    options:
        always_enabled: true
    template: ' {{ if gt .Code 0 }}{{else}}{{ end }} '
text:
    foreground: lightBlue
    template: '<{{ if .Root }}lightBlue{{ else }}green{{ end }}>--</>{{ if .Root }}<lightRed>#</>{{ else }}${{ end }} '
