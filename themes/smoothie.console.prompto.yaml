# Console variant of the `smoothie` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of smoothie.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

executiontime:
    foreground: lightBlue
    options:
        style: austin
        threshold: 0
    template: <{{ .FormattedMs }}> <lightWhite>)</>
git:
    foreground: lightCyan
    options:
        branch_icon: ""
        branch_identical_icon: '='
        fetch_status: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    template: <{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }} ~{{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }} {{ .Staging.String }}{{ end }}>
node:
    foreground: white
    options:
        fetch_version: true
    template: '<lightWhite>o</> !{{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }}{{ .Full }} '
path:
    foreground: white
    options:
        folder_separator_icon: ' | '
        home_icon: ""
        style: letter
        windows_registry_icon: reg
    template: '<lightWhite>(</> <{{ .Path }}> '
prompt:
    - segments:
        - python
        - path
        - git
        - node
    - segments:
        - text
python:
    foreground: lightYellow
    trailing_separator: '>'
    template: '[ {{ if .Error }}{{ .Error }}{{ else }}{{ if .Venv }}{{ .Venv }} {{ end }}{{ .Full }}{{ end }}] '
rprompt:
    - segments:
        - status
        - executiontime
    - segments:
        - time
status:
    foreground: red
    template: ' xxx '
text:
    foreground: lightCyan
    template: '<lightWhite>(</>>>>>>> '
time:
    foreground: lightYellow
    options:
        time_format: "15:04:05"
    template: <{{ .LastDate | date .Format }}> <lightWhite>)</>
