# Code generated by src/tools/genconsolethemes; DO NOT EDIT.
#
# Console variant of "smoothie", for the Linux virtual console.
#
# Nerd Font icons are removed and Powerline separators replaced with ASCII,
# because a console font carries neither. Colors are approximated to the 16
# ANSI colors a console can show, so themes that differ only in shade look
# alike here.
#
# To take this file over, delete the generated marker on the first line: the
# generator then leaves it alone. Otherwise edit smoothie.prompto.yaml and regenerate.

executiontime:
    foreground: lightBlue
    options:
        style: austin
        threshold: 0
    template: <{{ .FormattedMs }}> <lightWhite>)</>
git:
    foreground: lightCyan
    options:
        branch_icon: ""
        branch_identical_icon: '='
        fetch_status: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    template: <{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }} ~{{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }} {{ .Staging.String }}{{ end }}>
node:
    foreground: white
    options:
        fetch_version: true
    template: '<lightWhite>o</> !{{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }}{{ .Full }} '
path:
    foreground: white
    options:
        folder_separator_icon: ' | '
        home_icon: ""
        style: letter
        windows_registry_icon: reg
    template: '<lightWhite>(</> <{{ .Path }}> '
prompt:
    - segments:
        - python
        - path
        - git
        - node
    - segments:
        - text
python:
    foreground: lightYellow
    trailing_separator: '>'
    template: '[ {{ if .Error }}{{ .Error }}{{ else }}{{ if .Venv }}{{ .Venv }} {{ end }}{{ .Full }}{{ end }}] '
rprompt:
    - segments:
        - status
        - executiontime
    - segments:
        - time
status:
    foreground: red
    template: ' xxx '
text:
    foreground: lightCyan
    template: '<lightWhite>(</>>>>>>> '
time:
    foreground: lightYellow
    options:
        time_format: "15:04:05"
    template: <{{ .LastDate | date .Format }}> <lightWhite>)</>
