# Console variant of the `cert` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of cert.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

cursor_padding: true
git:
    background: lightCyan
    foreground: lightWhite
    leading_separator: )
    options:
        branch_icon: ""
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    template: ' git({{ .HEAD }}) '
    trailing_separator: (
path:
    background: green
    foreground: lightWhite
    leading_separator: )
    options:
        style: folder
        windows_registry_icon: reg
    template: ' {{ .Path }} '
    trailing_separator: (
prompt:
    - segments:
        - session
        - path
        - git
        - time
session:
    background: lightRed
    foreground: lightWhite
    leading_separator: (
    template: '{{ .UserName }} '
    trailing_separator: (
time:
    background: lightMagenta
    foreground: lightWhite
    leading_separator: )
    options:
        time_format: "15:04"
    template: ' {{ .LastDate | date .Format }} '
    trailing_separator: (
