# Code generated by src/tools/genconsolethemes; DO NOT EDIT.
#
# Console variant of "if_tea", for the Linux virtual console.
#
# Nerd Font icons are removed and Powerline separators replaced with ASCII,
# because a console font carries neither. Colors are approximated to the 16
# ANSI colors a console can show, so themes that differ only in shade look
# alike here.
#
# To take this file over, delete the generated marker on the first line: the
# generator then leaves it alone. Otherwise edit if_tea.prompto.yaml and regenerate.

console_title_template: '{{ .Folder }}'
executiontime:
    background: lightBlue
    foreground: lightWhite
    leading_separator: <
    options:
        style: roundrock
        threshold: 0
    template: ' {{ .FormattedMs }} '
    trailing_separator: '>'
git:
    background: lightMagenta
    foreground: black
    leading_separator: '>'
    options:
        branch_icon: ' '
        fetch_status: true
        fetch_upstream_icon: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    template: ' {{ .UpstreamIcon }}{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }} {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }} {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }} {{ .StashCount }}{{ end }} '
    trailing_separator: '>'
os:
    foreground: lightBlue
    options:
        alpine: alpine
        arch: arch
        centos: centos
        debian: debian
        elementary: elementary
        fedora: fedora
        gentoo: gentoo
        linux: linux
        macos: ' '
        manjaro: manjaro
        mint: mint
        opensuse: opensuse
        raspbian: raspbian
        ubuntu: ' '
        windows: ' '
        display_distro_name: true
        android: android
    template: ' {{ if .WSL }}WSL at {{ end }}{{.Icon}}'
    trailing_separator: <transparent,><</>
path:
    background: lightRed
    foreground: black
    leading_separator: <transparent,lightRed>></>
    options:
        folder_icon: ' '
        folder_separator_icon: ' '
        home_icon: ""
        style: agnoster_full
        windows_registry_icon: reg
    template: ' {{ .Path }} '
    trailing_separator: '>'
prompt:
    - segments:
        - os
        - sysinfo
        - sysinfo.2
        - executiontime
    - segments:
        - text
        - shell
        - time
        - root
        - path
    - segments:
        - status
root:
    options:
        root_icon: ' '
    template: ' # '
rprompt:
    - segments:
        - git
shell:
    background: lightCyan
    foreground: black
    leading_separator: <
    template: ' {{ .Name }} '
    trailing_separator: <transparent,lightCyan><</>
status:
    foreground: cyan
    foreground_templates:
        - '{{ if gt .Code 0 }}lightRed{{ end }}'
    options:
        always_enabled: true
    template: '-- '
sysinfo:
    background: cyan
    foreground: black
    leading_separator: <transparent,cyan>></>
    template: ' CPU: {{ round .PhysicalPercentUsed .Precision }}% | '
sysinfo.2:
    background: cyan
    foreground: black
    template: 'RAM: {{ (div ((sub .PhysicalTotalMemory .PhysicalAvailableMemory)|float64) 1073741824.0) }}/{{ (div .PhysicalTotalMemory 1073741824.0) }}GB '
    trailing_separator: <transparent,cyan><</>
text:
    foreground: lightCyan
    template: --
time:
    background: lightRed
    foreground: black
    leading_separator: <
    options:
        time_format: 3:04:05 PM | Monday
    template: ' {{ .LastDate | date .Format }} '
    trailing_separator: '>'
transient:
    - segments:
        - text.transient
text.transient:
    background: transparent
    foreground: lightWhite
    template: ' '
