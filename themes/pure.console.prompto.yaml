console_title_template: '{{if .Root}}(Admin){{end}} {{.PWD}}'
executiontime:
    foreground: white
    options:
        style: austin
    template: ' {{ .FormattedMs }} '
git:
    foreground: darkGray
    options:
        branch_ahead_icon: <white>^ </>
        branch_behind_icon: <white>v </>
        branch_icon: ""
        fetch_status: true
        fetch_upstream_icon: true
        github_icon: 'gh '
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    template: '{{ .UpstreamIcon }}{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}<white>*</>{{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }} {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }} {{ .StashCount }}{{ end }} '
path:
    foreground: white
    options:
        style: full
        windows_registry_icon: reg
    template: '{{ .Path }} '
prompt:
    - segments:
        - session
        - path
    - segments:
        - git
    - segments:
        - executiontime
    - segments:
        - status
session:
    foreground: lightRed
    template: '{{ .UserName }} '
status:
    foreground: white
    foreground_templates:
        - '{{ if gt .Code 0 }}lightRed{{ end }}'
    options:
        always_enabled: true
    template: '> '
transient:
    - segments:
        - text.transient
text.transient:
    foreground: white
    foreground_templates:
        - '{{ if gt .Code 0 }}lightRed{{ end }}'
    template: '> '
