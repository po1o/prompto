# Code generated by src/tools/genconsolethemes; DO NOT EDIT.
#
# Console variant of "capr4n", for the Linux virtual console.
#
# Nerd Font icons are removed and Powerline separators replaced with ASCII,
# because a console font carries neither. Colors are approximated to the 16
# ANSI colors a console can show, so themes that differ only in shade look
# alike here.
#
# To take this file over, delete the generated marker on the first line: the
# generator then leaves it alone. Otherwise edit capr4n.prompto.yaml and regenerate.

console_title_template: '{{if .Root}} ! {{end}}{{.UserName}} > {{.Folder}}'
executiontime:
    background: white
    foreground: lightWhite
    options:
        always_enabled: true
    template: ' {{ .FormattedMs }} '
cursor_padding: true
git:
    background: lightGreen
    foreground: darkGray
    trailing_separator: '>'
    template: ' {{ .HEAD }} '
    options:
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
path:
    background: lightMagenta
    foreground: lightWhite
    options:
        folder_icon: ""
        folder_separator_icon: ' > '
        max_depth: 2
        style: agnoster_short
        windows_registry_icon: reg
    trailing_separator: '>'
    template: ' {{ .Path }} '
prompt:
    - segments:
        - session
        - path
        - git
rprompt:
    - segments:
        - time
        - executiontime
session:
    background: white
    foreground: lightWhite
    template: '{{if .Root}} {{.UserName}} {{else}} {{.UserName}} {{end}}'
    trailing_separator: '>'
time:
    background: darkGray
    foreground: lightWhite
    template: ' {{ .LastDate | date .Format }} '
