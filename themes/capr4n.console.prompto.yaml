# Console variant of the `capr4n` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of capr4n.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

console_title_template: '{{if .Root}} ! {{end}}{{.UserName}} > {{.Folder}}'
executiontime:
    background: white
    foreground: lightWhite
    options:
        always_enabled: true
    template: ' {{ .FormattedMs }} '
cursor_padding: true
git:
    background: lightGreen
    foreground: darkGray
    trailing_separator: '>'
    template: ' {{ .HEAD }} '
    options:
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
path:
    background: lightMagenta
    foreground: lightWhite
    options:
        folder_icon: ""
        folder_separator_icon: ' > '
        max_depth: 2
        style: agnoster_short
        windows_registry_icon: reg
    trailing_separator: '>'
    template: ' {{ .Path }} '
prompt:
    - segments:
        - session
        - path
        - git
rprompt:
    - segments:
        - time
        - executiontime
session:
    background: white
    foreground: lightWhite
    template: '{{if .Root}} {{.UserName}} {{else}} {{.UserName}} {{end}}'
    trailing_separator: '>'
time:
    background: darkGray
    foreground: lightWhite
    template: ' {{ .LastDate | date .Format }} '
