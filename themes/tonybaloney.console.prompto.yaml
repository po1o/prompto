# Code generated by src/tools/genconsolethemes; DO NOT EDIT.
#
# Console variant of "tonybaloney", for the Linux virtual console.
#
# Nerd Font icons are removed and Powerline separators replaced with ASCII,
# because a console font carries neither. Colors are approximated to the 16
# ANSI colors a console can show, so themes that differ only in shade look
# alike here.
#
# To take this file over, delete the generated marker on the first line: the
# generator then leaves it alone. Otherwise edit tonybaloney.prompto.yaml and regenerate.

cursor_padding: true
git:
    background: darkGray
    foreground: lightYellow
    options:
        fetch_upstream_icon: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    trailing_separator: '>'
    template: ' {{ .UpstreamIcon }}{{ .HEAD }}{{ if gt .StashCount 0 }} {{ .StashCount }}{{ end }} '
path:
    background: darkGray
    foreground: lightYellow
    leading_separator: (
    options:
        style: folder
        windows_registry_icon: reg
    template: ' {{ .Path }} '
    trailing_separator: '>'
prompt:
    - segments:
        - path
        - git
        - python
        - root
python:
    background: lightYellow
    foreground: darkGray
    trailing_separator: '>'
    template: ' {{ if .Error }}{{ .Error }}{{ else }}{{ if .Venv }}{{ .Venv }} {{ end }}{{ .Full }}{{ end }} '
root:
    background: lightYellow
    foreground: darkGray
    trailing_separator: '>'
    template: ' # '
