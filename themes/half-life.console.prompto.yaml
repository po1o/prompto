# Console variant of the `half-life` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of half-life.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

git:
    foreground: lightCyan
    options:
        branch_ahead_icon: ""
        branch_behind_icon: ""
        branch_gone_icon: ""
        branch_icon: ""
        branch_identical_icon: ""
        cherry_pick_icon: 'pick '
        commit_icon: '@'
        fetch_status: true
        merge_icon: 'merge '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        no_commits_icon: 'empty '
    template: '<lightWhite>on</> {{ .HEAD }}{{ if .Staging.Changed }}<lightGreen> * {{ .Staging.String }}</>{{ end }}{{ if .Working.Changed }}<yellow> * {{ .Working.String }}</>{{ end }} '
path:
    foreground: lightGreen
    options:
        style: full
        windows_registry_icon: reg
    template: '{{ .Path }} '
prompt:
    - segments:
        - session
        - text
        - path
        - git
        - text.2
session:
    foreground: lightBlue
    template: '{{ .UserName }} '
text:
    foreground: lightWhite
    template: 'in '
text.2:
    foreground: yellow
    template: 'l '
