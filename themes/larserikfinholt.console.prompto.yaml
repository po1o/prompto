# Console variant of the `larserikfinholt` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of larserikfinholt.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

console_title_template: '{{ .Shell }} in {{ .Folder }}'
executiontime:
    background: white
    foreground: lightWhite
    options:
        always_enabled: true
    template: '<transparent>></> {{ .FormattedMs }} '
cursor_padding: true
git:
    background: lightYellow
    background_templates:
        - '{{ if or (.Working.Changed) (.Staging.Changed) }}lightRed{{ end }}'
        - '{{ if and (gt .Ahead 0) (gt .Behind 0) }}lightRed{{ end }}'
        - '{{ if gt .Ahead 0 }}white{{ end }}'
        - '{{ if gt .Behind 0 }}white{{ end }}'
    foreground: darkGray
    options:
        branch_template: '{{ trunc 25 .Branch }}'
        fetch_status: true
        fetch_upstream_icon: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    style: powerline
    template: ' {{ .UpstreamIcon }}{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }} {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }} {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }} {{ .StashCount }}{{ end }} '
path:
    background: lightRed
    foreground: lightWhite
    options:
        folder_separator_icon: ' > '
        home_icon: "~"
        style: folder
        windows_registry_icon: reg
    trailing_style: powerline
    template: ' {{ .Path }} '
prompt:
    - segments:
        - session
        - path
        - git
        - executiontime
        - strava
        - status
session:
    background: white
    foreground: lightWhite
    leading_style: rounded
    template: ' {{ .UserName }} '
    trailing_style: powerline
status:
    background: cyan
    background_templates:
        - '{{ if gt .Code 0 }}lightRed{{ end }}'
    foreground: lightWhite
    options:
        always_enabled: true
    template: '<parentBackground>></> '
    style: rounded
strava:
    background: black
    background_templates:
        - '{{ if gt .Hours 100 }}lightRed{{ end }}'
        - '{{ if and (lt .Hours 100) (gt .Hours 50) }}lightYellow{{ end }}'
        - '{{ if lt .Hours 50 }}green{{ end }}'
    foreground: lightWhite
    foreground_templates:
        - '{{ if gt .Hours 100 }}lightWhite{{ end }}'
        - '{{ if and (lt .Hours 100) (gt .Hours 50) }}darkGray{{ end }}'
        - '{{ if lt .Hours 50 }}lightWhite{{ end }}'
    options:
        access_token: 0ccbd2ac1e37a5b84101468df3d367177fe02ab3
        http_timeout: 1500
        refresh_token: "111111111111111111111111111111"
        ride_icon: 'ride '
        run_icon: 'run '
        skiing_icon: 'ski '
        unknown_activity_icon: 'activity '
        workout_icon: 'workout '
    style: powerline
    template: ' {{.Name}} {{.Ago}} {{.Icon}} '
