# Console variant of the `space` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of space.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

git:
    options:
        branch_icon: ""
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    template: '<lightWhite>on</> {{ .HEAD }}{{ if gt .StashCount 0 }} {{ .StashCount }}{{ end }} '
go:
    foreground: lightCyan
    trailing_separator: '>'
    template: '[ {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}] '
java:
    foreground: lightRed
    trailing_separator: '>'
    template: '[ {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}] '
julia:
    foreground: lightBlue
    trailing_separator: '>'
    template: ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
node:
    foreground: white
    trailing_separator: '>'
    template: '[ {{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }}{{ .Full }}] '
os:
    foreground: cyan
    options:
        macos: mac
        display_distro_name: true
        android: android
        linux: linux
    template: '{{ if .WSL }}WSL at {{ end }}{{.Icon}}'
path:
    foreground: lightGreen
    options:
        style: folder
        windows_registry_icon: reg
    template: '{{ .Path }} '
prompt:
    - segments:
        - os
        - session
        - path
        - git
        - python
        - go
        - node
        - ruby
        - java
        - julia
        - text
python:
    foreground: lightBlue
    trailing_separator: '>'
    template: '[ {{ if .Error }}{{ .Error }}{{ else }}{{ if .Venv }}{{ .Venv }} {{ end }}{{ .Full }}{{ end }}] '
ruby:
    foreground: lightRed
    trailing_separator: '>'
    template: '[{{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}] '
session:
    foreground: cyan
    template: ' {{ .UserName }}: '
text:
    foreground: lightYellow
    template: '> '
