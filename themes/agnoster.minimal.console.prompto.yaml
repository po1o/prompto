# Console variant of the `agnoster.minimal` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of agnoster.minimal.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

git:
    background: cyan
    foreground: lightWhite
    options:
        cherry_pick_icon: 'ok '
        commit_icon: '> '
        fetch_status: true
        merge_icon: 't '
        no_commits_icon: '[no commits]'
        rebase_icon: 'L '
        tag_icon: '> '
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        revert_icon: 'revert '
    template: '{{ .HEAD }}{{ if and (eq .Ahead 0) (eq .Behind 0) }} ={{end}}{{ if gt .Ahead 0 }} ^{{.Ahead}}{{end}}{{ if gt .Behind 0 }} v{{.Behind}}{{end}} {{ if .Working.Changed }}+{{ .Working.Added }} ~{{ .Working.Modified }} -{{ .Working.Deleted }} {{ end }}'
path:
    background: cyan
    foreground: lightWhite
    options:
        folder_icon: ..
        folder_separator_icon: ' > '
        max_depth: 3
        style: agnoster_short
        windows_registry_icon: reg
    template: '<transparent>></> {{ .Path }} '
prompt:
    - segments:
        - status
        - root
        - session
        - path
        - git
        - text
root:
    foreground: red
    template: '# '
session:
    foreground: lightWhite
    template: '{{ .UserName }}@{{ .HostName }} '
status:
    foreground: lightWhite
    template: '{{ reason .Code }}x '
text:
    foreground: cyan
    template: '> '
