# Code generated by src/tools/genconsolethemes; DO NOT EDIT.
#
# Console variant of "bubbles", for the Linux virtual console.
#
# Nerd Font icons are removed and Powerline separators replaced with ASCII,
# because a console font carries neither. Colors are approximated to the 16
# ANSI colors a console can show, so themes that differ only in shade look
# alike here.
#
# To take this file over, delete the generated marker on the first line: the
# generator then leaves it alone. Otherwise edit bubbles.prompto.yaml and regenerate.

battery:
    background: darkGray
    foreground: lightBlue
    foreground_templates:
        - '{{if eq "Charging" .State.String}}lightCyan{{end}}'
        - '{{if eq "Discharging" .State.String}}lightRed{{end}}'
        - '{{if eq "Full" .State.String}}lightGreen{{end}}'
    leading_separator: ' ('
    options:
        charged_icon: ' '
        charging_icon: '^ '
        discharging_icon: 'v '
    template: '{{ if not .Error }}{{ .Icon }}{{ .Percentage }}{{ end }}{{ .Error }}'
    trailing_separator: )
executiontime:
    background: darkGray
    foreground: white
    leading_separator: (
    options:
        style: austin
        threshold: 150
    template: '{{ .FormattedMs }}'
    trailing_separator: ') '
cursor_padding: true
git:
    background: darkGray
    foreground: lightCyan
    leading_separator: ' ('
    options:
        branch_icon: ""
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    template: '{{ .HEAD }}'
    trailing_separator: )
go:
    background: darkGray
    foreground: lightCyan
    leading_separator: ' ('
    options:
        fetch_version: false
    template: '{{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}'
    trailing_separator: )
java:
    background: darkGray
    foreground: lightRed
    leading_separator: ' ('
    options:
        fetch_version: false
    template: '{{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}'
    trailing_separator: )
julia:
    background: darkGray
    foreground: lightBlue
    leading_separator: ' ('
    options:
        fetch_version: false
    template: '{{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
    trailing_separator: )
node:
    background: darkGray
    foreground: lightGreen
    leading_separator: ' ('
    options:
        fetch_version: false
    template: '{{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }}{{ .Full }}'
    trailing_separator: )
path:
    background: darkGray
    foreground: lightGreen
    leading_separator: (
    options:
        style: folder
        windows_registry_icon: reg
    template: ' {{ .Path }}'
    trailing_separator: )
prompt:
