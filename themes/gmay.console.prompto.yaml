# Console variant of the `gmay` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of gmay.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

cursor_padding: true
git:
    background: lightYellow
    foreground: darkGray
    options:
        fetch_upstream_icon: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    style: powerline
    template: ' {{ .UpstreamIcon }}{{ .HEAD }}{{ if gt .StashCount 0 }} {{ .StashCount }}{{ end }} '
node:
    background: white
    foreground: lightWhite
    style: powerline
    template: ' {{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }}{{ .Full }} '
os:
    background: lightBlue
    foreground: lightWhite
    leading_style: rounded
    template: ' {{ if .WSL }}WSL at {{ end }}{{.Icon}} '
    options:
        display_distro_name: true
        android: android
        linux: linux
        macos: mac
path:
    background: lightRed
    foreground: lightWhite
    options:
        style: full
        windows_registry_icon: reg
    trailing_style: powerline
    template: ' {{ .Path }} '
prompt:
    - segments:
        - os
        - session
        - path
        - time
        - git
        - node
        - root
        - status
    - segments:
        - text
root:
    background: lightYellow
    foreground: darkGray
    style: powerline
    template: ' # '
session:
    background: lightBlue
    foreground: lightWhite
    style: powerline
    template: ' {{ .UserName }}@{{ .HostName }} '
status:
    background: cyan
    background_templates:
        - '{{ if gt .Code 0 }}lightRed{{ end }}'
    foreground: lightWhite
    leading_separator: <transparent,background>></>
    options:
        always_enabled: true
    template: ' x '
    trailing_style: rounded
text:
    foreground: lightRed
    template: ' '
time:
    background: lightGreen
    foreground: darkGray
    options:
        time_format: "2006-01-02 15:04:05"
    style: powerline
    template: ' {{ .LastDate | date .Format }} '
