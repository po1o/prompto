# Code generated by src/tools/genconsolethemes; DO NOT EDIT.
#
# Console variant of "gmay", for the Linux virtual console.
#
# Nerd Font icons are removed and Powerline separators replaced with ASCII,
# because a console font carries neither. Colors are approximated to the 16
# ANSI colors a console can show, so themes that differ only in shade look
# alike here.
#
# To take this file over, delete the generated marker on the first line: the
# generator then leaves it alone. Otherwise edit gmay.prompto.yaml and regenerate.

cursor_padding: true
git:
    background: lightYellow
    foreground: darkGray
    options:
        fetch_upstream_icon: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    trailing_separator: '>'
    template: ' {{ .UpstreamIcon }}{{ .HEAD }}{{ if gt .StashCount 0 }} {{ .StashCount }}{{ end }} '
node:
    background: white
    foreground: lightWhite
    trailing_separator: '>'
    template: ' {{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }}{{ .Full }} '
os:
    background: lightBlue
    foreground: lightWhite
    leading_separator: (
    template: ' {{ if .WSL }}WSL at {{ end }}{{.Icon}} '
    options:
        display_distro_name: true
        android: android
        linux: linux
        macos: mac
path:
    background: lightRed
    foreground: lightWhite
    options:
        style: full
        windows_registry_icon: reg
    trailing_separator: '>'
    template: ' {{ .Path }} '
prompt:
    - segments:
        - os
        - session
        - path
        - time
        - git
        - node
        - root
        - status
    - segments:
        - text
root:
    background: lightYellow
    foreground: darkGray
    trailing_separator: '>'
    template: ' # '
session:
    background: lightBlue
    foreground: lightWhite
    trailing_separator: '>'
    template: ' {{ .UserName }}@{{ .HostName }} '
status:
    background: cyan
    background_templates:
        - '{{ if gt .Code 0 }}lightRed{{ end }}'
    foreground: lightWhite
    leading_separator: <transparent,background>></>
    options:
        always_enabled: true
    template: ' x '
    trailing_separator: )
text:
    foreground: lightRed
    template: ' '
time:
    background: lightGreen
    foreground: darkGray
    options:
        time_format: "2006-01-02 15:04:05"
    trailing_separator: '>'
    template: ' {{ .LastDate | date .Format }} '
