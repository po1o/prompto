# Console variant of the `pixelrobots` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of pixelrobots.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

aws:
    background: lightRed
    foreground: black
    options:
        display_default: true
    style: powerline
    template: ' {{.Profile}}{{if .Region}}@{{.Region}}{{end}}'
az:
    background: cyan
    foreground: black
    options:
        source: cli
    style: powerline
    template: ' {{ .Name }} [ {{ .Origin }} ] '
az.2:
    background: darkGray
    foreground: lightWhite
    options:
        source: pwsh
    style: powerline
    template: ' {{ .Name }} [ {{ .Origin }} ] '
console_title_template: '{{if .Root}}root :: {{end}}{{.Shell}} :: {{.Folder}}'
cursor_padding: true
git:
    background: darkGray
    foreground: lightYellow
    foreground_templates:
        - '{{ if or (.Working.Changed) (.Staging.Changed) }}lightYellow{{ end }}'
        - '{{ if gt .Ahead 0 }}cyan{{ end }}'
        - '{{ if gt .Behind 0 }}lightBlue{{ end }}'
    options:
        fetch_status: true
        fetch_upstream_icon: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    template: '<lightYellow>> </>{{ .UpstreamIcon }}{{ .HEAD }}{{ .BranchStatus }}{{ if .Working.Changed }}<lightRed> {{ .Working.String }}</>{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }}<lightGreen> {{ .Staging.String }}</>{{ end }}{{ if gt .StashCount 0 }} {{ .StashCount }}{{ end }} '
kubectl:
    background: lightYellow
    foreground: black
    style: powerline
    template: ' {{.Context}}{{if .Namespace}} :: {{.Namespace}}{{end}} '
os:
    background: darkGray
    foreground: cyan
    leading_separator: )#
    options:
        alpine: alpine
        arch: arch
        centos: centos
        debian: debian
        elementary: elementary
        fedora: fedora
        gentoo: gentoo
        linux: linux
        macos: macos
        manjaro: manjaro
        mint: mint
        opensuse: opensuse
        raspbian: raspbian
        ubuntu: ubuntu
        windows: windows
        display_distro_name: true
        android: android
    template: ' {{ if .WSL }}{{ .Icon }} on {{ end }} <lightYellow>></>'
path:
    background: darkGray
    foreground: lightWhite
    options:
        folder_icon: <white> </>
        folder_separator_icon: <lightYellow>> </>
        home_icon: ' '
        style: agnoster_short
        windows_registry_icon: reg
    template: '<lightYellow> </>{{ .Path }} '
prompt:
    - segments:
        - text
        - kubectl
        - az
        - az.2
        - aws
    - segments:
        - os
        - session
        - root
        - path
        - git
        - text.2
    - segments:
        - text.3
root:
    background: darkGray
    foreground: lightYellow
    template: ' <lightYellow> ></>'
session:
    background: darkGray
    foreground: lightYellow
    template: ' {{ if ne .Env.PROMPTO_SESSION_DEFAULT_USER .UserName }}{{ .UserName }}{{ end }}<lightYellow> ></>'
text:
    background: lightYellow
    foreground: black
    leading_separator: )#
text.2:
    background: darkGray
    foreground: lightWhite
    style: powerline
text.3:
    foreground: lightYellow
    template: ' > '
