git:
    foreground: lightYellow
    template: '{{ .HEAD }} '
    options:
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
path:
    foreground: lightCyan
    options:
        style: full
        windows_registry_icon: reg
    template: '{{ .Path }} '
prompt:
    - segments:
        - path
        - git
        - text
rprompt:
    - segments:
        - time
text:
    foreground: lightGreen
    template: '> '
time:
    foreground: cyan
    options:
        time_format: "15:04:05"
    template: ' {{ .LastDate | date .Format }} '
