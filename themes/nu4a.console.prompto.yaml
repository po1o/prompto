# Console variant of the `nu4a` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of nu4a.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

console_title_template: '{{if .Root}} ! {{end}}{{.UserName}} > {{.Folder}}'
executiontime:
    background: darkGray
    foreground: lightWhite
    leading_separator: <
    options:
        style: austin
    template: ' {{ .FormattedMs }} '
cursor_padding: true
git:
    background: lightGreen
    foreground: darkGray
    trailing_separator: '>'
    template: ' {{ .HEAD }} '
    options:
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
path:
    background: yellow
    foreground: black
    options:
        folder_icon: ""
        folder_separator_icon: /
        home_icon: ""
        mapped_locations:
            C:\Users: ""
            C:\Windows: ""
        mixed_threshold: 8
        style: mixed
        windows_registry_icon: reg
    trailing_separator: '>'
    template: ' {{ path .Path .Location }} '
prompt:
    - segments:
        - session
        - path
        - git
        - python
python:
    background: lightBlue
    foreground: black
    trailing_separator: '>'
    template: ' {{ if .Error }}{{ .Error }}{{ else }}{{ if .Venv }}{{ .Venv }} {{ end }}{{ .Full }}{{ end }} '
rprompt:
    - segments:
        - status
        - executiontime
secondary:
    - segments:
        - text.secondary
text.secondary:
    background: yellow
    foreground: black
    template: ' '
session:
    background: white
    background_templates:
        - '{{if .Root}}lightRed{{else}}white{{end}}'
    foreground: black
    trailing_separator: '>'
    template: '{{if .Root}} {{.UserName}} {{else}} {{.UserName}} {{end}}'
status:
    background: lightRed
    foreground: lightWhite
    leading_separator: '>'
    template: ' x '
    trailing_separator: '>'
