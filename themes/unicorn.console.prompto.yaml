# Code generated by src/tools/genconsolethemes; DO NOT EDIT.
#
# Console variant of "unicorn", for the Linux virtual console.
#
# Nerd Font icons are removed and Powerline separators replaced with ASCII,
# because a console font carries neither. Colors are approximated to the 16
# ANSI colors a console can show, so themes that differ only in shade look
# alike here.
#
# To take this file over, delete the generated marker on the first line: the
# generator then leaves it alone. Otherwise edit unicorn.prompto.yaml and regenerate.

console_title_template: '{{.UserName}}@{{.HostName}} in {{ .PWD }}'
executiontime:
    background: white
    foreground: lightWhite
    options:
        always_enabled: true
    template: ' {{ .FormattedMs }} '
    trailing_separator: )
cursor_padding: true
git:
    background: lightYellow
    background_templates:
        - '{{ if or (.Working.Changed) (.Staging.Changed) }}lightRed{{ end }}'
        - '{{ if and (gt .Ahead 0) (gt .Behind 0) }}lightRed{{ end }}'
        - '{{ if gt .Ahead 0 }}white{{ end }}'
        - '{{ if gt .Behind 0 }}lightRed{{ end }}'
    foreground: darkGray
    options:
        fetch_status: true
        fetch_upstream_icon: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    trailing_separator: '>'
    template: ' {{ .UpstreamIcon }}{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }} {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }} {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }} {{ .StashCount }}{{ end }} '
os:
    background: darkGray
    foreground: lightWhite
    options:
        windows: ' '
        display_distro_name: true
        android: android
        linux: linux
        macos: mac
    trailing_separator: '>'
    template: ' {{ if .WSL }}WSL at {{ end }}{{.Icon}}'
path:
    background: cyan
    foreground: darkGray
    options:
        folder_separator_icon: /
        style: full
        windows_registry_icon: reg
    trailing_separator: '>'
    template: ' {{ .Path }} '
prompt:
    - segments:
        - os
        - path
        - git
        - time
        - executiontime
    - segments:
        - root
        - text
root:
    foreground: lightWhite
    template: ' ! '
text:
    foreground: lightRed
    template: ' '
time:
    background: darkGray
    foreground: lightWhite
    trailing_separator: '>'
    template: '<lightWhite> </>{{ .LastDate | date .Format }} '
