# Console variant of the `tiwahu` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of tiwahu.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

dotnet:
    background: lightBlue
    foreground: lightWhite
    options:
        fetch_version: false
    template: ' '
executiontime:
    background: cyan
    foreground: black
    options:
        style: austin
        threshold: 321
    template: ' {{ .FormattedMs }} '
git:
    background: yellow
    foreground: lightWhite
    options:
        branch_icon: ' '
        cherry_pick_icon: ' '
        commit_icon: ' '
        fetch_status: false
        fetch_upstream_icon: false
        merge_icon: ' '
        no_commits_icon: ' '
        rebase_icon: ' '
        revert_icon: ' '
        tag_icon: ' '
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
    template: ' {{ .HEAD }} '
go:
    background: lightCyan
    foreground: lightWhite
    options:
        fetch_version: false
    template: ' '
os:
    background: black
    foreground: darkGray
    template: ' {{ if .WSL }} {{ end }}{{.Icon}}'
    options:
        display_distro_name: true
        android: android
        linux: linux
        macos: mac
path:
    background: darkGray
    foreground: white
    options:
        folder_icon: ..
        style: mixed
        windows_registry_icon: reg
    template: ' {{ .Path }} '
prompt:
    - segments:
        - executiontime
        - status
        - root
        - os
        - session
        - path
        - git
        - dotnet
        - go
        - python
        - rust
    - segments:
        - shell
python:
    background: lightBlue
    foreground: black
    options:
        fetch_version: false
    template: ' '
root:
    background: lightYellow
    foreground: black
    template: '#'
rust:
    background: white
    foreground: darkGray
    options:
        fetch_version: false
    template: ' '
session:
    background: black
    foreground: darkGray
    template: ' {{ if .SSHSession }} {{ end }}{{ .UserName }}@{{ .HostName }} '
shell:
    foreground: cyan
    options:
        mapped_shell_names:
            bash: $
            cmd: '>'
            fish: ~>
            lua: '>'
            nu: :)
            pwsh: '>'
            shell: '>'
            zsh: '%'
    template: '{{ .Name }} '
status:
    background: red
    foreground: lightRed
    template: '{{ if gt .Code 0 }} {{ .Code }} {{ end }}'
