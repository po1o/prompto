# Code generated by src/tools/genconsolethemes; DO NOT EDIT.
#
# Console variant of "craver", for the Linux virtual console.
#
# Nerd Font icons are removed and Powerline separators replaced with ASCII,
# because a console font carries neither. Colors are approximated to the 16
# ANSI colors a console can show, so themes that differ only in shade look
# alike here.
#
# To take this file over, delete the generated marker on the first line: the
# generator then leaves it alone. Otherwise edit craver.prompto.yaml and regenerate.

console_title_template: '{{if .Root}}(Admin) {{end}}{{.Folder}}'
dotnet:
    background: cyan
    foreground: lightWhite
    trailing_separator: '>'
    template: ' {{ if .Unsupported }}{{ else }}{{ .Full }}{{ end }} '
executiontime:
    background: magenta
    foreground: lightWhite
    options:
        style: austin
        threshold: 1
    trailing_separator: '>'
    template: ' <lightWhite></> {{ .FormattedMs }} '
git:
    background: black
    foreground: lightBlue
    options:
        fetch_status: true
        fetch_upstream_icon: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    trailing_separator: '>'
    template: '{{ .UpstreamIcon }}{{ .HEAD }}{{ if .Staging.Changed }} {{ .Staging.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Working.Changed }} {{ .Working.String }}{{ end }}{{ if gt .StashCount 0 }} {{ .StashCount }}{{ end }} '
os:
    background: darkGray
    foreground: lightBlue
    leading_separator: ' '
    template: ' {{ if .WSL }}WSL at {{ end }}{{.Icon}} '
    options:
        display_distro_name: true
        android: android
        linux: linux
        macos: mac
path:
    background: black
    foreground: lightGreen
    options:
        folder_separator_icon: /
        style: folder
        windows_registry_icon: reg
    trailing_separator: '>'
    template: ' {{ .Path }} '
prompt:
    - segments:
        - root
        - os
        - time
        - path
        - git
        - dotnet
        - executiontime
        - status
    - segments:
        - text
root:
    background: lightRed
    foreground: black
    trailing_separator: '>'
    template: '#'
status:
    background: lightGreen
    background_templates:
        - '{{ if gt .Code 0 }}lightRed{{ end }}'
    foreground: black
    trailing_separator: '>'
    template: ' x '
text:
    foreground: lightRed
    template: '> '
time:
    background: black
    foreground: lightYellow
    options:
        time_format: "15:04:05"
    trailing_separator: '>'
    template: '{{ .LastDate | date .Format }} '
