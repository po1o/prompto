# Console variant of the `craver` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of craver.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

console_title_template: '{{if .Root}}(Admin) {{end}}{{.Folder}}'
dotnet:
    background: cyan
    foreground: lightWhite
    style: powerline
    template: ' {{ if .Unsupported }}{{ else }}{{ .Full }}{{ end }} '
executiontime:
    background: magenta
    foreground: lightWhite
    options:
        style: austin
        threshold: 1
    trailing_style: powerline
    template: ' <lightWhite></> {{ .FormattedMs }} '
git:
    background: black
    foreground: lightBlue
    options:
        fetch_status: true
        fetch_upstream_icon: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    style: powerline
    template: '{{ .UpstreamIcon }}{{ .HEAD }}{{ if .Staging.Changed }} {{ .Staging.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Working.Changed }} {{ .Working.String }}{{ end }}{{ if gt .StashCount 0 }} {{ .StashCount }}{{ end }} '
os:
    background: darkGray
    foreground: lightBlue
    leading_separator: ' '
    template: ' {{ if .WSL }}WSL at {{ end }}{{.Icon}} '
    options:
        display_distro_name: true
        android: android
        linux: linux
        macos: mac
path:
    background: black
    foreground: lightGreen
    options:
        folder_separator_icon: /
        style: folder
        windows_registry_icon: reg
    trailing_style: powerline
    template: ' {{ .Path }} '
prompt:
    - segments:
        - root
        - os
        - time
        - path
        - git
        - dotnet
        - executiontime
        - status
    - segments:
        - text
root:
    background: lightRed
    foreground: black
    style: powerline
    template: '#'
status:
    background: lightGreen
    background_templates:
        - '{{ if gt .Code 0 }}lightRed{{ end }}'
    foreground: black
    style: powerline
    template: ' x '
text:
    foreground: lightRed
    template: '> '
time:
    background: black
    foreground: lightYellow
    options:
        time_format: "15:04:05"
    style: powerline
    template: '{{ .LastDate | date .Format }} '
