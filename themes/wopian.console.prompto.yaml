# Console variant of the `wopian` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of wopian.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

crystal:
    foreground: lightBlue
    options:
        display_mode: files
        fetch_version: true
    template: ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}'
git:
    foreground: lightYellow
    template: ':: <lightBlue>git(</>{{ .HEAD }}<lightBlue>)</>'
    options:
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
node:
    foreground: white
    options:
        display_mode: files
        fetch_package_manager: true
        fetch_version: true
        npm_icon: /npm
        yarn_icon: /yarn
    template: ' {{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }}{{ .Full }}'
os:
    foreground: cyan
    trailing_separator: '>'
    template: '{{ .Icon }}'
    options:
        display_distro_name: true
        android: android
        linux: linux
        macos: mac
path:
    foreground: cyan
    options:
        style: full
        windows_registry_icon: reg
    template: ' {{ .Path }} '
prompt:
    - segments:
        - os
        - path
        - git
    - segments:
        - status
python:
    foreground: lightYellow
    options:
        display_mode: context
        fetch_virtual_env: false
    template: ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}'
rprompt:
    - segments:
        - node
        - crystal
        - ruby
        - python
        - time
ruby:
    foreground: lightRed
    options:
        display_mode: files
        fetch_version: true
    template: ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}'
status:
    foreground: lightGreen
    foreground_templates:
        - '{{ if gt .Code 0 }}red{{ end }}'
    options:
        always_enabled: true
    trailing_separator: '>'
    template: '> '
time:
    foreground: lightGreen
    template: ' {{ .LastDate | date .Format }} '
