# Console variant of the `blue-owl` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of blue-owl.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

console_title_template: '{{if .Root}} ! {{end}}{{.Folder | replace "~" "~" }} @ {{.HostName}}'
executiontime:
    background: darkGray
    foreground: lightWhite
    leading_separator: <transparent,darkGray>></>
    options:
        style: dallas
        threshold: 0
    template: ' {{ .FormattedMs }}s '
    trailing_style: powerline
git:
    background: green
    background_templates:
        - '{{ if or (.Working.Changed) (.Staging.Changed) }}lightYellow{{ end }}'
        - '{{ if and (gt .Ahead 0) (gt .Behind 0) }}lightYellow{{ end }}'
        - '{{ if gt .Ahead 0 }}white{{ end }}'
        - '{{ if gt .Behind 0 }}white{{ end }}'
    foreground: black
    options:
        fetch_status: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    style: powerline
    template: ' {{ .HEAD }}{{ if .Staging.Changed }}<lightRed> {{ .Staging.String }}</>{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Working.Changed }} {{ .Working.String }}{{ end }}{{ if gt .StashCount 0 }} {{ .StashCount }}{{ end }} '
os:
    background: transparent
    foreground: lightWhite
    template: '{{ if .WSL }}WSL at {{ end }}{{.Icon}} '
    options:
        display_distro_name: true
        android: android
        linux: linux
        macos: mac
path:
    background: cyan
    foreground: lightWhite
    leading_separator: <transparent,cyan>></>
    options:
        folder_icon: '...'
        folder_separator_icon: <transparent> \ </>
        home_icon: ""
        style: agnoster_short
        windows_registry_icon: reg
    template: ' {{ .Path }} '
    trailing_style: powerline
prompt:
    - segments:
        - root
        - os
        - path
        - git
        - executiontime
        - status
    - segments:
        - status.2
root:
    background: magenta
    foreground: lightYellow
    template: '! '
rprompt:
    - segments:
        - session
        - time
session:
    background: darkGray
    foreground: lightCyan
    leading_separator: '|'
    template: ' {{ .UserName }}<transparent> / </>{{ .HostName }} '
    trailing_style: slant
status:
    background: red
    foreground: lightWhite
    style: powerline
    template: '<transparent> </> {{ reason .Code }} '
status.2:
    foreground: lightWhite
    foreground_templates:
        - '{{ if gt .Code 0 }}red{{ end }}'
    options:
        always_enabled: true
    template: '> '
time:
    background: darkGray
    foreground: lightGreen
    leading_style: slant
    options:
        time_format: "15:04:05"
    template: ' {{ .LastDate | date .Format }} '
