# Console variant of the `uew` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of uew.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

console_title_template: '{{ .Folder }}'
executiontime:
    foreground: lightWhite
    options:
        style: dallas
        threshold: 0
    template: ' <white>{{ .FormattedMs }}s</> <lightWhite></>'
git:
    foreground: white
    options:
        branch_icon: ' '
        fetch_status: true
        fetch_upstream_icon: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    template: <lightWhite>{{ .UpstreamIcon }}</>{{ .HEAD }}
node:
    foreground: white
    template: ' <lightWhite></> {{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }}{{ .Full }} '
path:
    foreground: white
    leading_separator: <white>~</>
    options:
        folder_icon: /
        folder_separator_icon: ' / '
        home_icon: home
        style: agnoster_full
        windows_registry_icon: reg
    template: ' {{ .Path }}'
    trailing_separator: ""
prompt:
    - segments:
        - session
        - git
        - shell
    - segments:
        - path
        - status
root:
    options:
        root_icon: ' '
    template: ' #'
rprompt:
    - segments:
        - text
        - executiontime
        - time
        - root
        - node
session:
    foreground: white
    leading_separator: '<white>~</> '
    template: '{{ .UserName }} '
shell:
    foreground: white
    trailing_separator: '>'
    template: ' <lightWhite></> {{ .Name }} '
status:
    foreground: white
    foreground_templates:
        - '{{ if gt .Code 0 }}lightWhite{{ end }}'
    options:
        always_enabled: true
    template: ' ~ '
text:
    foreground: lightWhite
time:
    foreground: white
    template: ' {{ .LastDate | date "Monday" }} <lightWhite>at</> {{ .LastDate | date "3:04 PM" }} '
transient:
    - segments:
        - text.transient
text.transient:
    background: transparent
    foreground: lightWhite
    template: ' '
