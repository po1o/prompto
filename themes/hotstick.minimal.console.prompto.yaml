# Console variant of the `hotstick.minimal` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of hotstick.minimal.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

console_title_template: '{{.Folder}}{{if .Root}} :: root{{end}} :: {{.Shell}}'
cursor_padding: true
git:
    background: green
    background_templates:
        - '{{ if or (.Working.Changed) (.Staging.Changed) }}yellow{{ end }}'
    foreground: black
    options:
        branch_ahead_icon: ^
        branch_behind_icon: v
        branch_gone_icon: '!='
        branch_icon: ' '
        branch_identical_icon: '='
        cherry_pick_icon: 'ok '
        commit_icon: '> '
        fetch_status: true
        merge_icon: 't '
        no_commits_icon: '[no commits]'
        rebase_icon: 'L '
        tag_icon: '> '
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        revert_icon: 'revert '
    style: powerline
    template: ' {{ .HEAD }}{{ if .Staging.Changed }} {{ .Staging.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Working.Changed }} {{ .Working.String }}{{ end }} '
path:
    background: lightBlue
    foreground: black
    leading_style: rounded
    options:
        style: mixed
        windows_registry_icon: reg
    template: ' {{ .Path }} '
    trailing_style: powerline
prompt:
    - segments:
        - root
        - path
        - git
root:
    foreground: yellow
    template: ' # '
