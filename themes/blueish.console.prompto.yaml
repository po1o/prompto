# Console variant of the `blueish` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of blueish.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

battery:
    background: white
    background_templates:
        - '{{if eq "Charging" .State.String}}green{{end}}'
        - '{{if eq "Discharging" .State.String}}lightYellow{{end}}'
        - '{{if eq "Full" .State.String}}cyan{{end}}'
    foreground: darkGray
    trailing_separator: '>'
    template: ' {{ if not .Error }}{{ .Icon }}{{ .Percentage }}{{ end }}{{ .Error }} '
cursor_padding: true
git:
    background: white
    foreground: darkGray
    options:
        fetch_upstream_icon: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    trailing_separator: '>'
    template: ' {{ .UpstreamIcon }}{{ .HEAD }}{{ if gt .StashCount 0 }} {{ .StashCount }}{{ end }} '
kubectl:
    background: cyan
    foreground: lightWhite
    trailing_separator: '>'
    template: ' {{.Context}} :: {{if .Namespace}}{{.Namespace}}{{else}}default{{end}} '
node:
    background: white
    foreground: lightWhite
    trailing_separator: '>'
    template: ' {{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }}{{ .Full }} '
os:
    background: darkGray
    foreground: cyan
    leading_separator: '|'
    options:
        macos: mac
        display_distro_name: true
        android: android
        linux: linux
    template: ' {{ if .WSL }}WSL at {{ end }}{{.Icon}} >'
    trailing_separator: '>'
path:
    background: cyan
    foreground: darkGray
    options:
        style: folder
        windows_registry_icon: reg
    trailing_separator: '>'
    template: ' {{ .Path }} '
prompt:
    - segments:
        - os
        - session
        - battery
        - path
        - git
        - node
        - root
        - kubectl
        - status
    - segments:
        - text
root:
    background: lightYellow
    foreground: darkGray
    trailing_separator: '>'
    template: ' # '
session:
    background: darkGray
    foreground: cyan
    trailing_separator: '>'
    template: ' {{ .UserName }}@{{ .HostName }} '
status:
    background: green
    background_templates:
        - '{{ if gt .Code 0 }}lightRed{{ end }}'
    foreground: lightWhite
    leading_separator: <transparent,background>></>
    options:
        always_enabled: true
    template: ' x '
    trailing_separator: '>'
text:
    foreground: cyan
    template: '> '
