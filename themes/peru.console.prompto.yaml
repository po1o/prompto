# Code generated by src/tools/genconsolethemes; DO NOT EDIT.
#
# Console variant of "peru", for the Linux virtual console.
#
# Nerd Font icons are removed and Powerline separators replaced with ASCII,
# because a console font carries neither. Colors are approximated to the 16
# ANSI colors a console can show, so themes that differ only in shade look
# alike here.
#
# To take this file over, delete the generated marker on the first line: the
# generator then leaves it alone. Otherwise edit peru.prompto.yaml and regenerate.

executiontime:
    foreground: yellow
    options:
        threshold: 10
    template: 'took {{ .FormattedMs }} '
git:
    foreground: lightYellow
    foreground_templates:
        - '{{ if and (gt .Ahead 0) (gt .Behind 0) }}lightYellow{{ end }}'
        - '{{ if gt .Ahead 0 }}green{{ end }}'
        - '{{ if gt .Behind 0 }}lightMagenta{{ end }}'
    options:
        fetch_status: true
        fetch_upstream_icon: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    template: '{{ .UpstreamIcon }}{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }} {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }} {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }} {{ .StashCount }}{{ end }} '
java:
    background: darkGray
    foreground: lightWhite
    leading_separator: ' ('
    template: ' {{ .Full }} '
    trailing_separator: )
node:
    background: white
    foreground: lightWhite
    leading_separator: (
    template: ' {{ .Full }} '
    trailing_separator: )
os:
    foreground: cyan
    template: '{{ if .WSL }}WSL at {{ end }}{{.Icon}} '
    options:
        display_distro_name: true
        android: android
        linux: linux
        macos: mac
path:
    foreground: lightCyan
    options:
        style: full
        windows_registry_icon: reg
    template: '{{ .Path }} '
prompt:
    - segments:
        - os
        - session
        - python
        - git
    - segments:
        - path
        - text
python:
    foreground: cyan
    trailing_separator: '>'
    template: '> ({{ if .Error }}{{ .Error }}{{ else }}{{ if .Venv }}{{ .Venv }} {{ end }}{{ .Major }}.{{ .Minor }}{{ end }}) '
rprompt:
    - segments:
        - node
        - java
        - status
        - executiontime
        - time
session:
    foreground: cyan
    template: '{{ .UserName }}@{{ .HostName }} '
status:
    options:
        always_enabled: true
    template: ' {{ if gt .Code 0 }}<red></>{{ else }}<cyan></>{{ end }} '
text:
    foreground: lightGreen
    template: '> '
time:
    foreground: cyan
    options:
        time_format: "15:04:05"
    template: ' {{ .LastDate | date .Format }} '
