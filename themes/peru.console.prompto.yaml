# Console variant of the `peru` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of peru.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

executiontime:
    foreground: yellow
    options:
        threshold: 10
    template: 'took {{ .FormattedMs }} '
git:
    foreground: lightYellow
    foreground_templates:
        - '{{ if and (gt .Ahead 0) (gt .Behind 0) }}lightYellow{{ end }}'
        - '{{ if gt .Ahead 0 }}green{{ end }}'
        - '{{ if gt .Behind 0 }}lightMagenta{{ end }}'
    options:
        fetch_status: true
        fetch_upstream_icon: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    template: '{{ .UpstreamIcon }}{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }} {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }} {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }} {{ .StashCount }}{{ end }} '
java:
    background: darkGray
    foreground: lightWhite
    leading_separator: ' ('
    template: ' {{ .Full }} '
    trailing_style: rounded
node:
    background: white
    foreground: lightWhite
    leading_style: rounded
    template: ' {{ .Full }} '
    trailing_style: rounded
os:
    foreground: cyan
    template: '{{ if .WSL }}WSL at {{ end }}{{.Icon}} '
    options:
        display_distro_name: true
        android: android
        linux: linux
        macos: mac
path:
    foreground: lightCyan
    options:
        style: full
        windows_registry_icon: reg
    template: '{{ .Path }} '
prompt:
    - segments:
        - os
        - session
        - python
        - git
    - segments:
        - path
        - text
python:
    foreground: cyan
    style: powerline
    template: '> ({{ if .Error }}{{ .Error }}{{ else }}{{ if .Venv }}{{ .Venv }} {{ end }}{{ .Major }}.{{ .Minor }}{{ end }}) '
rprompt:
    - segments:
        - node
        - java
        - status
        - executiontime
        - time
session:
    foreground: cyan
    template: '{{ .UserName }}@{{ .HostName }} '
status:
    options:
        always_enabled: true
    template: ' {{ if gt .Code 0 }}<red></>{{ else }}<cyan></>{{ end }} '
text:
    foreground: lightGreen
    template: '> '
time:
    foreground: cyan
    options:
        time_format: "15:04:05"
    template: ' {{ .LastDate | date .Format }} '
