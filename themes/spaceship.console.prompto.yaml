cursor_padding: true
git:
    foreground: lightMagenta
    options:
        branch_icon: ' <lightMagenta><b> </b></>'
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    template: '<lightWhite>on</> {{ .HEAD }}{{ if gt .StashCount 0 }} {{ .StashCount }}{{ end }} '
path:
    foreground: cyan
    options:
        style: folder
        windows_registry_icon: reg
    template: '<lightWhite>in</> {{ .Path }} '
prompt:
    - segments:
        - session
        - path
        - git
    - segments:
        - text
session:
    foreground: lightYellow
    template: '{{ .UserName }} '
text:
    foreground: lightGreen
    template: '>'
