# Code generated by src/tools/genconsolethemes; DO NOT EDIT.
#
# Console variant of "multiverse-neon", for the Linux virtual console.
#
# Nerd Font icons are removed and Powerline separators replaced with ASCII,
# because a console font carries neither. Colors are approximated to the 16
# ANSI colors a console can show, so themes that differ only in shade look
# alike here.
#
# To take this file over, delete the generated marker on the first line: the
# generator then leaves it alone. Otherwise edit multiverse-neon.prompto.yaml and regenerate.

crystal:
    foreground: lightBlue
    options:
        display_mode: files
        fetch_version: true
    template: ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}'
git:
    background: darkGray
    foreground: lightCyan
    foreground_templates:
        - '{{ if or (.Working.Changed) (.Staging.Changed) }}lightRed{{ end }}'
        - '{{ if and (gt .Ahead 0) (gt .Behind 0) }}lightRed{{ end }}'
        - '{{ if gt .Ahead 0 }}white{{ end }}'
        - '{{ if gt .Behind 0 }}white{{ end }}'
    leading_separator: ' ('
    options:
        branch_template: '{{ trunc 25 .Branch }}'
        fetch_status: true
        fetch_upstream_icon: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    template: ' {{ .UpstreamIcon }}{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }} {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }} {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }} {{ .StashCount }}{{ end }} '
    trailing_separator: )
node:
    foreground: lightGreen
    options:
        display_mode: files
        fetch_package_manager: true
        fetch_version: true
        npm_icon: '<lightRed> npm</> '
        pnpm_icon: '<yellow> pnpm</> '
        yarn_icon: '<cyan> yarn</> '
    template: '{{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }} {{ .Full }}'
path:
    background: darkGray
    foreground: lightGreen
    leading_separator: (
    options:
        style: mixed
        windows_registry_icon: reg
    template: ' {{ .Path }}'
    trailing_separator: )
prompt:
    - segments:
        - path
        - git
        - status
    - segments:
        - text
python:
    foreground: lightYellow
    options:
        display_mode: context
        fetch_virtual_env: false
    template: ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}'
rprompt:
    - segments:
        - node
        - crystal
        - ruby
        - python
ruby:
    foreground: lightRed
    options:
        display_mode: files
        fetch_version: true
    template: ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}'
status:
    foreground: yellow
    template: 'x '
text:
    foreground: lightGreen
    template: '> '
