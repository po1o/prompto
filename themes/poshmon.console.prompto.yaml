# Console variant of the `poshmon` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of poshmon.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

console_title_template: '{{ .Folder }}'
cursor_padding: true
git:
    background: yellow
    background_templates:
        - '{{ if or (.Working.Changed) (.Staging.Changed) }}lightYellow{{ end }}'
        - '{{ if and (gt .Ahead 0) (gt .Behind 0) }}lightRed{{ end }}'
        - '{{ if gt .Ahead 0 }}lightRed{{ end }}'
        - '{{ if gt .Behind 0 }}lightGreen{{ end }}'
    foreground: black
    options:
        fetch_status: true
        fetch_upstream_icon: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    trailing_separator: '>'
    template: ' {{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }} {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }} {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }} {{ .StashCount }}{{ end }} '
go:
    background: lightWhite
    foreground: cyan
    leading_separator: (
    template: ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}'
    trailing_separator: ') '
node:
    background: darkGray
    foreground: darkGray
    leading_separator: (
    options:
        fetch_package_manager: true
        npm_icon: ' <lightRed></> '
        yarn_icon: ' <cyan></>'
    template: ' {{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }}{{ .Full }}'
    trailing_separator: ') '
pwd: osc99
path:
    background: red
    foreground: lightWhite
    options:
        folder_icon: ""
        folder_separator_icon: ' <transparent>></> '
        home_icon: ""
        style: agnoster
        windows_registry_icon: reg
    trailing_separator: '>'
    template: ' {{ path .Path .Location }} '
prompt:
    - segments:
        - session
        - path
        - git
    - segments:
        - text
python:
    background: darkGray
    foreground: lightYellow
    leading_separator: (
    template: ' {{ if .Error }}{{ .Error }}{{ else }}{{ if .Venv }}{{ .Venv }} {{ end }}{{ .Full }}{{ end }}'
    trailing_separator: ') '
rprompt:
    - segments:
        - node
        - python
        - go
        - time
session:
    background: cyan
    foreground: lightWhite
    leading_separator: (
    template: ' {{ .HostName }} '
text:
    foreground: lightWhite
    foreground_templates:
        - '{{ if gt .Code 0 }}red{{ end }}'
    template: ' '
time:
    background: cyan
    background_templates:
        - '{{ if gt .Code 0 }}red{{ end }}'
    foreground: lightWhite
    leading_separator: (
    options:
        time_format: _2, 15:04:05
    template: ' {{ .LastDate | date .Format }} '
    trailing_separator: )
