# Console variant of the `emodipt` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of emodipt.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

git:
    foreground: lightYellow
    options:
        branch_gone_icon: x
        branch_identical_icon: ""
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    template: ' {{ .HEAD }} '
path:
    foreground: white
    options:
        style: agnoster
        windows_registry_icon: reg
    template: ' {{ .Path }} on'
prompt:
    - segments:
        - time
        - root
        - path
        - git
        - status
        - text
root:
    foreground: yellow
    template: ' # '
status:
    foreground: yellow
    template: 'x{{ reason .Code }} '
text:
    foreground: lightRed
    template: '> '
time:
    foreground: white
    options:
        time_format: "15:04:05"
    template: '[{{ .LastDate | date .Format }}]'
