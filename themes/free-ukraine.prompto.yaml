battery:
    background: '#0057b7'
    foreground: '#FBD951'
    leading_separator: 
    options:
        charged_icon: ' '
        charging_icon: ' '
        discharging_icon: ' '
    template: ' {{ if not .Error }}{{ .Icon }}{{ .Percentage }}{{ end }}{{ .Error }}% <#111111></>'
console_title_template: '{{if .Root}}Admin: {{end}} {{.Folder}}'
executiontime:
    background: '#0057b7'
    foreground: '#FBD951'
    leading_separator: 
    options:
        always_enabled: true
    template: '  {{ .FormattedMs }} <#111111></>'
cursor_padding: true
git:
    background: '#0057b7'
    foreground: '#ffd700'
    options:
        fetch_status: true
        fetch_upstream_icon: true
    trailing_separator: ""
    template: '   {{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if and (.Staging.Changed) (.Working.Changed) }} |{{ end }}{{ if .Staging.Changed }}  {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0}} {{ .StashCount }}{{ end }}{{ if gt .WorktreeCount 0}}  {{ .WorktreeCount }}{{ end }} '
git.2:
    background: '#3379c5'
    background_templates:
        - '{{ if or (.Working.Changed) (.Staging.Changed) }}#3379c5{{ end }}'
        - '{{ if and (gt .Ahead 0) (gt .Behind 0) }}#c57f33{{ end }}'
        - '{{ if gt .Ahead 0 }}#79c533{{ end }}'
        - '{{ if gt .Behind 0 }}#c53379{{ end }}'
    foreground: '#0057b7'
    options:
        fetch_status: false
        fetch_upstream_icon: false
    trailing_separator: ""
    template: 
os:
    background: '#0057b7'
    foreground: '#ffd700'
    trailing_separator: ""
    template: ' {{ if .WSL }}WSL at {{ end }}{{.Icon}} '
path:
    background: '#0057b7'
    foreground: '#FBD951'
    options:
        home_icon: 
        style: mixed
    template: '{{ .Path }} '
    trailing_separator: 
prompt:
    - segments:
        - text
    - segments:
        - text.2
        - text.3
        - path
        - git
        - git.2
        - text.4
        - status
    - segments:
        - text.6
        - os
        - root
        - session
root:
    background: '#0057b7'
    foreground: '#FBD951'
    trailing_separator: ""
    template: ' '
rprompt:
    - segments:
        - text.5
        - battery
        - executiontime
        - time
    - segments:
        - text.7
        - text.8
        - text.9
        - text.10
session:
    background: '#FBD951'
    foreground: '#0057b7'
    trailing_separator: ""
    template: ' {{ if .SSHSession }} {{ end }}{{ .UserName }} '
status:
    background: '#ffd700'
    foreground: '#0057b7'
    foreground_templates:
        - '{{ if gt .Code 0 }}#a30000{{ end }}'
    leading_separator: <transparent,#ffd700></>
    options:
        always_enabled: true
    template: ' {{ if gt .Code 0 }}  {{ else }} ♥ {{ end }}'
    trailing_separator: 
text:
    foreground: '#ffffff'
text.2:
    foreground: '#0057b7'
    template: 
text.3:
    background: '#0057b7'
    foreground: '#FBD951'
    trailing_separator: ""
    template: '  '
text.4:
    template: ''
text.5:
    background: '#0057b7'
    foreground: '#FBD951'
    leading_separator: 
    template: '  <#111111></>'
text.6:
    foreground: '#0057b7'
    template: 
text.7:
    foreground: '#0057b7'
    template: 
text.8:
    foreground: '#FBD951'
    template: 
text.9:
    foreground: '#0057b7'
    template: 
text.10:
    foreground: '#FBD951'
    template:   Ukraine
time:
    background: '#0057b7'
    foreground: '#FBD951'
    leading_separator: 
    options:
        time_format: _2,15:04
    template: '  {{ .LastDate | date .Format }}'
    trailing_separator: 
