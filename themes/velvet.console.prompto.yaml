# Console variant of the `velvet` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of velvet.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

console_title_template: '{{ .Shell }} - {{ .Folder }}'
executiontime:
    background: darkGray
    foreground: lightWhite
    options:
        always_enabled: true
    style: powerline
    template: ' {{ .FormattedMs }} '
cursor_padding: true
git:
    background: darkGray
    foreground: lightWhite
    options:
        branch_template: '{{ trunc 25 .Branch }}'
        fetch_status: true
        fetch_upstream_icon: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    style: powerline
    template: ' {{ .UpstreamIcon }}{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }} {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }} {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }} {{ .StashCount }}{{ end }} '
go:
    background: darkGray
    foreground: lightCyan
    leading_separator: ' ('
    options:
        fetch_version: false
    template: '{{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}'
    trailing_style: rounded
java:
    background: darkGray
    foreground: lightRed
    leading_separator: ' ('
    options:
        fetch_version: false
    template: '{{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}'
    trailing_style: rounded
node:
    background: darkGray
    foreground: lightGreen
    leading_separator: ' ('
    options:
        fetch_version: false
    template: '{{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }}{{ .Full }}'
    trailing_style: rounded
os:
    background: black
    foreground: lightWhite
    options:
        arch: arch
        debian: debian
        fedora: fedora
        linux: linux
        macos: macos
        manjaro: manjaro
        opensuse: opensuse
        ubuntu: ubuntu
        windows: windows
        display_distro_name: true
        android: android
    template: ' {{ if .WSL }}WSL at {{ end }}{{.Icon}} '
path:
    background: black
    foreground: lightWhite
    options:
        folder_icon: '...'
        folder_separator_icon: /
        home_icon: "~"
        max_depth: 3
        style: agnoster_short
        windows_registry_icon: reg
    trailing_style: powerline
    template: ' {{ .Path }} '
prompt:
    - segments:
        - os
        - path
        - git
        - executiontime
        - status
    - segments:
        - time
python:
    background: darkGray
    foreground: lightYellow
    leading_separator: ' ('
    options:
        fetch_version: false
    template: '{{ if .Error }}{{ .Error }}{{ else }}{{ if .Venv }}{{ .Venv }} {{ end }}{{ .Full }}{{ end }}'
    trailing_style: rounded
rprompt:
    - segments:
        - python
        - go
        - node
        - ruby
        - java
ruby:
    background: darkGray
    foreground: lightRed
    leading_separator: ' ('
    options:
        fetch_version: false
    template: '{{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}'
    trailing_style: rounded
status:
    background: darkGray
    foreground: lightWhite
    foreground_templates:
        - '{{ if gt .Code 0 }}lightRed{{ end }}'
    options:
        always_enabled: true
    template: ' {{ if gt .Code 0 }} {{.Code}}{{ end }} '
    style: rounded
time:
    background: darkGray
    foreground: lightWhite
    options:
        time_format: "15:04:05"
    template: ' {{ .LastDate | date .Format }} '
    style: rounded
