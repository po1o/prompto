# Console variant of the `onehalf.minimal` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of onehalf.minimal.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

console_title_template: '{{ .UserName }}@{{ .HostName }}'
git:
    options:
        branch_icon: ""
        fetch_status: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    template: <p:yellow>git</>:({{ if or (.Working.Changed) (.Staging.Changed) (gt .StashCount 0) }}<p:magenta>{{ .HEAD }}</>{{ else }}<p:green>{{ .HEAD }}</>{{ end }}{{ if (gt .Ahead 0)}}<p:cyan>{{ .BranchStatus }}</>{{ end }}{{ if (gt .Behind 0)}}<p:cyan>{{ .BranchStatus }}</>{{ end }}{{ if .Staging.Changed }} <p:green>{{ .Staging.String }}</>{{ end }}{{ if .Working.Changed }} <p:red>{{ .Working.String }}</>{{ end }})
palette:
    background: darkGray
    black: darkGray
    blue: white
    cyan: cyan
    foreground: lightWhite
    green: white
    magenta: lightMagenta
    red: lightRed
    white: lightWhite
    yellow: white
path:
    foreground: p:blue
    options:
        style: full
        windows_registry_icon: reg
    template: '{{ .Path }} '
prompt:
    - segments:
        - session
        - path
        - git
    - segments:
        - status
session:
    foreground: p:yellow
    template: '{{ .UserName }}@{{ .HostName }} '
status:
    foreground: p:foreground
    options:
        always_enabled: true
    template: '{{ if gt .Code 0 }}<p:red>({{ .Code }}) </>{{ else }}<p:green>({{ .Code }}) </>{{ end }}> '
terminal_background: p:background
