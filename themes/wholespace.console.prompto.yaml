# Code generated by src/tools/genconsolethemes; DO NOT EDIT.
#
# Console variant of "wholespace", for the Linux virtual console.
#
# Nerd Font icons are removed and Powerline separators replaced with ASCII,
# because a console font carries neither. Colors are approximated to the 16
# ANSI colors a console can show, so themes that differ only in shade look
# alike here.
#
# To take this file over, delete the generated marker on the first line: the
# generator then leaves it alone. Otherwise edit wholespace.prompto.yaml and regenerate.

console_title_template: '{{ .Folder }}'
executiontime:
    background: darkGray
    foreground: lightWhite
    leading_separator: <
    options:
        style: roundrock
        threshold: 0
    template: ' {{ .FormattedMs }} '
    trailing_separator: '>'
git:
    background: cyan
    foreground: black
    leading_separator: <
    options:
        branch_icon: ' '
        fetch_status: true
        fetch_upstream_icon: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    template: ' {{ .UpstreamIcon }}{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }} {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }} {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }} {{ .StashCount }}{{ end }} '
    trailing_separator: '>'
node:
    background: lightWhite
    foreground: black
    leading_separator: <
    options:
        fetch_package_manager: true
        npm_icon: ' <lightRed></> '
        yarn_icon: ' <cyan></>'
    template: ' {{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }}{{ .Full }}'
    trailing_separator: <transparent,lightWhite><</>
os:
    background: lightWhite
    foreground: black
    leading_separator: <
    options:
        macos: ' '
        ubuntu: ' '
        windows: ' '
        display_distro_name: true
        android: android
        linux: linux
    template: ' {{ if .WSL }}WSL at {{ end }}{{.Icon}}'
    trailing_separator: <transparent,lightWhite><</>
path:
    foreground: white
    options:
        folder_icon: ""
        home_icon: home
        style: agnoster_full
        windows_registry_icon: reg
    template: ' {{ .Path }} '
prompt:
    - segments:
        - os
        - time
        - sysinfo
        - sysinfo.2
        - executiontime
    - segments:
        - path
        - status
rprompt:
    - segments:
        - node
        - git
status:
    foreground: lightGreen
    foreground_templates:
        - '{{ if gt .Code 0 }}red{{ end }}'
    options:
        always_enabled: true
    template: ' x '
sysinfo:
    background: lightBlue
    foreground: lightWhite
    leading_separator: <
    template: ' CPU: {{ round .PhysicalPercentUsed .Precision }}% | '
sysinfo.2:
    background: lightBlue
    foreground: lightWhite
    template: 'RAM: {{ (div ((sub .PhysicalTotalMemory .PhysicalAvailableMemory)|float64) 1073741824.0) }}/{{ (div .PhysicalTotalMemory 1073741824.0) }}GB '
    trailing_separator: <transparent,lightBlue><</>
time:
    background: lightWhite
    foreground: black
    leading_separator: <
    options:
        time_format: "15:04:05"
    template: ' * {{ .LastDate | date .Format }} '
    trailing_separator: <transparent,lightWhite><</>
transient:
    - segments:
        - text.transient
text.transient:
    background: transparent
    foreground: lightWhite
    template: ' '
