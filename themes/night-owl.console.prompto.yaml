# Console variant of the `night-owl` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of night-owl.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

angular:
    background: lightWhite
    foreground: red
    leading_style: powerline
    template: ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
    trailing_separator: (
aurelia:
    background: lightWhite
    foreground: magenta
    leading_style: powerline
    template: 'a {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
    trailing_separator: (
aws:
    background: darkGray
    foreground: lightRed
    leading_style: powerline
    template: ' {{ .Profile }}{{ if .Region }}@{{ .Region }}{{ end }} '
    trailing_separator: (
az:
    background: lightWhite
    foreground: cyan
    leading_style: powerline
    template: ' {{ .EnvironmentName }} '
    trailing_separator: (
azfunc:
    background: lightWhite
    foreground: cyan
    leading_style: powerline
    template: '<lightYellow></> {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
    trailing_separator: (
cds:
    background: darkGray
    foreground: black
    leading_style: powerline
    template: ' cds {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
    trailing_separator: (
cf:
    background: lightWhite
    foreground: darkGray
    leading_style: powerline
    template: ' cf {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
    trailing_separator: (
cftarget:
    background: lightWhite
    foreground: darkGray
    leading_style: powerline
    template: ' {{if .Org }}{{ .Org }}{{ end }}{{ if .Space }}/{{ .Space }}{{ end }} '
    trailing_separator: (
cmake:
    background: white
    foreground: green
    leading_style: powerline
    template: '<blue></> <red></> cmake {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
    trailing_separator: (
console_title_template: '{{ .Folder }}'
crystal:
    background: lightWhite
    foreground: black
    leading_style: powerline
    template: ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
    trailing_separator: (
dart:
    background: lightWhite
    foreground: cyan
    leading_style: powerline
    template: ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
    trailing_separator: (
dotnet:
    background: black
    foreground: cyan
    leading_style: powerline
    template: ' {{ if .Unsupported }}{{ else }}{{ .Full }}{{ end }} '
    trailing_separator: (
executiontime:
    background: darkGray
    foreground: lightWhite
    leading_separator: )
    options:
        style: roundrock
        threshold: 0
    template: ' {{ .FormattedMs }}'
    trailing_style: rounded
cursor_padding: true
flutter:
    background: cyan
    foreground: lightWhite
    leading_style: powerline
    template: ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
    trailing_separator: (
git:
    background: white
    background_templates:
        - '{{ if or (.Working.Changed) (.Staging.Changed) }}lightYellow{{ end }}'
        - '{{ if and (gt .Ahead 0) (gt .Behind 0) }}lightRed{{ end }}'
        - '{{ if gt .Ahead 0 }}white{{ end }}'
        - '{{ if gt .Behind 0 }}white{{ end }}'
    foreground: black
    options:
        branch_icon: ' '
        fetch_status: true
        fetch_upstream_icon: true
        mapped_branches:
            bug/*: ' '
            feat/*: ' '
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    style: powerline
    template: ' {{ .UpstreamIcon }} {{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }} {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }} {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }} {{ .StashCount }}{{ end }} '
go:
    background: lightWhite
    foreground: cyan
    leading_style: powerline
    template: ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
    trailing_separator: (
haskell:
    background: black
    foreground: lightBlue
    leading_style: powerline
    template: ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
    trailing_separator: (
java:
    background: lightWhite
    foreground: lightRed
    leading_style: powerline
    template: ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
    trailing_separator: (
julia:
    background: lightBlue
    foreground: lightWhite
    leading_style: powerline
    template: '<yellow></> {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
    trailing_separator: (
kotlin:
    background: lightBlue
    foreground: lightWhite
    leading_style: powerline
    template: 'K {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
    trailing_separator: (
kubectl:
    background: lightBlue
    foreground: lightWhite
    leading_style: powerline
    template: ' {{.Context}} :: {{if .Namespace}}{{.Namespace}}{{else}}default{{end}} '
    trailing_separator: (
lua:
    background: lightWhite
    foreground: blue
    leading_style: powerline
    template: ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
    trailing_separator: (
node:
    background: darkGray
    foreground: darkGray
    leading_style: powerline
    options:
        fetch_package_manager: true
        npm_icon: '<lightRed></> '
        yarn_icon: '<cyan></> '
    template: ' {{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }}{{ .Full }} '
    trailing_separator: (
nx:
    background: white
    foreground: darkGray
    leading_style: powerline
    template: 'Nx {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
    trailing_separator: (
os:
    background: cyan
    foreground: black
    leading_separator: --(
    options:
        windows: windows
        display_distro_name: true
        android: android
        linux: linux
        macos: mac
    template: ' {{ if .WSL }}WSL at {{ end }}{{.Icon}} '
    trailing_style: powerline
path:
    background: white
    foreground: black
    options:
        folder_icon: ' '
        folder_separator_icon: '<black>></> '
        home_icon: ' '
        style: agnoster
        windows_registry_icon: reg
    trailing_style: powerline
    template: '{{ path .Path .Location }}'
perl:
    background: darkGray
    foreground: lightWhite
    leading_style: powerline
    template: ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
    trailing_separator: (
php:
    background: white
    foreground: black
    leading_style: powerline
    template: ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
    trailing_separator: (
prompt:
    - segments:
        - os
        - root
        - path
        - git
        - executiontime
    - segments:
        - text
        - spotify
        - status
python:
    background: darkGray
    foreground: lightYellow
    leading_style: powerline
    template: ' {{ if .Error }}{{ .Error }}{{ else }}{{ if .Venv }}{{ .Venv }} {{ end }}{{ .Full }}{{ end }}'
    trailing_separator: (
r:
    background: white
    foreground: cyan
    leading_style: powerline
    template: 'R {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
    trailing_separator: (
root:
    background: lightRed
    foreground: lightYellow
    style: powerline
    template: ' # '
rprompt:
    - segments:
        - shell
        - sysinfo
        - angular
        - aurelia
        - aws
        - az
        - azfunc
        - cds
        - crystal
        - cf
        - cftarget
        - cmake
        - dart
        - dotnet
        - flutter
        - go
        - haskell
        - java
        - julia
        - kotlin
        - kubectl
        - lua
        - node
        - nx
        - perl
        - php
        - python
        - r
        - ruby
        - rust
        - swift
        - time
ruby:
    background: lightWhite
    foreground: red
    leading_style: powerline
    template: ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
    trailing_separator: (
rust:
    background: lightWhite
    foreground: black
    leading_style: powerline
    template: ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
    trailing_separator: (
shell:
    background: lightWhite
    foreground: black
    leading_style: rounded
    template: ' {{ .Name }} '
    trailing_separator: (
spotify:
    background: green
    foreground: black
    leading_style: rounded
    options:
        playing_icon: ' '
        paused_icon: '|| '
        stopped_icon: '[] '
    template: ' {{ .Icon }}{{ if ne .Status "stopped" }}{{ .Artist }} ~ {{ .Track }}{{ end }} '
    trailing_separator: '( '
status:
    foreground: lightGreen
    foreground_templates:
        - '{{ if gt .Code 0 }}lightRed{{ end }}'
    options:
        always_enabled: true
    template: x
swift:
    background: lightRed
    foreground: lightWhite
    leading_style: powerline
    template: ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
    trailing_separator: (
sysinfo:
    background: lightBlue
    foreground: lightWhite
    leading_style: powerline
    template: ' {{ round .PhysicalPercentUsed .Precision }}% '
    trailing_separator: (
text:
    foreground: cyan
    template: --
time:
    background: darkGray
    foreground: lightWhite
    leading_style: powerline
    options:
        time_format: "15:04:05"
    template: ' {{ .LastDate | date .Format }}'
    trailing_style: rounded
transient:
    - segments:
        - text.transient
text.transient:
    background: transparent
    foreground: lightWhite
    template: ' '
