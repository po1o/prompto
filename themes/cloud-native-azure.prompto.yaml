az:
    background: '#9ec3f0'
    foreground: '#000000'
    trailing_separator: ""
    template: '  Subscription {{ .Name }} ({{ if .EnvironmentName | contains "AzureCloud" }}{{ "Global" }}{{ else }}{{ .EnvironmentName }}{{ end }}) '
battery:
    background: '#f36943'
    background_templates:
        - '{{if eq "Charging" .State.String}}#40c4ff{{end}}'
        - '{{if eq "Discharging" .State.String}}#ff5722{{end}}'
        - '{{if eq "Full" .State.String}}#4caf50{{end}}'
    foreground: '#ffffff'
    options:
        charged_icon: ' '
        charging_icon: ' '
        discharging_icon: ' '
    trailing_separator: ""
    template: ' {{ if not .Error }}{{ .Icon }}{{ .Percentage }}{{ end }}{{ .Error }} '
console_title_template: '{{ .Shell }} in {{ .Folder }}'
cursor_padding: true
git:
    background: '#fffb38'
    background_templates:
        - '{{ if or (.Working.Changed) (.Staging.Changed) }}#FF9248{{ end }}'
        - '{{ if and (gt .Ahead 0) (gt .Behind 0) }}#ff4500{{ end }}'
        - '{{ if gt .Ahead 0 }}#B388FF{{ end }}'
        - '{{ if gt .Behind 0 }}#B388FF{{ end }}'
    foreground: '#193549'
    options:
        fetch_status: true
        fetch_upstream_icon: true
    trailing_separator: ""
    template: ' {{ .UpstreamIcon }}{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }}  {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }}  {{ .StashCount }}{{ end }} '
kubectl:
    background: '#ebcc34'
    foreground: '#000000'
    leading_separator: 
    template: '  Kubernetes {{.Context}} cluster {{if .Namespace}}- {{.Namespace}} namespace{{end}} '
    trailing_separator: 
path:
    background: '#ff479c'
    foreground: '#ffffff'
    options:
        style: folder
    trailing_separator: ""
    template: '   {{ .Path }} '
prompt:
    - segments:
        - session
        - path
        - git
        - status
    - segments:
        - kubectl
        - az
    - segments:
        - text
rprompt:
    - segments:
        - shell
        - battery
        - time
session:
    background: '#c386f1'
    foreground: '#ffffff'
    leading_separator: 
    template: ' {{ if .SSHSession }} {{ end }}{{ .UserName }}@{{ .HostName }} '
    trailing_separator: 
shell:
    background: '#0077c2'
    foreground: '#ffffff'
    template: <#0077c2,transparent></>  {{ .Name }} <transparent,#0077c2></>
status:
    background: '#2e9599'
    background_templates:
        - '{{ if gt .Code 0 }}#f1184c{{ end }}'
    foreground: '#ffffff'
    leading_separator: <transparent,background></>
    options:
        always_enabled: true
    template: '  {{ if gt .Code 0 }} {{ reason .Code }}{{ else }}{{ end }} '
    trailing_separator: 
text:
    foreground: '#E06C75'
    template: ' ~ '
time:
    background: '#2e9599'
    foreground: '#111111'
    leading_separator: 
    template: '  {{ .LastDate | date .Format }} '
    trailing_separator: 
