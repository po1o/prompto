# Code generated by src/tools/genconsolethemes; DO NOT EDIT.
#
# Console variant of "illusi0n", for the Linux virtual console.
#
# Nerd Font icons are removed and Powerline separators replaced with ASCII,
# because a console font carries neither. Colors are approximated to the 16
# ANSI colors a console can show, so themes that differ only in shade look
# alike here.
#
# To take this file over, delete the generated marker on the first line: the
# generator then leaves it alone. Otherwise edit illusi0n.prompto.yaml and regenerate.

git:
    foreground: lightCyan
    foreground_templates:
        - '{{ if or (.Working.Changed) (.Staging.Changed) }}lightBlue{{ end }}'
        - '{{ if and (gt .Ahead 0) (gt .Behind 0) }}lightBlue{{ end }}'
        - '{{ if gt .Ahead 0 }}lightBlue{{ end }}'
        - '{{ if gt .Behind 0 }}lightMagenta{{ end }}'
    options:
        branch_template: '{{ trunc 25 .Branch }}'
        fetch_status: true
        fetch_upstream_icon: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    template: '<lightRed>on</> {{.UpstreamIcon }}{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }} {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }} {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }} {{ .StashCount }}{{ end }} '
os:
    foreground: lightRed
    options:
        macos: mac
        display_distro_name: true
        android: android
        linux: linux
    template: '{{ if .WSL }}WSL at {{ end }}{{.Icon}} '
path:
    foreground: lightCyan
    options:
        folder_separator_icon: /
        style: full
        windows_registry_icon: reg
prompt:
    - segments:
        - os
        - text
        - session
        - path
        - git
        - text.2
rprompt:
    - segments:
        - sysinfo
        - sysinfo.2
session:
    foreground: lightRed
    template: '{{ .UserName }}:'
sysinfo:
    foreground: lightRed
    template: '{{ round .PhysicalPercentUsed .Precision }}% '
sysinfo.2:
    foreground: lightRed
    template: '{{ (div ((sub .PhysicalTotalMemory .PhysicalAvailableMemory)|float64) 1073741824.0) }}/{{ (div .PhysicalTotalMemory 1073741824.0) }}GB '
text:
    foreground: lightRed
    template: $
text.2:
    foreground: lightRed
    template: '> '
