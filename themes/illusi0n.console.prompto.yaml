# Console variant of the `illusi0n` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of illusi0n.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

git:
    foreground: lightCyan
    foreground_templates:
        - '{{ if or (.Working.Changed) (.Staging.Changed) }}lightBlue{{ end }}'
        - '{{ if and (gt .Ahead 0) (gt .Behind 0) }}lightBlue{{ end }}'
        - '{{ if gt .Ahead 0 }}lightBlue{{ end }}'
        - '{{ if gt .Behind 0 }}lightMagenta{{ end }}'
    options:
        branch_template: '{{ trunc 25 .Branch }}'
        fetch_status: true
        fetch_upstream_icon: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    template: '<lightRed>on</> {{.UpstreamIcon }}{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }} {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }} {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }} {{ .StashCount }}{{ end }} '
os:
    foreground: lightRed
    options:
        macos: mac
        display_distro_name: true
        android: android
        linux: linux
    template: '{{ if .WSL }}WSL at {{ end }}{{.Icon}} '
path:
    foreground: lightCyan
    options:
        folder_separator_icon: /
        style: full
        windows_registry_icon: reg
prompt:
    - segments:
        - os
        - text
        - session
        - path
        - git
        - text.2
rprompt:
    - segments:
        - sysinfo
        - sysinfo.2
session:
    foreground: lightRed
    template: '{{ .UserName }}:'
sysinfo:
    foreground: lightRed
    template: '{{ round .PhysicalPercentUsed .Precision }}% '
sysinfo.2:
    foreground: lightRed
    template: '{{ (div ((sub .PhysicalTotalMemory .PhysicalAvailableMemory)|float64) 1073741824.0) }}/{{ (div .PhysicalTotalMemory 1073741824.0) }}GB '
text:
    foreground: lightRed
    template: $
text.2:
    foreground: lightRed
    template: '> '
