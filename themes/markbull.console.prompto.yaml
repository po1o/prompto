# Console variant of the `markbull` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of markbull.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

console_title_template: '{{if .Root}}! {{end}}{{.Folder}}'
executiontime:
    background: cyan
    foreground: lightWhite
    options:
        always_enabled: true
    style: powerline
    template: ' {{ .FormattedMs }} '
cursor_padding: true
git:
    background: lightWhite
    background_templates:
        - '{{ if or (.Working.Changed) (.Staging.Changed) }}lightYellow{{ end }}'
        - '{{ if and (gt .Ahead 0) (gt .Behind 0) }}lightYellow{{ end }}'
        - '{{ if gt .Ahead 0 }}lightGreen{{ end }}'
        - '{{ if gt .Behind 0 }}white{{ end }}'
        - '{{ if .UpstreamGone }}white{{ end }}'
    foreground: black
    options:
        azure_devops_icon: ' '
        bitbucket_icon: ' '
        branch_gone_icon: ' '
        branch_icon: ' '
        branch_identical_icon: ' '
        commit_icon: ' '
        fetch_status: true
        fetch_upstream_icon: true
        git_icon: ' '
        github_icon: ' '
        gitlab_icon: ' '
        tag_icon: ' '
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
    style: powerline
    template: ' {{ if( .UpstreamIcon ) }}{{ url .UpstreamIcon .UpstreamURL }} {{ end }}{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }} <lightRed> {{.Working.String}}</>{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }} <darkGray> {{.Staging.String}}</>{{ end }}{{ if gt .StashCount 0 }} {{.StashCount}}{{ end }}{{ if gt .WorktreeCount 0 }}{{if .IsWorkTree}}<green>{{ end }} {{if .IsWorkTree}}</>{{ end }}{{.WorktreeCount}}{{ end }} '
os:
    background: lightMagenta
    foreground: lightWhite
    options:
        windows: windows
        display_distro_name: true
        android: android
        linux: linux
        macos: mac
    style: powerline
    template: ' {{ if .WSL }}WSL at {{ end }}{{.Icon}} '
path:
    background: lightMagenta
    foreground: lightWhite
    options:
        style: full
        windows_registry_icon: reg
    trailing_style: powerline
    template: '{{ path .Path .Location }} '
prompt:
    - segments:
        - text
        - session
        - os
        - path
        - git
        - executiontime
        - status
    - segments:
        - text.2
        - text.3
session:
    background: lightYellow
    foreground: black
    style: powerline
    template: ' {{ if .SSHSession }} {{ end }}{{ .UserName }}@{{ .HostName }} '
status:
    background: lightRed
    foreground: lightWhite
    style: powerline
    template: ' >>{{ reason .Code }} '
text:
    foreground: lightYellow
    template: '- '
text.2:
    foreground: lightYellow
    template: '-'
text.3:
    foreground: lightWhite
    template: ' $'
