git:
    options:
        branch_icon: ""
    template: '<#ffffff>on</> {{ .HEAD }}{{ if gt .StashCount 0 }}  {{ .StashCount }}{{ end }} '
go:
    foreground: '#7FD5EA'
    trailing_separator: ""
    template: '[ {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}] '
java:
    foreground: '#ea2d2e'
    trailing_separator: ""
    template: '[ {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}] '
julia:
    foreground: '#4063D8'
    trailing_separator: ""
    template: '  {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
node:
    foreground: '#76b367'
    trailing_separator: ""
    template: '[ {{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }}{{ .Full }}] '
os:
    foreground: '#26C6DA'
    options:
        macos: mac
    template: '{{ if .WSL }}WSL at {{ end }}{{.Icon}}'
path:
    foreground: lightGreen
    options:
        style: folder
    template: '{{ .Path }} '
prompt:
    - segments:
        - os
        - session
        - path
        - git
        - python
        - go
        - node
        - ruby
        - java
        - julia
        - text
python:
    foreground: '#906cff'
    trailing_separator: ""
    template: '[ {{ if .Error }}{{ .Error }}{{ else }}{{ if .Venv }}{{ .Venv }} {{ end }}{{ .Full }}{{ end }}] '
ruby:
    foreground: '#f44336'
    trailing_separator: ""
    template: '[{{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}] '
session:
    foreground: '#26C6DA'
    template: ' {{ .UserName }}: '
text:
    foreground: '#FFD54F'
    template: '❯ '
