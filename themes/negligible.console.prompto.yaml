# Console variant of the `negligible` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of negligible.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

battery:
    foreground_templates:
        - '{{if eq "Charging" .State.String}}lightGreen{{end}}'
        - '{{if eq "Discharging" .State.String}}lightCyan{{end}}'
        - '{{if eq "Full" .State.String}}red{{end}}'
    options:
        charged_icon: ' '
        charging_icon: ' '
    style: powerline
    template: '| {{ if not .Error }}{{ .Icon }}{{ .Percentage }}{{ end }}{{ .Error }} '
dart:
    foreground: cyan
    style: powerline
    template: '| {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
git:
    foreground: lightRed
    options:
        fetch_status: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    template: ':: {{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Staging.Changed }} {{ .Staging.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Working.Changed }} {{ .Working.String }}{{ end }} '
node:
    foreground: white
    style: powerline
    template: '| {{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }}{{ .Full }} '
os:
    foreground: cyan
    style: powerline
    template: '{{ if .WSL }}WSL at {{ end }}{{.Icon}}'
    options:
        display_distro_name: true
        android: android
        linux: linux
        macos: mac
path:
    foreground: cyan
    options:
        style: full
        windows_registry_icon: reg
    template: ' {{ .Path }} '
prompt:
    - segments:
        - os
        - path
        - git
    - segments:
        - status
python:
    foreground: cyan
    options:
        display_mode: context
        fetch_virtual_env: true
    template: '| {{ .Venv }} '
root:
    foreground: red
    template: '| root '
rprompt:
    - segments:
        - root
        - dart
        - node
        - python
        - battery
        - time
status:
    foreground: lightGreen
    foreground_templates:
        - '{{ if gt .Code 0 }}red{{ end }}'
    options:
        always_enabled: true
    style: powerline
    template: '> '
time:
    foreground: lightGreen
    template: '| {{ .LastDate | date .Format }} '
