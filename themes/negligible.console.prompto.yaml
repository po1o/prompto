# Code generated by src/tools/genconsolethemes; DO NOT EDIT.
#
# Console variant of "negligible", for the Linux virtual console.
#
# Nerd Font icons are removed and Powerline separators replaced with ASCII,
# because a console font carries neither. Colors are approximated to the 16
# ANSI colors a console can show, so themes that differ only in shade look
# alike here.
#
# To take this file over, delete the generated marker on the first line: the
# generator then leaves it alone. Otherwise edit negligible.prompto.yaml and regenerate.

battery:
    foreground_templates:
        - '{{if eq "Charging" .State.String}}lightGreen{{end}}'
        - '{{if eq "Discharging" .State.String}}lightCyan{{end}}'
        - '{{if eq "Full" .State.String}}red{{end}}'
    options:
        charged_icon: ' '
        charging_icon: ' '
    trailing_separator: '>'
    template: '| {{ if not .Error }}{{ .Icon }}{{ .Percentage }}{{ end }}{{ .Error }} '
dart:
    foreground: cyan
    trailing_separator: '>'
    template: '| {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
git:
    foreground: lightRed
    options:
        fetch_status: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    template: ':: {{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Staging.Changed }} {{ .Staging.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Working.Changed }} {{ .Working.String }}{{ end }} '
node:
    foreground: white
    trailing_separator: '>'
    template: '| {{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }}{{ .Full }} '
os:
    foreground: cyan
    trailing_separator: '>'
    template: '{{ if .WSL }}WSL at {{ end }}{{.Icon}}'
    options:
        display_distro_name: true
        android: android
        linux: linux
        macos: mac
path:
    foreground: cyan
    options:
        style: full
        windows_registry_icon: reg
    template: ' {{ .Path }} '
prompt:
    - segments:
        - os
        - path
        - git
    - segments:
        - status
python:
    foreground: cyan
    options:
        display_mode: context
        fetch_virtual_env: true
    template: '| {{ .Venv }} '
root:
    foreground: red
    template: '| root '
rprompt:
    - segments:
        - root
        - dart
        - node
        - python
        - battery
        - time
status:
    foreground: lightGreen
    foreground_templates:
        - '{{ if gt .Code 0 }}red{{ end }}'
    options:
        always_enabled: true
    trailing_separator: '>'
    template: '> '
time:
    foreground: lightGreen
    template: '| {{ .LastDate | date .Format }} '
