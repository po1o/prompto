# Console variant of the `jonnychipz` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of jonnychipz.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

az:
    background: blue
    foreground: lightWhite
    template: ' {{ .Name }} '
    trailing_separator: '>'
console_title_template: '{{if .Root}}root :: {{end}}{{.Shell}} :: {{.Folder}}'
cursor_padding: true
git:
    background: lightWhite
    foreground: black
    foreground_templates:
        - '{{ if or (.Working.Changed) (.Staging.Changed) }}lightYellow{{ end }}'
        - '{{ if gt .Ahead 0 }}cyan{{ end }}'
        - '{{ if gt .Behind 0 }}lightBlue{{ end }}'
    options:
        fetch_status: true
        fetch_upstream_icon: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    template: '<black>> </>{{ .UpstreamIcon }}{{ .HEAD }}{{ if .Staging.Changed }}<lightGreen> {{ .Staging.String }}</>{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Working.Changed }}<lightRed> {{ .Working.String }}</>{{ end }} '
os:
    background: lightWhite
    foreground: black
    leading_separator: '>>'
    options:
        alpine: alpine
        arch: arch
        centos: centos
        debian: debian
        elementary: elementary
        fedora: fedora
        gentoo: gentoo
        linux: linux
        macos: macos
        manjaro: manjaro
        mint: mint
        opensuse: opensuse
        raspbian: raspbian
        ubuntu: ubuntu
        windows: windows
        display_distro_name: true
        android: android
    template: ' {{ if .WSL }} on {{ end }}{{ .Icon }}<black> ></>'
path:
    background: lightWhite
    foreground: black
    options:
        folder_icon: <black> </>
        folder_separator_icon: <black>> </>
        home_icon: ' '
        style: agnoster_short
        windows_registry_icon: reg
    template: '<black> </>{{ .Path }} '
prompt:
    - segments:
        - text
        - session
        - az
        - status
    - segments:
        - os
        - root
        - path
        - git
        - terraform
        - text.2
    - segments:
        - text.3
root:
    background: black
    foreground: lightWhite
    template: ' <lightWhite> ></>'
session:
    background: blue
    foreground: lightWhite
    leading_separator: (
    template: ' {{ .UserName }}@{{ .HostName }} '
    trailing_separator: '>'
status:
    background: blue
    background_templates:
        - '{{ if gt .Code 0 }}lightRed{{ end }}'
    foreground: lightWhite
    leading_separator: <transparent>></>
    options:
        always_enabled: true
    template: ' x '
    trailing_separator: )
terraform:
    background: lightWhite
    foreground: black
    trailing_separator: '>'
    template: ' {{ .WorkspaceName }} '
text:
    background: blue
    foreground: black
    leading_separator: '>>'
text.2:
    background: lightWhite
    foreground: black
    trailing_separator: '>'
text.3:
    foreground: blue
    template: ' > '
