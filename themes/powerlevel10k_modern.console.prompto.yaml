# Console variant of the `powerlevel10k_modern` theme, for the Linux virtual console.
#
# A console font carries no Nerd Font glyphs and the console shows 16
# colors, so this file uses ASCII separators in place of Powerline ones,
# drops the icons outright, and names its colors rather than giving hex.
# Themes that differ only in shade therefore look alike here.
#
# Edit this file directly. It is the console prompt in its own right,
# not a derived copy of powerlevel10k_modern.prompto.yaml: changes there do not reach
# it. Keep it to ASCII and the 16 ANSI color names, or it will not render.

git:
    background: lightYellow
    foreground: black
    style: powerline
    template: ' {{ .HEAD }} '
    options:
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
go:
    background: lightCyan
    foreground: lightWhite
    leading_style: rounded
    template: ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} <transparent>(</>'
os:
    background: lightWhite
    foreground: black
    leading_style: rounded
    template: ' {{ if .WSL }}WSL at {{ end }}{{.Icon}} '
    trailing_style: rounded
    options:
        display_distro_name: true
        android: android
        linux: linux
        macos: mac
path:
    background: blue
    foreground: lightWhite
    options:
        style: full
        windows_registry_icon: reg
    trailing_style: powerline
    template: ' {{ .Path }} '
prompt:
    - segments:
        - os
        - root
        - path
        - git
    - segments:
        - status
python:
    background: lightYellow
    foreground: black
    leading_style: rounded
    template: ' {{ if .Error }}{{ .Error }}{{ else }}{{ if .Venv }}{{ .Venv }} {{ end }}{{ .Full }}{{ end }} <transparent>(</>'
root:
    background: blue
    foreground: black
    options:
        style: full
    trailing_style: powerline
    template: ' # '
rprompt:
    - segments:
        - python
        - go
        - time
status:
    foreground: lightYellow
    foreground_templates:
        - '{{ if gt .Code 0 }}lightRed{{ end }}'
    options:
        always_enabled: true
    template: '> '
time:
    background: lightWhite
    foreground: black
    leading_style: rounded
    options:
        time_format: "15:04:05"
    template: ' {{ .LastDate | date .Format }} '
    trailing_style: rounded
