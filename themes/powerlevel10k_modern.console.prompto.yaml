# Code generated by src/tools/genconsolethemes; DO NOT EDIT.
#
# Console variant of "powerlevel10k_modern", for the Linux virtual console.
#
# Nerd Font icons are removed and Powerline separators replaced with ASCII,
# because a console font carries neither. Colors are approximated to the 16
# ANSI colors a console can show, so themes that differ only in shade look
# alike here.
#
# To take this file over, delete the generated marker on the first line: the
# generator then leaves it alone. Otherwise edit powerlevel10k_modern.prompto.yaml and regenerate.

git:
    background: lightYellow
    foreground: black
    trailing_separator: '>'
    template: ' {{ .HEAD }} '
    options:
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
go:
    background: lightCyan
    foreground: lightWhite
    leading_separator: (
    template: ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} <transparent>(</>'
os:
    background: lightWhite
    foreground: black
    leading_separator: (
    template: ' {{ if .WSL }}WSL at {{ end }}{{.Icon}} '
    trailing_separator: )
    options:
        display_distro_name: true
        android: android
        linux: linux
        macos: mac
path:
    background: blue
    foreground: lightWhite
    options:
        style: full
        windows_registry_icon: reg
    trailing_separator: '>'
    template: ' {{ .Path }} '
prompt:
    - segments:
        - os
        - root
        - path
        - git
    - segments:
        - status
python:
    background: lightYellow
    foreground: black
    leading_separator: (
    template: ' {{ if .Error }}{{ .Error }}{{ else }}{{ if .Venv }}{{ .Venv }} {{ end }}{{ .Full }}{{ end }} <transparent>(</>'
root:
    background: blue
    foreground: black
    options:
        style: full
    trailing_separator: '>'
    template: ' # '
rprompt:
    - segments:
        - python
        - go
        - time
status:
    foreground: lightYellow
    foreground_templates:
        - '{{ if gt .Code 0 }}lightRed{{ end }}'
    options:
        always_enabled: true
    template: '> '
time:
    background: lightWhite
    foreground: black
    leading_separator: (
    options:
        time_format: "15:04:05"
    template: ' {{ .LastDate | date .Format }} '
    trailing_separator: )
