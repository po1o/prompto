# Code generated by src/tools/genconsolethemes; DO NOT EDIT.
#
# Console variant of "grandpa-style", for the Linux virtual console.
#
# Nerd Font icons are removed and Powerline separators replaced with ASCII,
# because a console font carries neither. Colors are approximated to the 16
# ANSI colors a console can show, so themes that differ only in shade look
# alike here.
#
# To take this file over, delete the generated marker on the first line: the
# generator then leaves it alone. Otherwise edit grandpa-style.prompto.yaml and regenerate.

console_title_template: '{{if .Root}} ! {{end}}{{.Folder | replace "~" "~" }} @ {{.HostName}}'
executiontime:
    background: cyan
    foreground: darkGray
    leading_separator: <parentBackground,background>></>
    options:
        style: dallas
        threshold: 0
    template: ' {{ .FormattedMs }}s '
git:
    background: green
    background_templates:
        - '{{ if or (.Working.Changed) (.Staging.Changed) }}lightYellow{{ end }}'
        - '{{ if and (gt .Ahead 0) (gt .Behind 0) }}lightYellow{{ end }}'
        - '{{ if gt .Ahead 0 }}white{{ end }}'
        - '{{ if gt .Behind 0 }}white{{ end }}'
    foreground: black
    leading_separator: <parentBackground,background>></>
    options:
        fetch_status: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    template: ' {{ .HEAD }}{{ if .Staging.Changed }}<lightRed> {{ .Staging.String }}</>{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Working.Changed }} {{ .Working.String }}{{ end }}{{ if gt .StashCount 0 }} {{ .StashCount }}{{ end }} '
os:
    background: transparent
    foreground: lightWhite
    template: '{{ if .WSL }}WSL at {{ end }}{{.Icon}} '
    options:
        display_distro_name: true
        android: android
        linux: linux
        macos: mac
path:
    background: darkGray
    foreground: lightCyan
    options:
        folder_icon: '...'
        folder_separator_icon: <transparent> \ </>
        home_icon: ""
        style: agnoster_short
        windows_registry_icon: reg
    template: ' {{ .Path }} '
prompt:
    - segments:
        - root
        - os
        - path
        - git
        - executiontime
        - status
    - segments:
        - status.2
root:
    background: black
    foreground: red
    template: ' ! '
rprompt:
    - segments:
        - session
        - time
session:
    background: darkGray
    foreground: lightCyan
    leading_separator: '|'
    template: ' {{ if .SSHSession }} {{ end }}{{ .UserName }}<transparent> / </>{{ .HostName }}'
status:
    background: red
    foreground: lightWhite
    options:
        always_enabled: true
    template: '{{ if gt .Code 0 }}<parentBackground,background>></><transparent> </> {{ reason .Code }} <background,transparent>></>{{ else }}<parentBackground,transparent>></>{{ end }}'
status.2:
    foreground: lightWhite
    foreground_templates:
        - '{{ if gt .Code 0 }}red{{ end }}'
    options:
        always_enabled: true
    template: '> '
time:
    background: darkGray
    foreground: lightCyan
    options:
        time_format: 3:04:05 PM
    template: '<transparent> // </>{{ .LastDate | date .Format }} '
