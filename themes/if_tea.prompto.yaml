console_title_template: '{{ .Folder }}'
executiontime:
    background: '#2343e2'
    foreground: '#ffffff'
    leading_separator: 
    options:
        style: roundrock
        threshold: 0
    template: ' {{ .FormattedMs }} '
    trailing_separator: 
git:
    background: '#ee79d1'
    foreground: '#000000'
    leading_separator: 
    options:
        branch_icon: ' '
        fetch_status: true
        fetch_upstream_icon: true
    template: ' {{ .UpstreamIcon }}{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }}  {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }}  {{ .StashCount }}{{ end }} '
    trailing_separator: 
os:
    foreground: '#1865f5'
    options:
        alpine: 
        arch: 
        centos: 
        debian: 
        elementary: 
        fedora: 
        gentoo: 
        linux: 
        macos: ' '
        manjaro: 
        mint: 
        opensuse: 
        raspbian: 
        ubuntu: ' '
        windows: ' '
    template: ' {{ if .WSL }}WSL at {{ end }}{{.Icon}}'
    trailing_separator: <transparent,></>
path:
    background: '#f8677b'
    foreground: '#000000'
    leading_separator: <transparent,#F8677b></>
    options:
        folder_icon: ' '
        folder_separator_icon: '  '
        home_icon: 
        style: agnoster_full
    template: '  {{ .Path }} '
    trailing_separator: 
prompt:
    - segments:
        - os
        - sysinfo
        - sysinfo.2
        - executiontime
    - segments:
        - text
        - shell
        - time
        - root
        - path
    - segments:
        - status
root:
    options:
        root_icon: ' '
    template: '  '
rprompt:
    - segments:
        - git
shell:
    background: '#91f2ff'
    foreground: '#000000'
    leading_separator: 
    template: '  {{ .Name }} '
    trailing_separator: <transparent,#91f2ff></>
status:
    foreground: '#00BCF9'
    foreground_templates:
        - '{{ if gt .Code 0 }}#ef5350{{ end }}'
    options:
        always_enabled: true
    template: '╰─  '
sysinfo:
    background: '#00c7fc'
    foreground: '#000000'
    leading_separator: <transparent,#00c7fc></>
    template: '  CPU: {{ round .PhysicalPercentUsed .Precision }}% | '
sysinfo.2:
    background: '#00c7fc'
    foreground: '#000000'
    template: 'RAM: {{ (div ((sub .PhysicalTotalMemory .PhysicalAvailableMemory)|float64) 1073741824.0) }}/{{ (div .PhysicalTotalMemory 1073741824.0) }}GB  '
    trailing_separator: <transparent,#00c7fc></>
text:
    foreground: '#91f2ff'
    template: ╭─
time:
    background: '#ff8c94'
    foreground: '#000000'
    leading_separator: 
    options:
        time_format: 3:04:05 PM | Monday
    template: '  {{ .LastDate | date .Format }}  '
    trailing_separator: 
transient:
    - segments:
        - text.transient
text.transient:
    background: transparent
    foreground: '#FEF5ED'
    template: ' '
