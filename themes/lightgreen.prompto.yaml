aws:
    background: '#565656'
    foreground: '#faa029'
    leading_separator: 
    template:  {{.Profile}}{{if .Region}}@{{.Region}}{{end}}
    trailing_separator: ' '
battery:
    background: '#f36943'
    background_templates:
        - '{{if eq "Charging" .State.String}}#b8e994{{end}}'
        - '{{if eq "Discharging" .State.String}}#fff34e{{end}}'
        - '{{if eq "Full" .State.String}}#33DD2D{{end}}'
    foreground: '#262626'
    options:
        charged_icon: ' '
        charging_icon: ' '
        discharging_icon: ' '
    template: ' {{ if not .Error }}{{ .Icon }}{{ .Percentage }}{{ end }}{{ .Error }} <#262626></>'
executiontime:
    options:
        always_enabled: true
        style: roundrock
    template: '{{ .FormattedMs }} '
git:
    background: '#272727'
    foreground: '#00ff0d'
    options:
        fetch_status: true
    template: '<#000000> </>{{ .HEAD }}{{ if .Staging.Changed }}<#FF6F00>  {{ .Staging.String }}</>{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if gt .StashCount 0 }}  {{ .StashCount }}{{ end }} '
go:
    background: '#ffffff'
    foreground: '#06aad5'
    leading_separator: 
    template:  {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}
    trailing_separator: ' '
kubectl:
    background: '#316ce4'
    foreground: '#ffffff'
    leading_separator: 
    template: ' {{.Context}}{{if .Namespace}} :: {{.Namespace}}{{end}}'
    trailing_separator: 
os:
    background: transparent
    foreground: '#ffffff'
    options:
        alpine: 
        arch: 
        centos: 
        debian: 
        elementary: 
        fedora: 
        gentoo: 
        linux: 
        macos: 
        manjaro: 
        mint: 
        opensuse: 
        raspbian: 
        ubuntu: 
        windows: 
    template: ' {{ if .WSL }}WSL at {{ end }}{{.Icon}} '
path:
    background: '#272727'
    foreground: '#3EC669'
    leading_separator: 
    options:
        style: folder
    template:  {{ .Path }}
    trailing_separator: 
prompt:
    - segments:
        - root
        - os
        - path
        - git
        - python
        - go
        - aws
        - terraform
        - kubectl
pwd: osc99
python:
    background: '#306998'
    foreground: '#FFE873'
    leading_separator: 
    template:  {{ if .Error }}{{ .Error }}{{ else }}{{ if .Venv }}{{ .Venv }} {{ end }}{{ .Full }}{{ end }}
    trailing_separator: ' '
root:
    background: '#000000'
    foreground: '#dd1e1e'
    template: ' ⚡'
rprompt:
    - segments:
        - executiontime
        - sysinfo
        - battery
        - time
sysinfo:
    background: '#ffffff'
    foreground: '#3c3c3c'
    template: ' {{ round .PhysicalPercentUsed .Precision }}% '
terraform:
    background: '#ebcc34'
    foreground: '#000000'
    trailing_separator: ""
    template: '{{.WorkspaceName}}'
time:
    background: '#000000'
    foreground: lightGreen
    template: '{{ .LastDate | date .Format }}'
