# Code generated by src/tools/genconsolethemes; DO NOT EDIT.
#
# Console variant of "easy-term", for the Linux virtual console.
#
# Nerd Font icons are removed and Powerline separators replaced with ASCII,
# because a console font carries neither. Colors are approximated to the 16
# ANSI colors a console can show, so themes that differ only in shade look
# alike here.
#
# To take this file over, delete the generated marker on the first line: the
# generator then leaves it alone. Otherwise edit easy-term.prompto.yaml and regenerate.

executiontime:
    background: white
    foreground: darkGray
    leading_separator: <
    options:
        style: austin
        threshold: 150
    template: 't {{ .FormattedMs }} '
    trailing_separator: '>'
cursor_padding: true
git:
    background: darkGray
    foreground: lightCyan
    foreground_templates:
        - '{{ if or (.Working.Changed) (.Staging.Changed) }}lightRed{{ end }}'
        - '{{ if and (gt .Ahead 0) (gt .Behind 0) }}lightRed{{ end }}'
        - '{{ if gt .Ahead 0 }}white{{ end }}'
        - '{{ if gt .Behind 0 }}white{{ end }}'
    options:
        branch_template: '{{ trunc 25 .Branch }}'
        fetch_status: true
        fetch_upstream_icon: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    template: ' {{ .UpstreamIcon }}{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }} {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }} {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }} {{ .StashCount }}{{ end }} '
    trailing_separator: )
node:
    foreground: lightGreen
    options:
        fetch_version: true
    trailing_separator: '>'
    template: <white> | </><white></> {{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }}{{ .Full }}
npm:
    foreground: lightGreen
    trailing_separator: '>'
    template: <white> | </><white> </> {{ .Full }}
os:
    background: cyan
    foreground: lightWhite
    leading_separator: --<
    options:
        alpine: alpine
        arch: arch
        centos: centos
        debian: debian
        elementary: elementary
        fedora: fedora
        gentoo: gentoo
        linux: linux
        macos: macos
        manjaro: manjaro
        mint: mint
        opensuse: opensuse
        raspbian: raspbian
        ubuntu: ubuntu
        windows: windows
        display_distro_name: true
        android: android
    template: ' {{ if .WSL }} on {{ end }}{{ .Icon }} '
path:
    background: lightBlue
    foreground: lightWhite
    options:
        style: folder
        windows_registry_icon: reg
    trailing_separator: '>'
    template: ' {{ .Path }} '
php:
    foreground: lightGreen
    trailing_separator: '>'
    template: <white> | </><white></> {{ .Full }}
prompt:
    - segments:
        - os
        - text
        - path
        - git
    - segments:
        - text.2
rprompt:
    - segments:
        - sysinfo
        - node
        - php
        - npm
        - sysinfo.2
        - executiontime
        - time
sysinfo:
    foreground: lightGreen
    template: <white> | </><white>RAM:</> {{ (div ((sub .PhysicalTotalMemory .PhysicalAvailableMemory)|float64) 1073741824.0) }}/{{ (div .PhysicalTotalMemory 1073741824.0) }}GB
sysinfo.2:
    foreground: lightGreen
    trailing_separator: '>'
    template: <> </>
text:
    background: lightRed
    foreground: lightWhite
    template: ' ~ '
text.2:
    foreground: cyan
    template: --
time:
    background: white
    foreground: darkGray
    leading_separator: <
    options:
        time_format: "15:04:05"
    template: 't {{ .LastDate | date .Format }} '
    trailing_separator: '>'
