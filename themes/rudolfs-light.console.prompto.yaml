# Code generated by src/tools/genconsolethemes; DO NOT EDIT.
#
# Console variant of "rudolfs-light", for the Linux virtual console.
#
# Nerd Font icons are removed and Powerline separators replaced with ASCII,
# because a console font carries neither. Colors are approximated to the 16
# ANSI colors a console can show, so themes that differ only in shade look
# alike here.
#
# To take this file over, delete the generated marker on the first line: the
# generator then leaves it alone. Otherwise edit rudolfs-light.prompto.yaml and regenerate.

git:
    background: lightWhite
    foreground: darkGray
    foreground_templates:
        - '{{ if or (.Working.Changed) (.Staging.Changed) }}black{{ end }}'
        - '{{ if or (gt .Ahead 0) (gt .Behind 0) }}darkGray{{ end }}'
    options:
        branch_template: '{{ trunc 30 .Branch }}'
        fetch_status: true
        fetch_upstream_icon: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        branch_icon: ""
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    template: ' [{{ .UpstreamIcon }}{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}<yellow> {{ .Working.String }}</>{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }}<black> {{ .Staging.String }}</>{{ end }}] '
os:
    background: lightWhite
    foreground: yellow
    template: ' {{ .Icon }} '
    options:
        display_distro_name: true
        android: android
        linux: linux
        macos: mac
path:
    background: lightWhite
    foreground: darkGray
    options:
        style: full
        windows_registry_icon: reg
    template: ' {{ .Path }}'
prompt:
    - segments:
        - root
        - os
        - session
        - git
        - path
        - python
        - text
python:
    background: lightWhite
    foreground: darkGray
    options:
        text: '>'
    template: ' {{ if .Error }}{{ .Error }}{{ else }}{{ if .Venv }}{{ .Venv }} {{ end }}{{ .Full }}{{ end }} '
root:
    background: lightWhite
    foreground: red
    template: ' # '
session:
    background: lightWhite
    foreground: darkGray
    template: '{{ .UserName }}'
text:
    foreground: lightWhite
    template: '> '
