executiontime:
    background: '#4d4d4d'
    foreground: '#ffffff'
    options:
        style: dallas
        threshold: 0
    template: '<#000000> </>{{ .FormattedMs }}s '
    trailing_separator: 
cursor_padding: true
git:
    background: '#4d4d4d'
    foreground: '#00ff0d'
    options:
        fetch_status: true
    template: '<#000000> </>{{ .HEAD }}{{ if .Staging.Changed }}<#FF6F00>  {{ .Staging.String }}</>{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if gt .StashCount 0 }}  {{ .StashCount }}{{ end }} '
os:
    background: '#000000'
    foreground: '#ffffff'
    options:
        alpine: 
        arch: 
        centos: 
        debian: 
        elementary: 
        fedora: 
        gentoo: 
        linux: 
        macos: 
        manjaro: 
        mint: 
        opensuse: 
        raspbian: 
        ubuntu: 
        windows: 
    template: ' {{ if .WSL }}WSL at {{ end }}{{.Icon}} '
path:
    background: '#4d4d4d'
    foreground: '#43CCEA'
    options:
        folder_icon: 
        folder_separator_icon: <transparent>  </>
        home_icon: 
        style: agnoster_short
    template: ' {{ .Path }} '
prompt:
    - segments:
        - root
        - os
        - path
        - git
        - executiontime
    - segments:
        - status
root:
    background: '#000000'
    foreground: '#dd1e1e'
    template: ' ⚡'
rprompt:
    - segments:
        - session
        - time
session:
    background: '#4d4d4d'
    foreground: '#43CCEA'
    leading_separator: 
    template: ' {{ if .SSHSession }} {{ end }}{{ .UserName }}<transparent> / </>{{ .HostName }}'
status:
    foreground: '#00ff0d'
    foreground_templates:
        - '{{ if gt .Code 0 }}#ff0000{{ end }}'
    options:
        always_enabled: true
    template: ' '
time:
    background: '#4d4d4d'
    foreground: '#43CCEA'
    options:
        time_format: 3:04:05 PM
    template: '<#000000>  </>{{ .LastDate | date .Format }} '
    trailing_separator: 
