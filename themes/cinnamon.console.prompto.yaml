# alike here.
#
# To take this file over, delete the generated marker on the first line: the
# generator then leaves it alone. Otherwise edit cinnamon.prompto.yaml and regenerate.

cursor_padding: true
git:
    background: magenta
    foreground: lightWhite
    options:
        branch_icon: ""
        fetch_upstream_icon: true
        azure_devops_icon: 'az '
        bitbucket_icon: 'bb '
        cherry_pick_icon: 'pick '
        codeberg_icon: 'cb '
        codecommit_icon: 'cc '
        commit_icon: '@'
        git_icon: 'git '
        github_icon: 'gh '
        gitlab_icon: 'gl '
        merge_icon: 'merge '
        no_commits_icon: 'empty '
        rebase_icon: 'rebase '
        revert_icon: 'revert '
        tag_icon: '#'
    template: ' {{ .UpstreamIcon }}{{ .HEAD }} '
path:
    background: green
    foreground: lightWhite
    options:
        style: folder
        windows_registry_icon: reg
    template: ' {{ .Path }} '
prompt:
    - segments:
        - session
        - path
        - git
        - spotify
        - status
session:
    background: darkGray
    foreground: lightWhite
    leading_separator: (
    template: ' {{ .UserName }}@{{ .HostName }} '
spotify:
    background: darkGray
    foreground: lightWhite
    options:
        paused_icon: ' '
        playing_icon: ' '
        stopped_icon: ' '
    template: ' {{ .Icon }}{{ if ne .Status "stopped" }}{{ .Artist }} - {{ .Track }}{{ end }} '
status:
    background: black
    background_templates:
        - '{{ if gt .Code 0 }}lightRed{{ end }}'
    foreground: lightWhite
    options:
        always_enabled: true
    template: ' x '
    trailing_separator: )
