cursor_padding: true
git:
    foreground: '#43CCEA'
    options:
        branch_icon: ""
    template: <#ffffff> ⚡ </><b>{{ .HEAD }}</b>
path:
    foreground: '#F1FA8C'
    options:
        style: folder
    template: <#42E66C> </><b>{{ .Path }}</b>
prompt:
    - segments:
        - path
        - git
        - text
    - segments:
        - text.2
text:
    foreground: '#ff0000'
    template: <#ff0000> ◉</>
text.2:
    foreground: '#FFFFFF'
    template: '>'
