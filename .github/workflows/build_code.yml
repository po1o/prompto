on:
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'COPYING'
      - '.github/*.md'
      - '.github/FUNDING.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

name: Build Code
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}/src
    steps:
    - name: Checkout code 👋
      uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
    - name: Install Go 🗳
      uses: ./.github/workflows/composite/bootstrap-go
    - name: Install Protobuf 🧬
      uses: ./.github/workflows/composite/bootstrap-protobuf
    - name: Generate Code
      run: go generate ./...
    - name: Verify Generated Code
      run: |
        if ! git diff --exit-code -- .; then
          git --no-pager diff --stat
          echo "generated files are out of date"
          exit 1
        fi
    # Lint tool versions are pinned via the `tool` directive in src/go.mod.
    - name: Golangci-lint
      run: go tool golangci-lint run
    - name: Fieldalignment
      run: go list ./... | grep -v '/daemon/ipc$' | xargs go tool fieldalignment
    - name: Modernize
      run: go list ./... | grep -v '/daemon/ipc$' | xargs go tool modernize
    - name: Run GoReleaser 🚀
      uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
      with:
        distribution: goreleaser
        version: v2.3.2
        args: build --clean --snapshot
        workdir: src
    - name: Archive production artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: builds
        retention-days: 1
        path: |
          src/dist
