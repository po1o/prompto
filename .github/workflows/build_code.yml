on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

name: Build Code
jobs:
  # `build` is a required status check. We gate it here with a job-level `if`
  # instead of a workflow-level `paths-ignore`: a docs-only PR then *skips*
  # build, which GitHub reports as a passing required check. A workflow skipped
  # by paths-ignore would instead never post its context and leave the required
  # check Pending forever, permanently blocking the PR.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
    - name: Checkout code 👋
      uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      with:
        fetch-depth: 0
    - name: Detect code changes
      id: filter
      shell: bash
      run: |
        set -uo pipefail
        base='${{ github.event.pull_request.base.sha }}'
        # Fail safe: if we cannot resolve the base, assume code changed so the
        # heavy jobs still run rather than being silently skipped.
        if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
          echo "base sha $base not in history; assuming code changed" >&2
          echo "code=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        files=$(git diff --name-only "$base" HEAD)
        echo "changed files:"; printf '%s\n' "$files"
        # Docs-only paths that must NOT trigger build/validate (mirrors the old
        # paths-ignore list in this and the Validate Code workflow).
        docs='^(README\.md|CONTRIBUTING\.md|COPYING|\.github/[^/]*\.md|\.github/FUNDING\.yml)$'
        if [ -z "$files" ]; then
          echo "code=false" >> "$GITHUB_OUTPUT"
        elif printf '%s\n' "$files" | grep -qvE "$docs"; then
          echo "code=true" >> "$GITHUB_OUTPUT"
        else
          echo "code=false" >> "$GITHUB_OUTPUT"
        fi

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}/src
    steps:
    - name: Checkout code 👋
      uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
    - name: Install Go 🗳
      uses: ./.github/workflows/composite/bootstrap-go
    - name: Install Protobuf 🧬
      uses: ./.github/workflows/composite/bootstrap-protobuf
    - name: Generate Code
      run: go generate ./...
    - name: Verify Generated Code
      run: |
        if ! git diff --exit-code -- .; then
          git --no-pager diff --stat
          echo "generated files are out of date"
          exit 1
        fi
    # Lint tool versions are pinned via the `tool` directive in src/go.mod.
    - name: Golangci-lint
      run: go tool golangci-lint run
    - name: Fieldalignment
      run: go list ./... | grep -v '/daemon/ipc$' | xargs go tool fieldalignment
    - name: Modernize
      run: go list ./... | grep -v '/daemon/ipc$' | xargs go tool modernize
    - name: Run GoReleaser 🚀
      uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
      with:
        distribution: goreleaser
        version: v2.3.2
        args: build --clean --snapshot
        workdir: src
    - name: Archive production artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: builds
        retention-days: 1
        path: |
          src/dist
