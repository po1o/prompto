on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

name: Validate Code
jobs:
  # `validate-unix (...)` legs are required status checks. We gate them here
  # with a job-level `if` instead of a workflow-level `paths-ignore`: a docs-only
  # PR then *skips* validate-unix, which GitHub reports as a passing required
  # check. A workflow skipped by paths-ignore would instead never post its
  # context and leave the required check Pending forever, blocking the PR.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
    - name: Checkout code
      uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      with:
        fetch-depth: 0
    - name: Detect code changes
      id: filter
      shell: bash
      run: |
        set -uo pipefail
        base='${{ github.event.pull_request.base.sha }}'
        # Fail safe: if we cannot resolve the base, assume code changed so the
        # heavy jobs still run rather than being silently skipped.
        if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
          echo "base sha $base not in history; assuming code changed" >&2
          echo "code=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        files=$(git diff --name-only "$base" HEAD)
        echo "changed files:"; printf '%s\n' "$files"
        # Docs-only paths that must NOT trigger build/validate (mirrors the old
        # paths-ignore list in this and the Build Code workflow).
        docs='^(README\.md|CONTRIBUTING\.md|COPYING|\.github/[^/]*\.md|\.github/FUNDING\.yml)$'
        if [ -z "$files" ]; then
          echo "code=false" >> "$GITHUB_OUTPUT"
        elif printf '%s\n' "$files" | grep -qvE "$docs"; then
          echo "code=true" >> "$GITHUB_OUTPUT"
        else
          echo "code=false" >> "$GITHUB_OUTPUT"
        fi

  validate-unix:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash
          - os: macos-latest
            shell: /bin/zsh --no-rcs -eo pipefail {0}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
        working-directory: ${{ github.workspace }}/src
    steps:
    - name: Checkout code
      uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
    - name: Install Go 🗳
      uses: ./.github/workflows/composite/bootstrap-go
    # Generated code (*.pb.go, bundled_gen.go) is committed, so this job builds
    # against it directly — no protoc/generate needed. Drift (generated vs
    # source) is verified once, in the Build Code workflow.
    # Lint tool versions are pinned via the `tool` directive in src/go.mod —
    # bump them with `go get -tool <pkg>@<ver>`. CI and local devs run the same
    # binaries by construction.
    - name: Golangci-lint
      run: go tool golangci-lint run
    - name: Fieldalignment
      run: go list ./... | grep -v '/daemon/ipc$' | xargs go tool fieldalignment
    - name: Modernize
      run: go list ./... | grep -v '/daemon/ipc$' | xargs go tool modernize
    - name: Unit Tests
      run: go test -count=1 -v ./...
    - name: Race Tests
      run: go test -race -count=3 ./daemon/... ./log/...
