on:
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'COPYING'
      - '.github/*.md'
      - '.github/FUNDING.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

name: Validate Code
jobs:
  validate-unix:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash
          - os: macos-latest
            shell: /bin/zsh --no-rcs -eo pipefail {0}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
        working-directory: ${{ github.workspace }}/src
    steps:
    - name: Checkout code
      uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
    - name: Install Go 🗳
      uses: ./.github/workflows/composite/bootstrap-go
    - name: Install Protobuf 🧬
      uses: ./.github/workflows/composite/bootstrap-protobuf
    - name: Generate Code
      run: go generate ./...
    - name: Verify Generated Code
      run: |
        if ! git diff --exit-code -- .; then
          git --no-pager diff --stat
          echo "generated files are out of date"
          exit 1
        fi
    # Lint tool versions are pinned via the `tool` directive in src/go.mod —
    # bump them with `go get -tool <pkg>@<ver>`. CI and local devs run the same
    # binaries by construction.
    - name: Golangci-lint
      run: go tool golangci-lint run
    - name: Fieldalignment
      run: go list ./... | grep -v '/daemon/ipc$' | xargs go tool fieldalignment
    - name: Modernize
      run: go list ./... | grep -v '/daemon/ipc$' | xargs go tool modernize
    - name: Unit Tests
      run: go test -count=1 -v ./...
    - name: Race Tests
      run: go test -race -count=3 ./daemon/... ./log/...
