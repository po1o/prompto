name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v. Required when running manually.
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout code 👋
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version='${{ inputs.version }}'
          if [[ -z "$version" ]]; then
            ref='${{ github.ref_name }}'
            if [[ "$ref" == v* ]]; then
              version="${ref#v}"
            fi
          fi

          if [[ -z "$version" ]]; then
            echo 'manual runs require the version input' >&2
            exit 1
          fi

          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Install Go 🗳
        uses: ./.github/workflows/composite/bootstrap-go
      # Generated code (*.pb.go, bundled_gen.go) is committed, so GoReleaser
      # builds against it directly — no protoc/generate needed. Drift is gated
      # on every PR into main by the Build Code workflow; a tag only ever points
      # at an already-verified commit, so re-checking it here catches nothing.
      # Lint tool versions are pinned via the `tool` directive in src/go.mod.
      - name: Golangci-lint
        working-directory: ${{ github.workspace }}/src
        run: go tool golangci-lint run
      - name: Fieldalignment
        working-directory: ${{ github.workspace }}/src
        run: go list ./... | grep -v '/daemon/ipc$' | xargs go tool fieldalignment
      - name: Modernize
        working-directory: ${{ github.workspace }}/src
        run: go list ./... | grep -v '/daemon/ipc$' | xargs go tool modernize

      - name: Run GoReleaser 🚀
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
        with:
          distribution: goreleaser
          version: v2.3.2
          args: release --clean
          workdir: src
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-homebrew:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Notify tap repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          HOMEBREW_TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        with:
          github-token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          script: |
            const tapRepo = process.env.HOMEBREW_TAP_REPO || `${context.repo.owner}/homebrew`;
            const [owner, repo] = tapRepo.split('/');

            if (!owner || !repo) {
              throw new Error(`invalid tap repository: ${tapRepo}`);
            }

            const version = (process.env.RELEASE_VERSION || '').replace(/^v/, '');
            if (!version) {
              throw new Error('could not determine release version');
            }

            await github.request('POST /repos/{owner}/{repo}/actions/workflows/{workflow_id}/dispatches', {
              owner,
              repo,
              workflow_id: 'release.yml',
              ref: 'main',
              inputs: { version },
            });
