name: Dependencies

on: [pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go-mod:
    name: tidy-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}/src
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Go 🗳
        uses: ./.github/workflows/composite/bootstrap-go
      # Generated code is committed, so `go mod tidy` sees protobuf's direct
      # importer without running `go generate`. Generated-vs-source drift is
      # verified once, in the Code workflow.
      - name: Check for unused dependencies
        run: go tool task tidy:check
