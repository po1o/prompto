name: Go Mod

on: [pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go-mod:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}/src
    steps:
    - name: Checkout code
      uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
    - name: Install Go 🗳
      uses: ./.github/workflows/composite/bootstrap-go
    # Generated code is committed, so `go mod tidy` sees protobuf's direct
    # importer without running `go generate`. Generated-vs-source drift is
    # verified once, in the Build Code workflow.
    - name: Check for unused dependencies
      run: |
        go mod tidy
        if ! git diff --exit-code -- go.mod go.sum; then
          git --no-pager diff -- go.mod go.sum
          echo "go mod tidy is needed"
          exit 1
        fi
        echo "Nothing to tidy"
