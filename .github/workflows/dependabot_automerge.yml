name: Dependabot Auto-Merge

# Arms GitHub's native auto-merge for Dependabot PRs, so a patch/minor bump
# merges itself once the required checks are green (majors are left for a manual
# look). The merge is armed with a short-lived token minted from the auto-merge
# GitHub App — NOT the default GITHUB_TOKEN. That is deliberate: the ruleset
# requires 1 review for everyone, and only the App is a bypass actor, so only
# Dependabot's PRs skip the review. github-actions is not a bypass actor, so no
# ordinary GITHUB_TOKEN workflow can merge without a review.
#
# The App key lives in the *Dependabot* secret store, which GitHub exposes only
# to Dependabot-triggered runs — so a human PR (even a write collaborator's)
# cannot mint this token and cannot use the bypass. Reuses the same App and
# secrets as dependabot_tidy.yml; the App needs Pull requests: write (plus the
# Contents: write it already has).
#
# Requires "Allow auto-merge" ON (`task setup` enables it) and the App's numeric
# App ID set as a ruleset bypass actor (`task setup:branch-protection`).
#
# Security: this job runs no dependency code — only `gh pr merge` against the
# API. It also runs ONLY for Dependabot's own PRs.

on:
  pull_request:
    types: [opened, reopened, synchronize]

# The GITHUB_TOKEN needs nothing here — all API calls use the App token.
permissions: {}

jobs:
  automerge:
    # Gate on the PR author, not github.actor (which flips to a human on re-runs).
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Mint a short-lived token from the auto-merge GitHub App
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.TIDY_APP_CLIENT_ID }}
          private-key: ${{ secrets.TIDY_APP_PRIVATE_KEY }}
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
      # Patch and minor bumps auto-merge; majors are left open for a manual look.
      # For a grouped PR, fetch-metadata reports the highest bump in the group, so
      # a group containing any major is excluded too.
      - name: Enable auto-merge for non-major Dependabot PRs
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
